<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Werkstatt Auftragserfassung</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16181B">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2A1Z">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#16181B; --steel:#1E2125; --steel-2:#272B30;
    --amber:#F5A623; --green:#4CC38A; --red:#E5534B; --blue:#6FA3D8; --purple:#B3A6E6;
    --ink:#ECEFF3; --ink-dim:#8B95A3; --faint:#5C6571; --line:#33383E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--graphite); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  .app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  /* Bilgisayarda geniş düzen: içinde .layout-wide olan ekranlar (Chef
     paneli, Mitarbeiterbericht, çalışan ekranı) 520px sınırından çıkar. */
  @media (min-width:900px){
    .app:has(.layout-wide){ max-width:1240px; }
    .app:has(.layout-wide) main{ padding:24px 32px 60px; }
    .app:has(.layout-wide) header{ padding-left:32px; padding-right:32px; }
  }
  header{ padding:calc(20px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; }
  header .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:0 0 4px; }
  header .eyebrow .cross{ color:#7C8B9C; }
  h1{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px; margin:0; line-height:1; }
  .logout-btn{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:11px; padding:6px 10px; border-radius:6px; cursor:pointer; white-space:nowrap; margin-top:4px; }
  nav{ display:flex; border-bottom:1px solid var(--line); }
  nav button{ flex:1; background:none; border:none; color:var(--ink-dim); font-weight:600; font-size:14px; padding:14px 8px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.active{ color:var(--amber); border-bottom-color:var(--amber); }
  main{ flex:1; padding:20px; padding-bottom:60px; }
  .card{ background:var(--steel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  select, input{ width:100%; background:var(--steel-2); border:1px solid var(--line); color:var(--ink); font-family:'Inter',sans-serif; font-size:16px; padding:14px; border-radius:8px; margin-bottom:14px; }
  select:focus, input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .job-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:340px; overflow-y:auto; }
  .job-btn{
    background:var(--steel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px;
    padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .job-btn .code{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .job-btn .dur{ font-size:11px; color:var(--ink-dim); }
  .job-btn-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .job-btn .job-price{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  .job-btn.selected .job-price{ color:var(--amber); opacity:.85; }
  .job-btn.selected{ border-color:var(--amber); background:rgba(245,166,35,0.12); }
  .job-btn.selected .code{ color:var(--amber); }
  .mts-tag{ font-size:9px; background:rgba(91,155,213,0.18); color:var(--blue); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .qty-tag{ font-size:9px; background:rgba(155,126,222,0.18); color:var(--purple); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .job-btn .qty-count{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  button.primary{ width:100%; background:var(--amber); color:#1B1E21; border:none; font-weight:700; font-size:16px; padding:16px; border-radius:8px; cursor:pointer; }
  button.primary:disabled{ background:var(--steel-2); color:var(--ink-dim); cursor:not-allowed; }
  button.secondary{ width:100%; background:var(--steel-2); color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:14px; padding:12px; border-radius:8px; cursor:pointer; }
  .hours-row{ display:flex; gap:10px; align-items:center; }
  .hours-row input{ margin-bottom:0; }
  .hours-saved{ font-family:'JetBrains Mono',monospace; color:var(--green); font-size:14px; text-align:center; padding:8px 0; }
  .entry-list{ display:flex; flex-direction:column; gap:8px; }
  .entry{ display:flex; justify-content:space-between; align-items:center; background:var(--steel-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .entry .code{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber); margin-right:8px; }
  .entry .ref{ font-family:'JetBrains Mono',monospace; color:var(--ink); font-size:13px; }
  .entry .extra{ font-size:11px; background:rgba(228,87,46,0.15); color:var(--red); padding:3px 8px; border-radius:20px; font-family:'JetBrains Mono',monospace; margin-left:6px; }
  .entry .right{ display:flex; align-items:center; gap:8px; }
  .del-btn{ background:none; border:1px solid var(--line); color:var(--red); font-size:14px; width:28px; height:28px; border-radius:6px; cursor:pointer; line-height:1; }
  .empty{ text-align:center; color:var(--ink-dim); padding:30px 10px; }
  .empty .big{ font-family:'Barlow Condensed',sans-serif; font-size:20px; color:var(--ink); margin-bottom:6px; }
  .summary-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .top-row{ display:flex; justify-content:space-between; }
  .summary-row .name{ font-weight:600; }
  .summary-row .sub{ font-size:11px; color:var(--ink-dim); }
  .summary-row .stat{ font-family:'JetBrains Mono',monospace; text-align:right; }
  .stat .n{ font-size:16px; font-weight:700; }
  .stat .label{ font-size:10px; color:var(--ink-dim); display:block; }
  .cap-bar{ height:6px; background:var(--steel-2); border-radius:3px; margin-top:6px; overflow:hidden; }
  .cap-fill{ height:100%; background:var(--green); }
  .cap-fill.over{ background:var(--red); }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{ text-align:left; font-size:10px; text-transform:uppercase; color:var(--ink-dim); padding:8px 4px; border-bottom:1px solid var(--line); }
  td{ padding:9px 4px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; }
  .pin-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; }
  .pin-screen input{ max-width:160px; text-align:center; letter-spacing:.3em; font-family:'JetBrains Mono',monospace; font-size:20px; }
  .login-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; text-align:center; }
  .login-screen .box{ width:100%; max-width:320px; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--steel-2); border:1px solid var(--amber); color:var(--ink); padding:12px 20px; border-radius:8px; font-size:14px; z-index:100; }
  .refresh{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px; padding:8px 12px; border-radius:6px; cursor:pointer; margin-bottom:14px; }
  .revenue-total{ text-align:center; padding:6px 0 2px; font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; }
  .revenue-total-net{ text-align:center; padding:0 0 14px; font-size:11px; color:var(--ink-dim); }

  /* ---- Chef paneli (v7.2) ---- */
  .mono{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  .dash{ display:flex; flex-direction:column; }
  .range-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .range-top label{ margin:0; }
  .range-actions{ display:flex; gap:8px; }
  .icon-btn{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .range-sub{ font-size:12px; color:var(--ink-dim); }
  .filter-toggle{ display:inline-flex; align-items:center; gap:6px; }
  .filter-toggle .dot{ width:7px; height:7px; border-radius:50%; background:var(--blue); display:inline-block; }
  .filter-panel{ display:none; margin-top:14px; }
  .filter-panel.open{ display:block; }
  .hero .hero-total.revenue-total{ text-align:left; font-size:34px; padding:4px 0 2px; letter-spacing:-.02em; }
  .hero .revenue-total-net{ text-align:left; padding:0; font-size:13px; }
  .hero .revenue-total-net b{ color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:600; }
  .stackbar{ display:flex; height:10px; border-radius:6px; overflow:hidden; gap:2px; margin:16px 0 12px; background:var(--steel-2); }
  .stackbar i{ display:block; height:100%; }
  .legend{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:11.5px; color:var(--ink-dim); }
  .legend b{ display:block; color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13.5px; margin-top:2px; font-weight:600; }
  .sw{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:0; }
  .c-apz{ background:var(--amber); } .c-mts{ background:var(--blue); } .c-privat{ background:var(--purple); }
  .apz-head{ padding-bottom:14px; border-bottom:1px solid var(--line); }
  .apz-head .sub{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  .apz-head .apz-desc{ font-size:12px; color:var(--faint); margin-top:3px; }
  .apz-head .amount{ font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; margin-top:8px; letter-spacing:-.02em; }
  .apz-head .net{ font-size:13px; color:var(--ink-dim); margin-top:2px; }
  .davon{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; margin:14px 0 2px; }
  .brk-row{ margin-top:12px; }
  .brk-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; }
  .brk-top .amount{ font-family:'JetBrains Mono',monospace; font-weight:600; white-space:nowrap; }
  .brk-meta{ display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--faint); margin-top:1px; }
  .brk-meta .net{ font-family:'JetBrains Mono',monospace; white-space:nowrap; }
  .hbar{ height:5px; background:var(--steel-2); border-radius:3px; margin-top:6px; overflow:hidden; }
  .hbar i{ display:block; height:100%; border-radius:3px; background:var(--amber); }
  .hbar i.b1{ background:#F8C36B; } .hbar i.b2{ background:#FBDDA6; } .hbar i.blue{ background:var(--blue); }
  .side-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .side-col .card{ margin-bottom:0; }
  .side-col .net-formula{ grid-column:1 / -1; font-size:12.5px; color:var(--ink-dim); padding:12px 16px; }
  .side-col .net-formula b{ color:var(--ink); font-family:'JetBrains Mono',monospace; }
  .kpi .sub{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; }
  .kpi .amount{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; margin-top:6px; }
  .kpi.mts .amount{ color:var(--blue); } .kpi.privat .amount{ color:var(--purple); }
  .kpi .hint{ font-size:11.5px; color:var(--faint); margin-top:2px; }
  .warn-row{ margin-top:12px; font-size:12.5px; color:var(--amber); background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.25); border-radius:10px; padding:8px 10px; display:flex; justify-content:space-between; gap:8px; }
  .report-list{ display:flex; flex-direction:column; }
  .report-link{ display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none; border-top:1px solid var(--line); color:var(--ink); font-size:14.5px; font-family:'Inter',sans-serif; padding:13px 0; cursor:pointer; text-align:left; }
  .report-link:first-child{ border-top:none; padding-top:4px; }
  .report-link small{ color:var(--ink-dim); font-size:12px; margin-left:6px; }
  .report-link .chev{ color:var(--faint); }
  .report-link.accent{ color:var(--blue); }
  .push-row{ border-top:1px solid var(--line); margin-top:4px; padding-top:12px; }
  .entries-card td:first-child, .daily-card td:first-child{ white-space:nowrap; }
  @media (max-width:899px){
    .dash > .berichte-card{ order:20; }
  }
  @media (min-width:900px){
    .filter-toggle{ display:none; }
    .filter-panel, .filter-panel.open{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
    .filter-panel .search-wrap{ margin-top:4px; }
    .dash{ display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:16px; align-items:start; }
    .dash > *{ grid-column:1 / -1; }
    .dash > .hero{ grid-column:span 4; }
    .dash > .apz-card{ grid-column:span 5; }
    .dash > .side-col{ grid-column:span 3; grid-template-columns:1fr; }
    .dash{ grid-auto-flow:row dense; }
    .dash > .branch-card{ grid-column:1 / span 4; }
    .dash > .berichte-card{ grid-column:1 / span 4; }
    .dash > .summary-card{ grid-column:5 / span 8; grid-row:span 2; }
    .dash > .daily-card{ grid-column:1 / -1; }
    .dash > .entries-card{ order:10; }
    .dash.dash-empty > *{ grid-column:1 / -1; }
  }
  /* ---- Standort (Vorarbeiter) ---- */
  .standort-pick{ padding-bottom:12px; }
  .standort-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .standort-chip{ background:var(--steel-2); border:1px solid var(--line); color:var(--ink); border-radius:22px; padding:9px 14px; cursor:pointer; font:inherit; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; }
  .standort-chip .chip-mark{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; color:var(--green); }
  .standort-chip.selected{ border-color:var(--amber); background:rgba(245,166,35,0.15); color:var(--amber); }
  .standort-banner{ background:rgba(245,166,35,0.12); border:1px solid var(--amber); color:var(--ink); border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:16px; }
  .standort-banner b{ color:var(--amber); font-size:18px; }
  .standort-banner .mono{ color:var(--ink-dim); font-size:12px; margin-left:6px; }
  .standort-branch-note{ font-size:12.5px; color:var(--ink-dim); margin:0 0 14px; }
  .standort-branches{ display:flex; flex-direction:column; gap:8px; }
  .standort-branch-btn.selected{ border-color:#6FA3D8; color:#AAB6C2; }
  .standort-hint{ padding:24px 10px; }
  /* ---- Zugänge verwalten ---- */
  .access-intro{ font-size:12.5px; color:var(--ink-dim); margin:-4px 0 10px; }
  .access-list{ display:flex; flex-direction:column; }
  .access-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .access-row:last-child{ border-bottom:none; }
  .access-who{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .access-who .nm{ font-weight:600; font-size:14px; }
  .access-who .ak{ font-size:11px; color:var(--ink-dim); }
  .access-status{ font-size:11.5px; white-space:nowrap; }
  .access-status.ok{ color:var(--green); }
  .access-status.warn{ color:var(--amber); }
  .access-form{ border-top:1px solid var(--line); margin-top:10px; padding-top:12px; }
  .access-form-title{ font-size:14px; margin-bottom:10px; }
  .access-pw-row{ display:flex; gap:8px; align-items:center; }
  .access-pw-row input{ margin-bottom:0; font-size:17px; letter-spacing:.04em; }
  .access-note{ font-size:11.5px; color:var(--ink-dim); margin:8px 0 12px; }
  .access-actions{ display:flex; gap:8px; }
  /* ---- Push-Mitteilungen ---- */
  .emp-push-wrap{ margin-bottom:14px; }
  .emp-push-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px; font-size:13px; }
  .emp-push-row .ok{ color:var(--green); }
  .emp-push-hint{ font-size:11.5px; color:var(--ink-dim); margin-top:6px; padding:0 2px; }
  .announce-send{ border-top:1px solid var(--line); margin-top:12px; padding-top:12px; }
  .announce-send summary{ cursor:pointer; font-weight:600; font-size:14px; color:var(--amber); list-style:none; }
  .announce-send summary::-webkit-details-marker{ display:none; }
  .announce-send .as-group{ margin-top:12px; }
  .announce-send .as-check{ display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink); margin-bottom:6px; }
  .announce-send .as-check input{ width:auto; margin:0; }
  .announce-send input[type=text]{ margin-bottom:6px; padding:10px 12px; font-size:14px; }
  .announce-send textarea{ width:100%; background:var(--steel-2); border:1px solid var(--line); color:var(--ink); font-family:'Inter',sans-serif; font-size:13.5px; padding:10px 12px; border-radius:8px; resize:vertical; }
  .announce-send .as-note{ font-size:11.5px; color:var(--ink-dim); margin:8px 0 10px; }
  /* ---- Mitarbeiterbericht (v7.2) ---- */
  .only-desk{ display:none; }
  .report-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .rep-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .rep-month{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; line-height:1.1; }
  .month-nav{ display:flex; align-items:center; gap:6px; }
  .month-nav input{ margin-bottom:0; padding:10px 12px; font-size:15px; width:auto; }
  .month-nav .icon-btn{ width:40px; height:40px; font-size:18px; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .rep-stats{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:16px; }
  .rep-stats > div{ background:var(--steel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .rep-stats > div:first-child{ grid-column:1 / -1; }
  .rep-stats .k{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .rep-stats .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; }
  .rep-stats > div:first-child .v{ font-size:22px; color:var(--amber); }
  .sort-chips{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .sort-label{ font-size:12px; color:var(--ink-dim); margin-right:2px; }
  .rep-warn{ display:block; font-size:11.5px; color:var(--amber); margin-top:6px; }
  .rep-note{ font-size:12px; color:var(--ink-dim); padding:0 4px 20px; line-height:1.5; }
  .rep-table th.num, .rep-table td.num{ text-align:right; white-space:nowrap; }
  .rep-table td.strong{ font-weight:700; }
  .rep-table td .over{ color:var(--red); }
  .rep-table td.cats{ font-family:'Inter',sans-serif; font-size:11.5px; color:var(--ink-dim); }
  .rep-table .emp-cell .nm{ display:block; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; }
  .rep-table .emp-cell .ak{ display:block; font-size:11px; color:var(--ink-dim); }
  .rep-table tfoot td{ font-weight:700; border-top:2px solid var(--line); border-bottom:none; }
  @media (min-width:900px){
    .only-mobile{ display:none; }
    .only-desk{ display:block; }
    .rep-stats{ grid-template-columns:repeat(5, minmax(0,1fr)); }
    .rep-stats > div:first-child{ grid-column:auto; }
  }
  /* ---- Sürüm duyurusu (v7.2) ---- */
  .announce{ padding:16px 20px 0; }
  .announce-inner{ background:linear-gradient(135deg, rgba(245,166,35,0.10), rgba(111,163,216,0.08)); border:1px solid rgba(245,166,35,0.45); border-radius:14px; padding:16px 18px; }
  .ann-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:0 0 6px; }
  .ann-eyebrow .cross{ color:#7C8B9C; }

// DİKKAT: new Date().toISOString() UTC tarihini döndürür. Almanya her

const SUPABASE_PAGE_SIZE = 1000

// Supabase/PostgREST tek sorguda varsayılan olarak en fazla 1000 satır
// döndürür. .order('created_at', {ascending:false}) ile çekilen geniş
// tarih aralığı raporlarında (Dieser Monat, Zeitraum wählen, MTS/Privat-
// kunden Raporu) toplam satır sayısı 1000'i geçince EN ESKİ kayıtlar
// hatasız/sessizce düşüyor ve ciro tutarsız/eksik çıkıyor — bu, aralık
// GENİŞLETİLDİĞİNDE toplamın küçülmesine bile yol açabiliyor. buildQuery
// her çağrıda TAZE bir query builder döndürmeli (aynı builder ikinci kez
// kullanılamaz); .range() ile sayfalayarak TÜM satırlar garanti edilir.
async function fetchAllRows(buildQuery){
  let all = []
  let from = 0
  while(true){
    const { data, error } = await buildQuery().range(from, from + SUPABASE_PAGE_SIZE - 1)
    if(error) return { data: null, error }
    all = all.concat(data || [])
    if(!data || data.length < SUPABASE_PAGE_SIZE) break
    from += SUPABASE_PAGE_SIZE
  }
  return { data: all, error: null }
}

function localDateStr(iso){

}

// Bir ayın ilk/son gününü YEREL takvime göre, toISOString() KULLANMADAN
// üretir. new Date(y, m, 1).toISOString() gibi bir kurgu, yerel saat
// dilimi UTC'nin ilerisindeyse (Almanya her zaman öyle, UTC+1/+2) o
// tarihi bir gün ERKENe kaydırır — "Dieser Monat" filtreleri bir önceki
// ayın son gününü de yanlışlıkla kapsar, aylık raporlar ayın son gününü
// yanlışlıkla dışlar. .getDate() yerel takvim gününü doğrudan okuduğu
// için bu sorunu yaşamaz.
function monthBounds(year, month0){ // month0: 0-indeksli ay (Ocak=0)
  const start = `${year}-${String(month0+1).padStart(2,'0')}-01`
  const lastDay = new Date(year, month0+1, 0).getDate()
  const end = `${year}-${String(month0+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`
  return { start, end }

// "Extra Arbeit" için seçilebilecek havuz: manuel fiyat girilen (Smart
// Repair dahil), sayaç bazlı ve iç kullanım hizmetleri hariç tutulur —
// bunların hepsi sabit tek bir fiyata sahip, ekstra girdi gerektirmez.
// İSTİSNA: FOTOSERVICE (is_variable_price=true olsa da) her zaman havuzda —
// tek fark, ana işin kendi Fotoservice "Ja/Nein" sorusu varsa (GW-A/B/FR,
// VFW-W1/W2) çift sayımı önlemek için Extra Arbeit'te tekrar gösterilmez.
function extraArbeitEligibleJobTypes(mainJobType){
  return jobTypes.filter(j => {
    if(j.is_quantity || j.is_internal) return false
    // Regiestunde standalone iş tipi, kendi manuel saat girişiyle (bkz.
    // RegiestundeHoursInput) çalışır — Extra Arbeit yolundan seçilirse
    // fiyat/süre girme imkanı olmadığından price_eur=0 no-op'a düşer.
    if(j.code === 'Regiestunde') return false
    if(mainJobType && j.id === mainJobType.id) return false
    if(j.code === 'FOTOSERVICE'){
      if(mainJobType && FOTOSERVICE_JOB_CODES.includes(mainJobType.code)) return false
      return true
    }
    return !j.is_variable_price
  })
}

function jobExtraArbeitLabel(j){
  if(j.code === 'FOTOSERVICE') return `${j.code} (Preis: je Filiale)`
  return `${j.code} (${fmtEur(j.price_eur||0)})`
}

function extraArbeitOptionsHtml(mainJobType){
  return extraArbeitEligibleJobTypes(mainJobType)
    .map(j => `<option value="${j.id}">${jobExtraArbeitLabel(j)}</option>`).join('')
}

function jobPriceLabel(j, knownBranch){
  if(j.code === 'FOTOSERVICE'){
    if(knownBranch && FOTOSERVICE_BRANCH_PRICE[knownBranch] !== undefined) return fmtEur(FOTOSERVICE_BRANCH_PRICE[knownBranch])
    return 'Preis: je Filiale'
  }
  if(j.code === 'Regiestunde') return fmtEur(REGIESTUNDE_RATE) + ' / Std.'
  if(j.is_variable_price) return 'Preis: manuell'
  return fmtEur(j.price_eur || 0)
}

// extraValid (isteğe bağlı): iş formu alanları dışında sağlanması gereken
// ek bir koşul (örn. admin'in geçmişe kayıt formunda çalışan+tarih seçili
// olması). Sağlanmadan "Auftrag hinzufügen" butonu etkinleşmez — böylece
// admin formunda eksik alan varken buton tıklansa bile SESSİZCE hiçbir şey
// olmaz izlenimi yerine, buton zaten devre dışı kalır.
function validateJobForm(prefix, getSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  const jt = getSelected()
  const extraOk = extraValid ? extraValid() : true
  if(!jt){ $('AddBtn').disabled = true; return }
  let ok = true
  if(jt.is_quantity){
    const qtyVal = $('QtyInput').value
    ok = qtyVal && parseInt(qtyVal) > 0
  } else {
    if(jt.requires_ref === false){
      ok = true
    } else {
      const refNo = $('RefNo').value.trim()
      ok = !!refNo
    }
    if(jt.is_variable_price && jt.code !== 'FOTOSERVICE'){
      const priceVal = $('CustomPrice').value
      ok = ok && priceVal && parseFloat(priceVal) > 0
    }
    if(jt.code === 'SR-Delle'){
      ok = ok && !!$('PerformerSelect').value
    }
    if(jt.code === 'MTS-SR'){
      ok = ok && !!$('MtsTypeSelect').value
    }
    if(jt.code === 'Showroom Pflege'){
      ok = ok && !!$('ShowroomHoursSelect').value
    }
    if(jt.code === 'Regiestunde'){
      const v = $('RegiestundeHoursInput').value
      ok = ok && v && parseFloat(v) > 0
    }
    if(TEXT_STYLE_CODES.includes(jt.code)){
      const durVal = $('TextDurationInput').value
      ok = ok && durVal && parseFloat(durVal) > 0
      if(TEXT_REQUIRED_DESC_CODES.includes(jt.code)) ok = ok && !!$('TextDescriptionInput').value.trim()
    }
    // Not: aynı Extra Arbeit birden fazla slotta seçilebilir (ör.
    // "Ausbesserung Kratzer, Steinschlag pro Bauteil" iki farklı Bauteil'e
    // uygulanabilir) — bilerek engellenmiyor, fiyat/süre her seçim için
    // ayrı ayrı toplanıyor (bkz. insertJobRecord).
  }
  $('AddBtn').disabled = !(ok && extraOk)
}

function wireJobForm(prefix, getSelected, setSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  const sheetMode = !!$('SheetClose')
  $('JobList').querySelectorAll('.job-btn[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $('JobList').querySelectorAll('.job-btn[data-id]').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      const jt = jobTypes.find(j => j.id === btn.dataset.id)
      setSelected(jt)
      syncFreqSelected(prefix, jt.id)
      if(sheetMode){
        $('SheetCode').textContent = jt.code
        $('SheetPrice').textContent = btn.querySelector('.job-price')?.textContent || ''
        const wasHidden = $('JobSheet').style.display === 'none'
        $('JobSheet').style.display = 'block'
        // Mobilde form listenin altında kalıyor — seçimden sonra görünür
        // alana kaydır. Geniş ekranda gerek yok (yan yana/üstte görünür).
        if(wasHidden && window.matchMedia && window.matchMedia('(max-width:899px)').matches){
          try { $('JobSheet').scrollIntoView({ behavior:'smooth', block:'nearest' }) } catch(e){}
        }
      }
      const showRef = !jt.is_quantity && jt.requires_ref !== false
      $('RefNoWrap').style.display = showRef ? 'block' : 'none'
      $('QtyWrap').style.display = jt.is_quantity ? 'block' : 'none'
      $('RegiestundeWrap').style.display = jt.is_aufbereitung ? 'block' : 'none'
      $('RegiestundeHoursWrap').style.display = jt.code === 'Regiestunde' ? 'block' : 'none'
      $('RegiestundeNoteWrap').style.display = jt.code === 'Regiestunde' ? 'block' : 'none'
      $('PriceWrap').style.display = (jt.is_variable_price && jt.code !== 'FOTOSERVICE') ? 'block' : 'none'
      $('PerformerWrap').style.display = jt.code === 'SR-Delle' ? 'block' : 'none'
      $('SRNoteWrap').style.display = SR_NOTE_CODES.includes(jt.code) ? 'block' : 'none'
      $('MtsTypeWrap').style.display = jt.code === 'MTS-SR' ? 'block' : 'none'
      $('ShowroomHoursWrap').style.display = jt.code === 'Showroom Pflege' ? 'block' : 'none'
      $('FotoserviceWrap').style.display = FOTOSERVICE_JOB_CODES.includes(jt.code) ? 'block' : 'none'
      $('TextDescriptionWrap').style.display = TEXT_STYLE_CODES.includes(jt.code) ? 'block' : 'none'
      $('TextDurationWrap').style.display = TEXT_STYLE_CODES.includes(jt.code) ? 'block' : 'none'
      $('ExtraArbeitWrap').style.display = jt.allows_extra_arbeit ? 'block' : 'none'
      if(jt.allows_extra_arbeit){
        const optsHtml = '<option value="">Keine</option>' + extraArbeitOptionsHtml(jt)
        $('ExtraArbeit1Select').innerHTML = optsHtml
        $('ExtraArbeit2Select').innerHTML = optsHtml
        $('ExtraArbeit3Select').innerHTML = optsHtml
        $('ExtraArbeit4Select').innerHTML = optsHtml
      }
      // İş tipi her değiştiğinde 3./4. slot ve "+" butonu başlangıç durumuna
      // döner — bir önceki seçimde açılmış kalmasın.
      $('ExtraArbeit3Wrap').style.display = 'none'
      $('ExtraArbeit4Wrap').style.display = 'none'
      $('ExtraArbeit3Select').value = ''
      $('ExtraArbeit4Select').value = ''
      $('ExtraArbeitAddSlotBtn').style.display = 'inline-block'
      $('ExtraArbeitAddSlotBtn').textContent = '+ Weitere Extra Arbeit'
      if(!jt.is_aufbereitung) $('Regiestunde').value = ''
      if(jt.code !== 'Regiestunde'){ $('RegiestundeHoursInput').value = ''; $('RegiestundeNoteInput').value = '' }
      if(jt.code !== 'SR-Delle') $('PerformerSelect').value = ''
      if(!SR_NOTE_CODES.includes(jt.code)) $('SRNoteInput').value = ''
      if(jt.code !== 'MTS-SR') $('MtsTypeSelect').value = ''
      if(jt.code !== 'Showroom Pflege') $('ShowroomHoursSelect').value = ''
      if(!FOTOSERVICE_JOB_CODES.includes(jt.code)) $('FotoserviceSelect').value = 'nein'
      if(!TEXT_STYLE_CODES.includes(jt.code)){ $('TextDescriptionInput').value = ''; $('TextDurationInput').value = '' }
      if(!jt.allows_extra_arbeit){ $('ExtraArbeit1Select').value = ''; $('ExtraArbeit2Select').value = '' }
      if(jt.is_quantity) $('QtyInput').value = ''
      validateJobForm(prefix, getSelected, extraValid)
    })
  })
  ;['RefNo','QtyInput','CustomPrice','RegiestundeHoursInput','TextDescriptionInput','TextDurationInput'].forEach(id=>{
    $(id).addEventListener('input', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
  ;['PerformerSelect','MtsTypeSelect','ShowroomHoursSelect','ExtraArbeit1Select','ExtraArbeit2Select','ExtraArbeit3Select','ExtraArbeit4Select'].forEach(id=>{
    $(id).addEventListener('change', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
  if(sheetMode){
    $('SheetClose').addEventListener('click', ()=>{
      $('JobList').querySelectorAll('.job-btn[data-id]').forEach(b=>b.classList.remove('selected'))
      syncFreqSelected(prefix, null)
      setSelected(null)
      $('JobSheet').style.display = 'none'
      validateJobForm(prefix, getSelected, extraValid)
    })
  }
  $('ExtraArbeitAddSlotBtn').addEventListener('click', ()=>{
    if($('ExtraArbeit3Wrap').style.display === 'none'){
      $('ExtraArbeit3Wrap').style.display = 'block'
    } else if($('ExtraArbeit4Wrap').style.display === 'none'){
      $('ExtraArbeit4Wrap').style.display = 'block'
      $('ExtraArbeitAddSlotBtn').style.display = 'none'
    }
  })
  $('JobSearch').addEventListener('input', ()=>{
    const q = $('JobSearch').value.trim().toLowerCase()
    $('JobList').querySelectorAll('.job-btn[data-id]').forEach(btn=>{
      const jt = jobTypes.find(j => j.id === btn.dataset.id)
      const match = !q || (jt && jt.code.toLowerCase().includes(q))
      btn.style.display = match ? 'flex' : 'none'
    })
    // Arama sırasında "Deine häufigsten" gizlenir — sonuçlar sadece listede.
    const freq = $('FreqWrap'), allLabel = $('AllLabel')
    if(freq && freq.dataset.has === '1'){
      freq.style.display = q ? 'none' : ''
      if(allLabel) allLabel.style.display = q ? 'none' : ''
    }
  })
}

function syncFreqSelected(prefix, jobTypeId){
  const freq = document.getElementById(prefix + 'FreqWrap')
  if(!freq) return
  freq.querySelectorAll('.freq-tile[data-freq-id]').forEach(t=>{
    t.classList.toggle('selected', !!jobTypeId && t.dataset.freqId === jobTypeId)
  })
}

// "Deine häufigsten": çalışanın son 30 gündeki en sık kullandığı iş tipleri.
// Sadece görüntüleme kısayolu — tıklanınca listedeki asıl .job-btn'ye
// tıklanmış gibi davranır (tüm form mantığı tek yerde kalır). Hata olursa
// veya yeterli veri yoksa bölüm gizli kalır; ana ekranı asla bloklamaz.
async function loadFreqJobTiles(prefix, employeeId, label){
  const freq = document.getElementById(prefix + 'FreqWrap')
  const list = document.getElementById(prefix + 'JobList')
  if(!freq || !list) return
  try {
    const since = new Date(Date.now() - 30*24*60*60*1000).toISOString()
    const { data, error } = await fetchAllRows(() => supabase.from('records').select('id, job_type_id, created_at').eq('employee_id', employeeId).gte('created_at', since).order('created_at', { ascending: false }))
    if(error || !data || !freq.isConnected) return
    // Adetli (Stück) işler tek seferde N satır olarak eklenir — aynı
    // created_at'e sahip satırlar tek kullanım sayılır.
    const counts = {}
    const seen = new Set()
    data.forEach(r=>{
      const jt = jobTypes.find(j => j.id === r.job_type_id)
      if(!jt) return
      if(jt.is_quantity){
        const key = r.job_type_id + '|' + r.created_at
        if(seen.has(key)) return
        seen.add(key)
      }
      counts[r.job_type_id] = (counts[r.job_type_id]||0) + 1
    })
    const top = Object.entries(counts)
      .filter(([id]) => list.querySelector(`.job-btn[data-id="${id}"]`))
      .sort((a,b) => b[1] - a[1])
      .slice(0, 6)
    if(top.length < 2) return
    freq.innerHTML = `<div class="list-label">${label || 'Deine häufigsten'}</div><div class="freq-grid">` + top.map(([id]) => {
      const jt = jobTypes.find(j => j.id === id)
      const priceTxt = list.querySelector(`.job-btn[data-id="${id}"] .job-price`)?.textContent || ''
      return `<button type="button" class="freq-tile" data-freq-id="${id}"><span class="code">${jt.code}</span><span class="job-price">${priceTxt}</span></button>`
    }).join('') + `</div>`
    freq.dataset.has = '1'
    const searching = !!document.getElementById(prefix + 'JobSearch')?.value.trim()
    freq.style.display = searching ? 'none' : ''
    const allLabel = document.getElementById(prefix + 'AllLabel')
    if(allLabel) allLabel.style.display = searching ? 'none' : ''
    freq.querySelectorAll('.freq-tile[data-freq-id]').forEach(tile=>{
      tile.addEventListener('click', ()=>{
        list.querySelector(`.job-btn[data-id="${tile.dataset.freqId}"]`)?.click()
      })
    })
    const sel = list.querySelector('.job-btn.selected[data-id]')
    if(sel) syncFreqSelected(prefix, sel.dataset.id)
  } catch(e){ /* sadece kısayol — sessizce yok say */ }
}

  const $ = (id) => document.getElementById(prefix + id)
  if(jt.is_quantity){
    return { qty: parseInt($('QtyInput').value) }

  return {
    refNo: jt.requires_ref === false ? null : $('RefNo').value.trim(),
    // Regiestunde standalone job tipi seçiliyse, saat manuel girilen input'tan
    // (ondalıklı da olabilir) okunur; diğer iş tiplerinde ise mevcut "Regiestunde
    // Aufbereitung" ek alanı dropdown'ından (tam sayı, 1-10) okunur.
    regiestunde: jt.code === 'Regiestunde'
      ? ($('RegiestundeHoursInput').value ? parseFloat($('RegiestundeHoursInput').value) : null)
      : ($('Regiestunde').value ? parseInt($('Regiestunde').value) : null),

    customDescription: jt.code === 'Regiestunde'
      ? ($('RegiestundeNoteInput').value.trim() || null)
      : SR_NOTE_CODES.includes(jt.code)
      ? ($('SRNoteInput').value.trim() || null)
      : ($('TextDescriptionInput').value ? $('TextDescriptionInput').value.trim() : null),
    textDurationMinutes: $('TextDurationInput').value ? parseInt($('TextDurationInput').value) : null,
    extraArbeit1Id: $('ExtraArbeit1Select').value || null,
    extraArbeit2Id: $('ExtraArbeit2Select').value || null,
    extraArbeit3Id: $('ExtraArbeit3Select').value || null,
    extraArbeit4Id: $('ExtraArbeit4Select').value || null
  }
}

// Merkezi kayıt ekleme fonksiyonu — hem çalışanın kendi girişi hem de
// admin'in geçmişe dönük girişi bunu kullanır. Fotoservice = Ja seçiliyse,
// ana işin kendi süresi/fiyatı girene ait kalır; Fotoservice'in 8 dakikası
// ve 9,88 €'su ayrı bir FOTOSERVICE kaydı olarak, o günkü şubenin sabit
// sorumlusuna (BRANCH_FOTOSERVICE_OWNER) yazılır.
async function insertJobRecord({ jobType, employeeId, values, dateStr, createdAtOverride }){
  const createdAtField = createdAtOverride ? { created_at: createdAtOverride } : {}

  if(jobType.is_quantity){
    const rows = Array.from({ length: values.qty }, () => ({
      employee_id: employeeId,
      job_type_id: jobType.id,
      ref_no: null,
      regiestunde: null,
      ...createdAtField
    }))
    const { error } = await supabase.from('records').insert(rows)
    return { error, count: values.qty }
  }

  // Standalone FOTOSERVICE seçimi: genel listeden doğrudan seçildiğinde
  // girenin adına HİÇBİR kayıt oluşturulmaz — tek kayıt doğrudan o günkü
  // şubenin sabit sorumlusuna (BRANCH_FOTOSERVICE_OWNER) yazılır.
  if(jobType.code === 'FOTOSERVICE'){
    const branch = await lookupBranchForDate(employeeId, dateStr)
    const ownerAktNo = branch && BRANCH_FOTOSERVICE_OWNER[branch]
    if(!ownerAktNo){
      return { error: { message: 'Für diesen Tag ist keine Filiale hinterlegt — Fotoservice kann nicht zugeordnet werden.' } }
    }
    const owner = employees.find(e => e.akt_no === ownerAktNo)
    if(!owner){
      return { error: { message: `Fotoservice-Empfänger (${ownerAktNo}) wurde nicht gefunden.` } }
    }
    const { error } = await supabase.from('records').insert([{
      employee_id: owner.id,
      job_type_id: jobType.id,
      ref_no: values.refNo,
      regiestunde: null,
      fotoservice: false,
      custom_price: FOTOSERVICE_BRANCH_PRICE[branch] ?? FOTOSERVICE_PRICE,
      ...createdAtField
    }])
    return { error, count: 1 }
  }

  // Fotoservice, Extra Arbeit seçeneklerinden biri olarak da seçilmiş
  // olabilir (bkz. extraArbeitEligibleJobTypes) — bu durumda da giren
  // çalışana değil, şube sorumlusuna ayrı bir kayıt olarak yazılır, ana
  // kaydın extra_arbeit toplamına DAHİL EDİLMEZ (aşağıda nonFotoExtraIds).
  const extraArbeitFotoserviceId = jobType.allows_extra_arbeit &&
    [values.extraArbeit1Id, values.extraArbeit2Id].find(id => id && jobTypes.find(j => j.id === id)?.code === 'FOTOSERVICE')

  const wantsFotoservice = (FOTOSERVICE_JOB_CODES.includes(jobType.code) && values.fotoservice) || !!extraArbeitFotoserviceId
  let ownerEmployeeId = null
  let branch = null

  if(wantsFotoservice){
    branch = await lookupBranchForDate(employeeId, dateStr)
    const ownerAktNo = branch && BRANCH_FOTOSERVICE_OWNER[branch]
    if(!ownerAktNo){
      return { error: { message: 'Für diesen Tag ist keine Filiale hinterlegt — Fotoservice kann nicht zugeordnet werden.' } }
    }
    const owner = employees.find(e => e.akt_no === ownerAktNo)
    if(!owner){
      return { error: { message: `Fotoservice-Empfänger (${ownerAktNo}) wurde nicht gefunden.` } }
    }
    ownerEmployeeId = owner.id
  }

  const payload = {
    employee_id: employeeId,
    job_type_id: jobType.id,
    ref_no: values.refNo,
    regiestunde: values.regiestunde,
    ...createdAtField
  }
  if(jobType.is_variable_price) payload.custom_price = values.customPrice
  if(jobType.code === 'SR-Delle') payload.performed_by = values.performedBy
  if(jobType.code === 'MTS-SR') payload.mts_subtype = values.mtsSubtype
  if(jobType.code === 'Showroom Pflege') payload.custom_duration_minutes = values.showroomHours * 60
  if(TEXT_STYLE_CODES.includes(jobType.code)){
    payload.custom_description = values.customDescription
    payload.custom_duration_minutes = values.textDurationMinutes
  }
  if(jobType.code === 'Regiestunde' || SR_NOTE_CODES.includes(jobType.code)) payload.custom_description = values.customDescription
  if(FOTOSERVICE_JOB_CODES.includes(jobType.code)){
    payload.fotoservice = values.fotoservice
  } else if(wantsFotoservice){
    // Ana iş FOTOSERVICE_JOB_CODES'ta değil (Extra Arbeit üzerinden Fotoservice
    // seçildi) ama owner kaydıyla birlikte tek bir batch insert'te gidecek —
    // satırlar farklı key setine sahipse PostgREST eksik alana DEFAULT yerine
    // açıkça null gönderir, NOT NULL ihlaline yol açar. Bu yüzden burada da
    // bilerek false set ediliyor (bkz. aşağıdaki owner satırındaki aynı not).
    payload.fotoservice = false
  }

  // Extra Arbeit: seçilen 1-4 ek hizmetin fiyatı/süresi Regiestunde gibi
  // ana kayda toplanıyor, ayrı bir kayıt oluşturulmuyor. FOTOSERVICE
  // seçilmişse ayrı ele alınıyor (yukarıda), bu yüzden buradan hariç tutulur.
  if(jobType.allows_extra_arbeit){
    const extraIds = [values.extraArbeit1Id, values.extraArbeit2Id, values.extraArbeit3Id, values.extraArbeit4Id].filter(Boolean)
    const nonFotoExtraIds = extraIds.filter(id => jobTypes.find(j => j.id === id)?.code !== 'FOTOSERVICE')
    if(nonFotoExtraIds.length){
      let extraPrice = 0, extraMinutes = 0
      const extraCodes = []
      nonFotoExtraIds.forEach(id=>{
        const ej = jobTypes.find(j => j.id === id)
        if(ej){
          extraPrice += ej.price_eur || 0
          extraMinutes += ej.duration_minutes || 0
          extraCodes.push(ej.code)
        }
      })
      payload.extra_arbeit_price = extraPrice
      payload.extra_arbeit_minutes = extraMinutes
      payload.extra_arbeit_1_code = extraCodes[0] || null
      payload.extra_arbeit_2_code = extraCodes[1] || null
      payload.extra_arbeit_3_code = extraCodes[2] || null
      payload.extra_arbeit_4_code = extraCodes[3] || null
    }
  }

  const rowsToInsert = [payload]

  if(wantsFotoservice){
    const fotoJobType = jobTypes.find(j => j.code === 'FOTOSERVICE')
    if(!fotoJobType){
      return { error: { message: 'FOTOSERVICE Auftragsart fehlt in der Datenbank (siehe schema_v14.sql).' } }
    }
    // Fotoservice fiyatı şubeye göre değişir (bkz. FOTOSERVICE_BRANCH_PRICE) —
    // FOTOSERVICE artık is_variable_price=true, bu yüzden custom_price
    // burada açıkça belirtiliyor.
    rowsToInsert.push({
      employee_id: ownerEmployeeId,
      job_type_id: fotoJobType.id,
      ref_no: values.refNo,
      regiestunde: null,
      fotoservice: false, // NOT NULL kolon — bulk insert'te satırlar farklı
                          // key setine sahipse eksik alan DEFAULT yerine
                          // açıkça null gönderilir, bu yüzden burada bilerek belirtiliyor.
      custom_price: FOTOSERVICE_BRANCH_PRICE[branch] ?? FOTOSERVICE_PRICE,
      ...createdAtField
    })
  }

  // Birden fazla satır TEK bulk insert'te gidiyorsa (Fotoservice owner satırı
  // + ana kayıt gibi), PostgREST tüm satırların key BİRLEŞİMİNİ sütun listesi
  // olarak kullanır — bir satırda eksik olan her key AÇIKÇA null gönderilir.
  // fotoservice (NOT NULL) için bu zaten yukarıda elle yönetiliyor; ama
  // extra_arbeit_price/minutes/1-4_code, custom_price, performed_by,
  // mts_subtype, custom_duration_minutes, custom_description gibi nullable
  // alanlar da satırlar arasında FARKLI key setlerine sahip olabiliyor —
  // bu, hangi satırın hangi alanı gerçekten "sahiplendiğini" karıştırmaya
  // (ör. Fotoservice + 2. Extra Arbeit birlikte seçilince ana kaydın extra
  // arbeit verisinin kaybolduğu bildirilen hata) yol açabiliyor. Bunu kalıcı
  // olarak önlemek için, birden fazla satır varsa TÜM satırlar aynı key
  // setine (eksik olan her yerde açık null ile) normalize ediliyor.
  let finalRows = rowsToInsert
  if(rowsToInsert.length > 1){
    const allKeys = new Set()
    rowsToInsert.forEach(r => Object.keys(r).forEach(k => allKeys.add(k)))
    finalRows = rowsToInsert.map(r => {
      const normalized = {}
      allKeys.forEach(k => { normalized[k] = k in r ? r[k] : null })
      return normalized
    })
  }

  const { error } = await supabase.from('records').insert(finalRows)
  return { error, count: 1 }
}

// Bir çalışanı doğrular. auth_user_id doluysa gerçek Supabase Auth
// üzerinden (signInWithPassword), henüz taşınmadıysa (geçiş dönemi)
// eski yöntemle (düz metin karşılaştırma) — böylece migrate-employees
// fonksiyonu çalıştırılmadan önce de sonra da giriş bozulmaz.
async function authenticateEmployee(emp, password){
  if(emp.auth_user_id){
    const email = `${emp.akt_no.toLowerCase()}@${AUTH_EMAIL_DOMAIN}`
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if(error){ return false }
    return true
  }
  return (emp.password || '') === password
}

function routeAfterLogin(emp){
  leaveStandort()
  currentEmployee = emp
  localStorage.setItem(SESSION_KEY, emp.id)
  updateLogoutBtn()

  // ANLAMSIZ, "Mitarbeiter" sekmesi bu hesaba hiç gösterilmemeli.

  }
}

function compareVersions(a, b){
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0)
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0)
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const d = (pa[i] || 0) - (pb[i] || 0)
    if(d) return d > 0 ? 1 : -1
  }
  return 0
}

// Uzun süre açık kalan sekmeler/PWA için: sunucudaki version.json daha
// yeni bir sürüm bildiriyorsa üstte "Neu laden" bandı gösterilir. Dosya
// yoksa (404) veya ağ hatasında sessizce hiçbir şey yapılmaz.
let lastVersionCheck = 0
function checkForNewVersion(){
  const now = Date.now()
  if(now - lastVersionCheck < 60*1000) return
  lastVersionCheck = now
  if(document.getElementById('updateBanner')) return
  fetch('/version.json?t=' + now, { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if(!v || !v.version || compareVersions(v.version, APP_VERSION) <= 0) return
      if(document.getElementById('updateBanner')) return
      const el = document.createElement('div')
      el.id = 'updateBanner'
      el.className = 'update-banner no-print'
      el.innerHTML = `<span>Neue Version <b class="mono">${String(v.version).replace(/[^0-9.]/g,'')}</b> verfügbar</span><button type="button" id="updateReloadBtn">Neu laden</button>`
      main.parentNode.insertBefore(el, main)
      el.querySelector('#updateReloadBtn').addEventListener('click', ()=> location.reload())
    })
    .catch(()=>{})
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkForNewVersion() })
window.addEventListener('focus', checkForNewVersion)
setInterval(checkForNewVersion, 10*60*1000)

    const messages = {}
    if(document.getElementById('asBossOn')?.checked) messages.boss = { title: val('asBossTitle'), body: val('asBossBody') }
    if(document.getElementById('asEmpOn')?.checked) messages.emp = { title: val('asEmpTitle'), body: val('asEmpBody') }
    const groups = Object.keys(messages)
    if(!groups.length){ showToast('Bitte mindestens eine Empfängergruppe wählen'); return }
    if(groups.some(g => !messages[g].title || !messages[g].body)){ showToast('Titel und Text dürfen nicht leer sein'); return }
    const who = groups.map(g => g === 'boss' ? 'Chef-Geräte' : 'Mitarbeiter-Geräte').join(' und ')
    if(!confirm(`Mitteilung jetzt an alle ${who} senden?`)) return
    btn.disabled = true
    btn.textContent = 'Wird gesendet…'
    try {
      const { data, error } = await supabase.functions.invoke('send-announcement', { body: { messages } })
      if(error || !data || data.error){
        showToast('Fehler: ' + ((data && data.error) || (error && error.message) || 'Unbekannt'))
        return
      }
      const part = (g, label) => data[g] ? `${label}: ${data[g].sent} gesendet${data[g].failed ? `, ${data[g].failed} fehlgeschlagen` : ''}` : null
      showToast([part('boss', 'Chef'), part('emp', 'Mitarbeiter')].filter(Boolean).join(' · '))
      document.getElementById('announceSendBox')?.removeAttribute('open')
    } catch(e){
      showToast('Fehler: ' + e.message)
    } finally {
      btn.disabled = false
      btn.textContent = 'Jetzt senden'
    }
  })
}

// Vorarbeiter bir kez "Standort" ile girer; çalışan seçip çıkış yapmadan
// onların adına saat/Auftrag girer. Şube sabittir (lead_branch). Gün
// değişince oturum otomatik kapanır (paylaşılan tablet için).

function standortEmployees(){
  return employees.filter(e => !e.hidden_from_login && !e.is_admin && !e.is_chef_viewer)
}

function standortLeads(branch){
  return employees.filter(e => e.lead_branch === branch && !e.is_admin && !e.is_chef_viewer)
}

function standortChipsHtml(hoursToday, subjectId){
  const hoursBy = {}
  hoursToday.forEach(h => { hoursBy[h.employee_id] = h })
  const list = standortEmployees().slice().sort((a, b) => {
    // Bugün bu şubede saati girilmiş olanlar önce, sonra isme göre.
    const ah = hoursBy[a.id]?.branch === standortMode.branch ? 0 : 1
    const bh = hoursBy[b.id]?.branch === standortMode.branch ? 0 : 1
    return ah - bh || String(a.name).localeCompare(String(b.name), 'de')
  })
  return list.map(e => {
    const h = hoursBy[e.id]
    const mark = h ? `<span class="chip-mark">${h.hours} Std${h.branch && h.branch !== standortMode.branch ? ' · ' + h.branch : ''}</span>` : ''
    return `<button type="button" class="standort-chip${e.id === subjectId ? ' selected' : ''}${h ? ' has-hours' : ''}" data-emp="${e.id}"><span class="nm">${e.name}</span>${mark}</button>`
  }).join('')
}

// ============ ZUGÄNGE VERWALTEN (nur Admin) ============
// Güçlü şifre verme / henüz gerçek girişi olmayan hesabı (Chef, W3)
// etkinleştirme. Asıl işlem sunucuda (Edge Function admin-account):
// Admin rolü orada ayrıca kontrol edilir. Admin'in kendi hesabı burada
// değiştirilemez (Supabase Dashboard).

// Edge Function'daki kuralla aynı.
function passwordProblem(pw, aktNo){
  if(pw.length < 10) return 'Mindestens 10 Zeichen'
  if(pw.length > 72) return 'Höchstens 72 Zeichen'
  if(!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return 'Buchstaben und Ziffern verwenden'
  if(aktNo && pw.toLowerCase().includes(String(aktNo).toLowerCase())) return 'Darf die AKT-Nummer nicht enthalten'
  return null
}

// Okunaklı güçlü şifre: 3 blok × 4 karakter (karışabilen 0/O, 1/l/I yok).
function generatePassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'
  // Harf+rakam içerene kadar yeniden üret (bir denemede ~%85 olasılıkla olur).
  while(true){
    const buf = new Uint32Array(12)
    crypto.getRandomValues(buf)
    const raw = Array.from(buf, n => chars[n % chars.length]).join('')
    const pw = `${raw.slice(0,4)}-${raw.slice(4,8)}-${raw.slice(8,12)}`
    if(/[A-Za-z]/.test(pw) && /[0-9]/.test(pw)) return pw
  }
}

            </div>

            <button type="button" class="icon-btn access-set-btn" data-emp="${e.id}">Passwort setzen</button>

function wireAccessAdmin(){
  document.querySelectorAll('.access-set-btn[data-emp]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const emp = employees.find(e => e.id === btn.dataset.emp)
      if(!emp) return
      const wrap = document.getElementById('accessForm')
      wrap.innerHTML = `
        <div class="access-form">
          <div class="access-form-title">${emp.auth_user_id ? 'Neues Passwort für' : 'Konto aktivieren für'} <b>${emp.name}</b> <span class="mono">${emp.akt_no}</span></div>
          <div class="access-pw-row">
            <input type="text" id="accessPwInput" class="mono" autocomplete="off" spellcheck="false" value="${generatePassword()}">
            <button type="button" class="icon-btn" id="accessGenBtn">Neu erzeugen</button>
          </div>
          <div class="access-note">Passwort vor dem Speichern notieren (z. B. im Passwort-Manager). Es wird danach nicht mehr angezeigt.</div>
          <div class="access-actions">
            <button type="button" class="primary" id="accessSaveBtn">${emp.auth_user_id ? 'Passwort speichern' : 'Konto aktivieren'}</button>
            <button type="button" class="secondary" id="accessCancelBtn">Abbrechen</button>
          </div>
        </div>`
      wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
      document.getElementById('accessGenBtn').addEventListener('click', ()=>{ document.getElementById('accessPwInput').value = generatePassword() })
      document.getElementById('accessCancelBtn').addEventListener('click', ()=>{ wrap.innerHTML = '' })
      document.getElementById('accessSaveBtn').addEventListener('click', async ()=>{
        const pw = document.getElementById('accessPwInput').value.trim()
        const problem = passwordProblem(pw, emp.akt_no)
        if(problem){ showToast('Passwort ungültig: ' + problem); return }
        if(!confirm(`${emp.auth_user_id ? 'Neues Passwort' : 'Konto aktivieren'} für ${emp.name} speichern? Das alte Passwort ist danach ungültig.`)) return
        const saveBtn = document.getElementById('accessSaveBtn')
        saveBtn.disabled = true
        try {
          const { data, error } = await supabase.functions.invoke('admin-account', { body: { employee_id: emp.id, password: pw } })
          if(error || !data || data.error || !data.ok){
            showToast('Fehler: ' + ((data && data.error) || (error && error.message) || 'Unbekannt'))
            saveBtn.disabled = false
            return
          }
          showToast(data.activated ? `Konto aktiviert: ${emp.name}` : `Passwort gesetzt: ${emp.name}`)
          await loadStaticData()
          renderEmployeeDay()
        } catch(e){
          showToast('Fehler: ' + e.message)
          saveBtn.disabled = false
        }
      })
    })
  })
}

// ============ ÇALIŞAN GİRİŞİ (TAGESANSICHT) ============

async function renderEmployeeDay(){
  // Savunma amaçlı ikinci katman: Chef (is_chef_viewer=true) hiçbir
  // koşulda kendi saat/şube/Auftrag girişi görmemeli — "Mitarbeiter"
  // sekmesi zaten bu hesap için gizli (bkz. routeAfterLogin), ama buraya
  // başka bir yoldan gelinirse yine de Boss Dashboard'a yönlendir.
  if(currentEmployee?.is_chef_viewer){
    tabBoss.classList.add('active'); tabEmployee.classList.remove('active')
    headerTitle.textContent = 'Chef'
    renderBossDashboard()
    return
  }
  main.innerHTML = `<div class="empty">Lädt...</div>`

  const today = todayStr()
  // subject: kimin günü gösteriliyor — normalde giriş yapan çalışan,
  // Standort modunda Vorarbeiter'in seçtiği çalışan (bkz. dayEmployee).
  const subject = dayEmployee()
  const isStandort = !!standortMode
  if(isStandort && !subject){ renderStandortHome(); return }
  // Karar değişikliği: çalışanın kendi Einträge listesi/silme yetkisi
  // 48 saat yerine "aynı takvim günü" ile sınırlı (bkz. schema_v30.sql'deki
  // records_delete_recent — Europe/Berlin takvim günü kontrolü). Bu yüzden
  // liste de tekrar SADECE bugünle sınırlandırıldı.
  const [hoursRes, recordsRes, standortHoursRes] = await Promise.all([
    supabase.from('daily_hours').select('*').eq('employee_id', subject.id).eq('work_date', today).maybeSingle(),
    supabase.from('records').select('*, job_types(code, name, is_aufbereitung, is_mts, is_variable_price, is_quantity)').eq('employee_id', subject.id).gte('created_at', startOfDayISO(today)).lt('created_at', endOfDayISO(today)).order('created_at', { ascending: false }),
    isStandort ? supabase.from('daily_hours').select('employee_id, hours, branch').eq('work_date', today) : Promise.resolve({ data: [] })
  ])

  const savedHours = hoursRes.data?.hours ?? null
  const savedBranch = hoursRes.data?.branch ?? null
  // SmartRepair hesabı, günlük saat/şube girme zorunluluğundan muaf —
  // bu hesap doğrudan Auftrag ekleyebilmeli (bkz. wireJobForm çağrısı aşağıda).
  const isBranchExempt = subject.akt_no === 'SmartRepair'
  const todaysRecords = recordsRes.data || []

  const qtyCounts = {}
  todaysRecords.forEach(r=>{ if(r.job_types.is_quantity) qtyCounts[r.job_type_id] = (qtyCounts[r.job_type_id]||0) + 1 })

  const isHiddenAdmin = !!(currentEmployee?.is_admin && currentEmployee?.hidden_from_login)
  const adminBackdateHtml = isHiddenAdmin ? `
    <div class="card" id="adminBackdateCard">
      <label>⏱ Geçmişe Kayıt Ekle (Admin)</label>
      ${!currentEmployee.auth_user_id ? `
        <div class="sub" style="color:var(--red);margin:-4px 0 14px;">
          ⚠ Bu hesap henüz gerçek Supabase Auth'a bağlı değil (auth_user_id boş).
          Kayıt eklemeyi denerseniz sunucu güvenlik kuralı (RLS) isteği
          reddedebilir. Migrate-employees fonksiyonunu bu hesap için de
          çalıştırmanız gerekebilir.
        </div>
      ` : ''}
      <label style="margin-top:0;">Mitarbeiter</label>
      <select id="bkEmployeeSelect">
        <option value="">Auswählen...</option>
        ${employees.filter(e=>!e.hidden_from_login).map(e => `<option value="${e.id}">${e.name} (${e.akt_no})</option>`).join('')}
      </select>
      <label>Datum</label>
      <input type="date" id="bkDate" max="${localDateStr(new Date())}">
      <div id="bkDailyHoursWrap"></div>
      <div id="bkDayRecordsWrap"></div>
      ${jobFormHtml('bk', {})}
    </div>
  ` : ''

  const firstName = String(currentEmployee.name || '').trim().split(/\s+/)[0] || currentEmployee.name
  const subjectFirst = String(subject.name || '').trim().split(/\s+/)[0] || subject.name
  const helloDate = new Date().toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' })

  main.innerHTML = `
    <div class="emp-screen${isHiddenAdmin ? '' : ' layout-wide'}">
    ${isStandort ? standortHeadHtml(standortHoursRes.data || [], subject) : `
    <div class="emp-hello">
      <div class="hello">Hallo, ${firstName}</div>
      <div class="hello-meta mono">${currentEmployee.akt_no} · ${helloDate}</div>
    </div>`}

    <div class="emp-grid${isHiddenAdmin ? ' emp-grid-admin' : ''}">
    <div class="col-main">
    ${!isHiddenAdmin ? `
    <div class="card emp-job-card">
      <label>Neuen Auftrag hinzufügen</label>
      ${!savedBranch && !isBranchExempt ? (isStandort
        ? `<div class="sub" style="color:var(--red);margin:-4px 0 14px;">⚠ Bitte zuerst die Stunden von ${subjectFirst} für heute speichern.</div>`
        : `<div class="sub" style="color:var(--red);margin:-4px 0 14px;">⚠ Bitte zuerst oben deine Filiale für heute speichern.</div>`) : ''}
      ${jobFormHtml('emp', qtyCounts, savedBranch, { sheet: true })}
    </div>
    ` : ''}
    </div>

    <div class="col-side">
    ${!isHiddenAdmin ? `
    <div class="card emp-hours-card">
      ${savedHours !== null ? `
        <label>Arbeitszeit heute</label>
        <div class="hours-strip">
          <div class="hours-saved">✓ Gespeichert: ${savedHours} Std · ${savedBranch || 'keine Filiale angegeben'}</div>
          <div class="hours-actions">
            <button class="secondary" id="editHoursBtn">Ändern</button>
            <button class="secondary" id="deleteHoursBtn" style="color:var(--red);">Löschen</button>
          </div>
        </div>
      ` : isStandort ? `
        <label>Wie viele Stunden hat ${subjectFirst} heute gearbeitet (ohne Pause)?</label>
        <div class="hours-row" style="margin-bottom:6px;">
          <input type="number" id="hoursInput" placeholder="z.B. 8.5" step="0.5" min="0" max="16">
        </div>
        <div class="standort-branch-note">Filiale: <b>${standortMode.branch}</b> (automatisch)</div>
        <button class="primary" id="saveHoursBtn" disabled>Speichern</button>
      ` : `
        <label>Wie viele Stunden hast du heute gearbeitet (ohne Pause)?</label>
        <div class="hours-row" style="margin-bottom:14px;">
          <input type="number" id="hoursInput" placeholder="z.B. 8.5" step="0.5" min="0" max="16">
        </div>
        <label>In welcher Filiale hast du heute gearbeitet?</label>
        <div class="job-list branch-chips" id="branchList" style="margin-bottom:14px;">
          ${BRANCHES.map(b => `<div class="job-btn branch-btn" data-branch="${b}"><span class="code">${b}</span></div>`).join('')}
        </div>
        <button class="primary" id="saveHoursBtn" disabled>Speichern</button>
      `}
    </div>
    ` : ''}

    <div class="card emp-entries-card">
      <label>${isStandort ? `Heutige Einträge von ${subject.name} (${todaysRecords.length})` : `${todayLabel()} — Deine heutigen Einträge (${todaysRecords.length})`}</label>
      <div class="entry-list" id="entryList">
        ${todaysRecords.length === 0 ? '<div class="empty">Noch keine Einträge</div>' : todaysRecords.map(r => `
          <div class="entry">
            <div><span class="code">${r.job_types.code}</span><span class="ref">${r.ref_no || ''}${r.performed_by ? ' · ' + r.performed_by : ''}${r.mts_subtype ? ' · ' + r.mts_subtype : ''}${r.custom_description ? ' · ' + r.custom_description : ''}</span></div>
            <div class="right">
              ${r.regiestunde ? `<span class="extra">+${r.regiestunde} Std</span>` : ''}
              ${r.custom_duration_minutes ? (TEXT_STYLE_CODES.includes(r.job_types.code) ? `<span class="extra">${r.custom_duration_minutes} Min</span>` : `<span class="extra">${Math.round(r.custom_duration_minutes/60)} Std</span>`) : ''}
              ${r.fotoservice ? `<span class="extra">Fotoservice</span>` : ''}
              ${r.extra_arbeit_1_code ? `<span class="extra">+${r.extra_arbeit_1_code}</span>` : ''}
              ${r.extra_arbeit_2_code ? `<span class="extra">+${r.extra_arbeit_2_code}</span>` : ''}
              ${r.extra_arbeit_3_code ? `<span class="extra">+${r.extra_arbeit_3_code}</span>` : ''}
              ${r.extra_arbeit_4_code ? `<span class="extra">+${r.extra_arbeit_4_code}</span>` : ''}
              <button class="del-btn" data-del="${r.id}" title="Löschen">×</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    ${!isStandort ? '<button class="secondary emp-monthly-btn" id="monthlyReportBtn">📅 Monatsbericht</button>' : ''}

    </div>
    </div>

    ${adminBackdateHtml}
    ${isHiddenAdmin ? accessAdminHtml() : ''}
    </div>
  `
  maybeShowAnnouncement(isHiddenAdmin ? 'boss' : 'emp')
  if(isStandort) wireStandortHead()

  // Standort modunda şube sabit: Vorarbeiter'in şubesi.
  let pickedBranch = isStandort ? standortMode.branch : null

  if(!isHiddenAdmin){
    if(savedHours !== null){
      document.getElementById('editHoursBtn').addEventListener('click', async ()=>{
        const val = prompt(isStandort ? `Wie viele Stunden hat ${subjectFirst} heute gearbeitet (ohne Pause)?` : 'Wie viele Stunden hast du heute gearbeitet (ohne Pause)?', savedHours)
        if(val === null) return
        const num = parseFloat(val.replace(',','.'))
        if(isNaN(num)) { showToast('Ungültige Zahl'); return }
        if(isStandort){ await saveHours(num, standortMode.branch); return }
        const br = prompt('Welche Filiale? (Ausschläger Weg / Horn / Wiesendamm)', savedBranch || '')
        await saveHours(num, br || savedBranch)
      })
      document.getElementById('deleteHoursBtn').addEventListener('click', async ()=>{
        if(!confirm('Diese Stunden/Filiale-Eintragung löschen?')) return
        const { error, count } = await supabase.from('daily_hours').delete({ count: 'exact' }).eq('employee_id', subject.id).eq('work_date', today)
        if(error){ showToast('Fehler: ' + error.message); return }
        if(!count){ showToast('Fehler: Konnte nicht gelöscht werden — evtl. keine Berechtigung.'); return }
        showToast('Gelöscht')
        renderEmployeeDay()
      })
    } else {
      document.querySelectorAll('.branch-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.branch-btn').forEach(b=>b.classList.remove('selected'))
          btn.classList.add('selected')
          pickedBranch = btn.dataset.branch
          validateHoursSave()
        })
      })
      document.getElementById('hoursInput').addEventListener('input', validateHoursSave)
      document.getElementById('saveHoursBtn').addEventListener('click', async ()=>{
        const val = document.getElementById('hoursInput').value
        const num = parseFloat(val)
        if(isNaN(num) || num <= 0){ showToast('Bitte gültige Stundenzahl eingeben'); return }
        if(!pickedBranch){ showToast('Bitte Filiale auswählen'); return }
        await saveHours(num, pickedBranch)
      })
    }

  function validateHoursSave(){

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4)
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
  const rawData = atob(base64)
  const outputArray = new Uint8Array(rawData.length)
  for(let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i)
  return outputArray
}

async function getPushSubscriptionStatus(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported'
  const reg = await navigator.serviceWorker.ready
  const sub = await reg.pushManager.getSubscription()
  if(!sub) return 'not-subscribed'
  // VAPID anahtarları yenilendiyse eski anahtarla oluşturulmuş abonelikler
  // artık geçersizdir ama tarayıcıda kayıtlı kalmaya devam eder. Böyle bir
  // uyuşmazlık tespit edilirse aboneliği otomatik temizleyip butonu tekrar
  // gösteriyoruz — aksi halde buton hiç çıkmaz ama bildirim de gelmez.
  try {
    const currentKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    const subKey = sub.options && sub.options.applicationServerKey
    if(subKey){
      const subKeyArr = new Uint8Array(subKey)
      const mismatch = subKeyArr.length !== currentKey.length || !subKeyArr.every((v,i)=>v===currentKey[i])
      if(mismatch){
        await sub.unsubscribe()
        return 'not-subscribed'
      }
    }
  } catch(e) { /* karşılaştırma desteklenmiyorsa mevcut durumu koru */ }
  return 'subscribed'
}

// audience (schema_v37.sql): 'boss' = Chef/Admin-Gerät (bekommt den 17:45
// Tagesbericht), 'emp' = Mitarbeiter-Gerät (NUR Mitteilungen, nie Umsatz).
async function enablePushNotifications(audience){
  audience = audience === 'emp' ? 'emp' : 'boss'
  try {
    const permission = await Notification.requestPermission()
    if(permission !== 'granted'){ showToast('Benachrichtigungen wurden nicht erlaubt'); return }
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    })
    const json = sub.toJSON()
    const baseRow = { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth }
    let { error } = await supabase.from('push_subscriptions').upsert({
      ...baseRow, audience, employee_id: currentEmployee?.id || null
    }, { onConflict: 'endpoint' })
    // schema_v37.sql noch nicht ausgeführt (Spalten fehlen): Chef-Geräte
    // wie bisher speichern. Mitarbeiter-Geräte NICHT — ohne Spalte würden
    // sie später als 'boss' gelten und den Tagesbericht mit Umsatz bekommen.
    if(error && /audience|employee_id|42703|PGRST204/i.test((error.message || '') + ' ' + (error.code || ''))){
      if(audience === 'emp'){
        try { await sub.unsubscribe() } catch(e){}
        showToast('Mitteilungen sind noch nicht eingerichtet — bitte später erneut versuchen.')
        return
      }
      ;({ error } = await supabase.from('push_subscriptions').upsert(baseRow, { onConflict: 'endpoint' }))
    }
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast(audience === 'emp' ? 'Mitteilungen aktiviert' : 'Benachrichtigungen aktiviert')
    if(audience === 'emp') renderEmployeeDay(); else renderBossDashboard()
  } catch(e){
    showToast('Fehler: ' + e.message)
  }
}

function currentRangeDates(){
  const today = todayStr()
  if(bossRange.mode === 'today') return { start: today, end: today }
  if(bossRange.mode === 'yesterday'){
    const d = new Date(); d.setDate(d.getDate() - 1)
    const s = localDateStr(d)
    return { start: s, end: s }
  }
  if(bossRange.mode === 'week'){
    const d = new Date(); const day = (d.getDay()+6)%7 // Montag=0
    const monday = new Date(d); monday.setDate(d.getDate()-day)
    return { start: localDateStr(monday), end: today }
  }
  if(bossRange.mode === 'month'){
    const d = new Date()
    return { start: monthBounds(d.getFullYear(), d.getMonth()).start, end: today }
  }
  return { start: bossRange.start || today, end: bossRange.end || today }
}

// "Zusammenfassung pro Mitarbeiter" bir çalışan seçiliyken kendi
// bağımsız Zeitraum'una sahip olabiliyor (Dün/Woche/Monat/Letzter Monat) —
// üstteki ana Zeitraum'dan tamamen ayrı, kendi state'i (bossRange.employeeReportMode).
function employeeSummaryRangeDates(mode){
  const today = todayStr()
  if(mode === 'yesterday'){
    const d = new Date(); d.setDate(d.getDate() - 1)
    const s = localDateStr(d)
    return { start: s, end: s }
  }
  if(mode === 'month'){
    const d = new Date()
    return { start: monthBounds(d.getFullYear(), d.getMonth()).start, end: today }
  }
  if(mode === 'lastMonth'){
    const d = new Date()
    let y = d.getFullYear(), prevMonth0 = d.getMonth() - 1
    if(prevMonth0 < 0){ prevMonth0 = 11; y -= 1 }
    return monthBounds(y, prevMonth0)
  }
  // 'week' (varsayılan)
  const d = new Date(); const day = (d.getDay()+6)%7
  const monday = new Date(d); monday.setDate(d.getDate()-day)
  return { start: localDateStr(monday), end: today }
}
