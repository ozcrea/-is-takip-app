          <thead><tr><th>Datum</th><th>Std.</th><th>Aufträge</th><th>Umsatz</th></tr></thead>
          <tbody>
            ${eAllDays.map(d=>{
              const recs = eRecordsByDay[d] || []
              const dayRevenue = recs.reduce((sum,r)=>sum + recordPrice(r), 0)
              return `<tr>
                <td>${d}</td>
                <td>${eHoursByDay[d] !== undefined ? eHoursByDay[d] : '-'}</td>
                <td>${recs.length}</td>
                <td>${fmtEur(dayRevenue)}</td>
              </tr>`
            }).join('')}
          </tbody>
        </table>
      </div>
    ` : ''

    employeeSummaryHtml = rangeChipsHtml + (
      eRecords.length === 0 ? `
        <div class="summary-row">
          <div class="name">${s.name}</div>
          <div class="sub">${employeeFilter} · ${eHasHours ? eDeclaredHours + ' Std · ' + (eBranch||'-') : 'keine Stunden erfasst'}</div>
          <div class="empty" style="padding:14px 0;">Keine Aufträge in diesem Zeitraum</div>
        </div>
      ` : summaryRowHtml(s, eHasHours ? eDeclaredHours : undefined, eBranch)
    ) + eDailyBreakdownHtml
  }

  if(allRecords.length === 0){
    main.innerHTML = `
      <div class="dash dash-empty layout-wide">
        ${rangeHeaderHtml}
        <div class="card empty-card"><div class="empty"><p class="big">Keine Aufträge in diesem Zeitraum</p></div></div>
        <div class="card summary-card">
          <label>Zusammenfassung pro Mitarbeiter</label>
          ${employeeFilterHtml}
          ${employeeFilter ? employeeSummaryHtml : '<div class="empty" style="padding:14px 0;">Mitarbeiter auswählen, um dessen Bericht unabhängig vom obigen Zeitraum zu sehen.</div>'}
        </div>
        ${reportsCardHtml}
      </div>`
    wireBossControls()
    return
  }

  // Lack/Delle: category='SR' işleri (SR-Lack/SR-Delle) — is_mts=false ve
  // code!=='Privat' olduğu için zaten "normalRevenue" (APZ) kovasına
  // dahiller; Aufbereitung = APZ − (Lack+Delle) ile bu kovanın geri kalanı
  // hesaplanıyor. MTS-SR (category='MTS', is_mts=true) tamamen ayrı bir
  // kovaya (mtsRevenue) düştüğü için burayla hiç karışmıyor.
  let normalRevenue = 0, mtsRevenue = 0, privatRevenue = 0, lackRevenue = 0, delleRevenue = 0
  records.forEach(r=>{
    const price = recordPrice(r)
    if(r.job_types.is_mts) mtsRevenue += price
    else if(r.job_types.code === 'Privat') privatRevenue += price
    else {
      normalRevenue += price
      // "Smart Repair" (Text Aufbereitung tarzı serbest metin işi) geliri de
      // SR-Lack ile AYNI kovaya (Lack kartı) yazılır — bkz. schema_v36.sql.
      if(r.job_types.code === 'SR-Lack' || r.job_types.code === 'Smart Repair Text') lackRevenue += price
      else if(r.job_types.code === 'SR-Delle') delleRevenue += price
    }
  })
  const aufbereitungRevenue = normalRevenue - (lackRevenue + delleRevenue)
  const totalRevenue = normalRevenue + mtsRevenue + privatRevenue

  const branchRevenue = {}
  BRANCHES.forEach(b => branchRevenue[b] = 0)
  let unassigned = 0
  records.forEach(r=>{
    const branch = resolveRecordBranch(r, dayBranchMap)
    if(branch && branchRevenue[branch] !== undefined){
      branchRevenue[branch] += recordPrice(r)
    } else {
      unassigned += recordPrice(r)
    }
  })

  // "Zusammenfassung pro Mitarbeiter": çalışan seçilmemişse ana Zeitraum'a
  // göre TÜM çalışanlar; seçilmişse yukarıda bağımsız Zeitraum ile zaten
  // hesaplanmış olan employeeSummaryHtml kullanılır.
  let summaryHtml
  if(!employeeFilter){
    const summary = {}
    records.forEach(r=>{
      const key = r.employees.akt_no
      if(!summary[key]) summary[key] = { name: r.employees.name, akt_no: key, count:0, revenue:0, workedMinutes:0 }
      summary[key].count += 1
      summary[key].revenue += recordPrice(r)
      summary[key].workedMinutes += r.job_types.duration_minutes + (r.regiestunde||0)*60 + (r.custom_duration_minutes||0) + (r.extra_arbeit_minutes||0)
    })
    const summaryEntries = Object.values(summary).sort((a,b)=>b.revenue-a.revenue)
    summaryHtml = summaryEntries.map(s => summaryRowHtml(s)).join('')
  } else {
    summaryHtml = employeeSummaryHtml
  }

  const rowsHtml = records.map(r => `
    <tr>
      <td>${localDateStr(r.created_at)}</td>
      <td>${r.employees.name}</td>
      <td>${jobDisplayLabel(r)}${r.performed_by ? ' · ' + r.performed_by : ''}${r.fotoservice ? ' · Foto' : ''}${r.custom_duration_minutes ? (TEXT_STYLE_CODES.includes(r.job_types.code) ? ' · ' + r.custom_duration_minutes + ' Min' : ' · ' + Math.round(r.custom_duration_minutes/60) + ' Std') : ''}${r.extra_arbeit_1_code ? ' · +' + r.extra_arbeit_1_code : ''}${r.extra_arbeit_2_code ? ' · +' + r.extra_arbeit_2_code : ''}${r.extra_arbeit_3_code ? ' · +' + r.extra_arbeit_3_code : ''}${r.extra_arbeit_4_code ? ' · +' + r.extra_arbeit_4_code : ''}${r.custom_description ? ' · ' + r.custom_description : ''}</td>
      <td>${r.ref_no || '-'}</td>
      <td>${fmtEur(recordPrice(r))}</td>
    </tr>`).join('')

  // KAPSAMLI ZAMAN BAZLI RAPORLAMA: seçilen Zeitraum birden fazla gün
  // kapsıyorsa (Woche/Monat/özel aralık), gün gün kırılım tablosu.
  let dailyBreakdownHtml = ''
  if(start !== end){
    const byDate = {}
    records.forEach(r=>{
      const d = localDateStr(r.created_at)
      if(!byDate[d]) byDate[d] = { normal:0, mts:0, privat:0, branch: Object.fromEntries(BRANCHES.map(b=>[b,0])) }
      const price = recordPrice(r)
      if(r.job_types.is_mts) byDate[d].mts += price
      else if(r.job_types.code === 'Privat') byDate[d].privat += price
      else byDate[d].normal += price
      const branch = resolveRecordBranch(r, dayBranchMap)
      if(branch && byDate[d].branch[branch] !== undefined) byDate[d].branch[branch] += price
    })
    const days = Object.keys(byDate).sort()
    if(days.length){
      dailyBreakdownHtml = `
        <div class="card daily-card">
          <label>Tägliche Aufschlüsselung</label>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Datum</th><th>APZ</th><th>MTS</th><th>Privat</th>${BRANCHES.map(b=>`<th>${b}</th>`).join('')}<th>Gesamt</th></tr></thead>
              <tbody>
                ${days.map(d=>{
                  const row = byDate[d]
                  const total = row.normal + row.mts + row.privat
                  return `<tr>
                    <td>${d}</td>
                    <td>${fmtEur(row.normal)}</td>
                    <td>${fmtEur(row.mts)}</td>
                    <td>${fmtEur(row.privat)}</td>
                    ${BRANCHES.map(b=>`<td>${fmtEur(row.branch[b])}</td>`).join('')}
                    <td>${fmtEur(total)}</td>
                  </tr>`
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `
    }
  }

  // --- Sadece görünüm için türetilen değerler (hesaplamaların kendisi
  // yukarıda, değişmeden duruyor) ---
  const netTotal = normalRevenue * 0.75 + mtsRevenue + privatRevenue
  const mtsCount = records.filter(r => r.job_types.is_mts).length
  const privatCount = records.filter(r => !r.job_types.is_mts && r.job_types.code === 'Privat').length
  const pctOf = (v, t) => t > 0 ? Math.round(v / t * 100) : 0
  const barW = (v, t) => t > 0 ? Math.max(0, Math.min(100, v / t * 100)) : 0
  const apzRow = (label, value, meta, barClass) => `
    <div class="revenue-box brk-row">
      <div class="brk-top"><span class="sub">${label}</span><span class="amount">${fmtEur(value)}</span></div>
      <div class="brk-meta"><span>${meta}</span><span class="net">Netto 75 %: ${fmtEur(value * 0.75)}</span></div>
      <div class="hbar"><i class="${barClass}" style="width:${barW(value, normalRevenue)}%"></i></div>
    </div>`

  main.innerHTML = `
    <div class="dash layout-wide">
      ${rangeHeaderHtml}

      <div class="card hero">
        <label>Umsatz gesamt</label>
        <div class="revenue-total hero-total">${fmtEur(totalRevenue)}</div>
        <div class="revenue-total-net">Netto <b>${fmtEur(netTotal)}</b> · ${records.length} Aufträge</div>
        <div class="stackbar">
          ${normalRevenue > 0 ? `<i class="c-apz" style="flex:${normalRevenue}"></i>` : ''}
          ${mtsRevenue > 0 ? `<i class="c-mts" style="flex:${mtsRevenue}"></i>` : ''}
          ${privatRevenue > 0 ? `<i class="c-privat" style="flex:${privatRevenue}"></i>` : ''}
        </div>
        <div class="legend">
          <div><span class="sw c-apz"></span>APZ gesamt<b>${fmtEur(normalRevenue)}</b></div>
          <div><span class="sw c-mts"></span>MTS<b>${fmtEur(mtsRevenue)}</b></div>
          <div><span class="sw c-privat"></span>Privat<b>${fmtEur(privatRevenue)}</b></div>
        </div>
      </div>

      <div class="card apz-card">
        <div class="revenue-box apz-head">
          <div class="sub">APZ gesamt</div>
          <div class="apz-desc">Aufbereitung + Smart Repair (Lack, Delle, Text)</div>
          <div class="amount">${fmtEur(normalRevenue)}</div>
          <div class="net">Netto 75 %: ${fmtEur(normalRevenue * 0.75)}</div>
        </div>
        <div class="davon">davon</div>
        ${apzRow('Aufbereitung', aufbereitungRevenue, pctOf(aufbereitungRevenue, normalRevenue) + ' %', '')}
        ${apzRow('Smart Repair · Lack', lackRevenue, pctOf(lackRevenue, normalRevenue) + ' % · inkl. Smart Repair Text', 'b1')}
        ${apzRow('Smart Repair · Delle', delleRevenue, pctOf(delleRevenue, normalRevenue) + ' %', 'b2')}
      </div>

      <div class="side-col">
        <div class="card kpi revenue-box mts">
          <div class="sub">MTS</div>
          <div class="amount">${fmtEur(mtsRevenue)}</div>
          <div class="hint">${mtsCount} Aufträge · ohne Abzug</div>
        </div>
        <div class="card kpi revenue-box privat">
          <div class="sub">Privatkunden</div>
          <div class="amount">${fmtEur(privatRevenue)}</div>
          <div class="hint">${privatCount} Aufträge · ohne Abzug</div>
        </div>
        <div class="card net-formula">Netto gesamt = APZ × 75 % + MTS + Privat = <b>${fmtEur(netTotal)}</b></div>
      </div>

      <div class="card branch-card">
        <label>Umsatz nach Filiale</label>
        ${BRANCHES.map(b => `
          <div class="revenue-box brk-row">
            <div class="brk-top"><span class="sub">${b}</span><span class="amount">${fmtEur(branchRevenue[b])}</span></div>
            <div class="hbar"><i class="blue" style="width:${barW(branchRevenue[b], totalRevenue)}%"></i></div>
          </div>`).join('')}
        ${unassigned > 0 ? `<div class="warn-row"><span>⚠ Keine Filiale angegeben</span><span class="mono">${fmtEur(unassigned)}</span></div>` : ''}
      </div>

      <div class="card summary-card">
        <label>Zusammenfassung pro Mitarbeiter</label>
        ${employeeFilterHtml}
        ${summaryHtml}
      </div>

      ${dailyBreakdownHtml}

      ${reportsCardHtml}

      <div class="card entries-card">
        <label>Alle Einträge (${records.length})</label>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Auftrag</th><th>Nr.</th><th>Betrag</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    </div>
  `
  wireBossControls()
}

// ============ ŞEF PANELİ — MİTARBEİTER RAPORU (kategori bazlı) ============
// Aylık, çalışan başına: toplam saat + kategori bazlı iş sayısı (GW/NW/
// SW/Foto/MTS/SR/Privat/Sonstiges — bkz. job_types.category, schema_v24.sql).
// AKT/şasi numarası GÖSTERİLMEZ, sadece sayım.
// v7.2: her çalışan için ayrıca Umsatz (recordPrice — ana panelle aynı
// hesap), Netto (APZ × 75 %, MTS/Privat %100), Regiestunden ve Auslastung
// (ana paneldeki "Kapazität" ile aynı formül). Mobilde kart, bilgisayarda
// ve PDF'te tablo. Fotoservice kayıtları zaten sahibinin (A3A/W1S/H1A)
// kaydı olarak tutulduğu için ayrıca yeniden atama yapılmaz.
let empReportSort = 'umsatz'

function shiftMonthStr(monthStr, delta){
  let [y, m] = monthStr.split('-').map(Number)
  m += delta
  while(m < 1){ m += 12; y -= 1 }
  while(m > 12){ m -= 12; y += 1 }
  return `${y}-${String(m).padStart(2,'0')}`
}

async function renderEmployeeCategoryReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  // new Date(y, m, 0).toISOString() KULLANMA — yerel saat dilimi UTC'nin
  // İLERİSİNDEYSE (Almanya her zaman öyle, UTC+1/+2) ayın son günü UTC'ye
  // çevrilirken bir önceki güne kayar, ayın son günü rapordan DÜŞER.
  // .getDate() ise yerel takvim gününü doğrudan okur, zaman dilimi
  // dönüşümünden etkilenmez (bkz. renderEmployeeMonthlyReport'taki aynı desen).
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  // recordPrice() için job_types.price_eur + is_variable_price ZORUNLU.
  const [recordsRes, hoursRes] = await Promise.all([
    fetchAllRows(() => supabase.from('records').select('*, employees(name, akt_no), job_types(category, code, is_mts, price_eur, is_variable_price, duration_minutes)').gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate)).order('id')),
    fetchAllRows(() => supabase.from('daily_hours').select('*, employees(name, akt_no)').gte('work_date', startDate).lte('work_date', endDate).order('id'))
  ])
  if(recordsRes.error || hoursRes.error){
    main.innerHTML = `<button class="refresh" id="backToBossBtn">← Zurück</button><div class="card"><div class="empty">Fehler beim Laden: ${(recordsRes.error || hoursRes.error).message}</div></div>`
    document.getElementById('backToBossBtn').addEventListener('click', renderBossDashboard)
    return
  }
  const records = recordsRes.data || []
  const hoursRows = hoursRes.data || []

  const fotoOwners = new Set(Object.values(BRANCH_FOTOSERVICE_OWNER))
  const byEmp = {}
  function ensure(akt, name){
    if(!byEmp[akt]) byEmp[akt] = { akt, name, hours: 0, hasHours: false, count: 0, nonFotoCount: 0, revenue: 0, net: 0, regie: 0, workedMinutes: 0, categories: {} }
    return byEmp[akt]
  }
  hoursRows.forEach(h=>{
    if(!h.employees) return
    const e = ensure(h.employees.akt_no, h.employees.name)
    e.hours += Number(h.hours) || 0
    e.hasHours = true
  })
  records.forEach(r=>{
    if(!r.employees || !r.job_types) return
    const e = ensure(r.employees.akt_no, r.employees.name)
    const cat = r.job_types.category || 'Sonstiges'
    e.categories[cat] = (e.categories[cat] || 0) + 1
    e.count += 1
    if(r.job_types.code !== 'FOTOSERVICE') e.nonFotoCount += 1
    const price = recordPrice(r)
    e.revenue += price
    // Ana paneldeki kova mantığıyla aynı: MTS ve Privat %100, geri kalan
    // (APZ) %75.
    e.net += (r.job_types.is_mts || r.job_types.code === 'Privat') ? price : price * 0.75
    e.regie += Number(r.regiestunde) || 0
    e.workedMinutes += (r.job_types.duration_minutes || 0) + (r.regiestunde||0)*60 + (r.custom_duration_minutes||0) + (r.extra_arbeit_minutes||0)
  })

  const list = Object.values(byEmp).map(e => {
    e.hours = Math.round(e.hours * 100) / 100
    e.regie = Math.round(e.regie * 100) / 100
    e.isCollective = e.akt === 'SmartRepair'
    e.capPct = (!e.isCollective && e.hours > 0) ? Math.round((e.workedMinutes / (e.hours * 60)) * 100) : null
    e.warn = e.isCollective ? '' :
      (e.hasHours && e.count === 0) ? 'Stunden erfasst, aber keine Aufträge' :
      (!e.hasHours && e.nonFotoCount > 0) ? 'Aufträge ohne erfasste Stunden' : ''
    return e
  })
  const tot = list.reduce((t, e) => ({ revenue: t.revenue + e.revenue, net: t.net + e.net, count: t.count + e.count, hours: t.hours + e.hours, regie: t.regie + e.regie }), { revenue: 0, net: 0, count: 0, hours: 0, regie: 0 })
  tot.hours = Math.round(tot.hours * 100) / 100
  tot.regie = Math.round(tot.regie * 100) / 100
  const anyOwnerFoto = list.some(e => fotoOwners.has(e.akt) && e.categories['Foto'])

  const monthLabel = new Date(y, m - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })
  const SORTS = [['umsatz','Umsatz'], ['auftraege','Aufträge'], ['stunden','Stunden'], ['name','Name']]

  function sorted(){
    const arr = list.slice()
    if(empReportSort === 'auftraege') arr.sort((a,b) => b.count - a.count || b.revenue - a.revenue)
    else if(empReportSort === 'stunden') arr.sort((a,b) => b.hours - a.hours || b.revenue - a.revenue)
    else if(empReportSort === 'name') arr.sort((a,b) => String(a.name).localeCompare(String(b.name), 'de'))
    else arr.sort((a,b) => b.revenue - a.revenue || b.hours - a.hours)
    return arr
  }
  function catsText(e){
    const keys = Object.keys(e.categories).sort((a,b)=> categorySortIndex(a) - categorySortIndex(b))
    if(!keys.length) return 'Keine Aufträge'
    return keys.map(c => `${c}: ${e.categories[c]}${c === 'Foto' && fotoOwners.has(e.akt) ? '*' : ''}`).join(' · ')
  }
  function hoursText(e){ return e.isCollective ? 'Sammelkonto' : `${e.hours} Std` }
  function capHtml(e){
    if(e.capPct === null) return ''
    return `<div class="cap-bar"><div class="cap-fill ${e.capPct>100?'over':''}" style="width:${Math.min(e.capPct,100)}%;"></div></div>
      <div class="sub" style="margin-top:4px;">Auslastung ${e.capPct} %</div>`
  }
  function cardsHtml(arr){
    return arr.map(e => `
      <div class="summary-row rep-card">
        <div class="top-row">
          <div>
            <div class="name">${e.name}</div>
            <div class="sub">${e.akt} · ${hoursText(e)} · ${e.count} Aufträge${e.regie ? ` · Regie ${e.regie} Std` : ''}</div>
          </div>
          <div class="stat">
            <span class="n">${fmtEur(e.revenue)}</span>
            <span class="label">Netto ${fmtEur(e.net)}</span>
          </div>
        </div>
        ${capHtml(e)}
        <div class="sub" style="margin-top:6px;">${catsText(e)}</div>
        ${e.warn ? `<div class="rep-warn">⚠ ${e.warn}</div>` : ''}
      </div>`).join('')
  }
  function tableHtml(arr){
    return `
      <div class="table-wrap">
        <table class="rep-table">
          <thead><tr><th>Mitarbeiter</th><th class="num">Std</th><th class="num">Aufträge</th><th class="num">Regie Std</th><th>Kategorien</th><th class="num">Umsatz</th><th class="num">Netto</th><th class="num">Auslastung</th></tr></thead>
          <tbody>${arr.map(e => `
            <tr>
              <td class="emp-cell"><span class="nm">${e.name}</span><span class="ak">${e.akt}</span>${e.warn ? `<span class="rep-warn">⚠ ${e.warn}</span>` : ''}</td>
              <td class="num">${e.isCollective ? '–' : e.hours}</td>
              <td class="num">${e.count}</td>
              <td class="num">${e.regie || '–'}</td>
              <td class="cats">${catsText(e)}</td>
              <td class="num strong">${fmtEur(e.revenue)}</td>
              <td class="num">${fmtEur(e.net)}</td>
              <td class="num">${e.capPct === null ? '–' : `<span class="${e.capPct>100?'over':''}">${e.capPct} %</span>`}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr>
            <td>Gesamt</td><td class="num">${tot.hours}</td><td class="num">${tot.count}</td><td class="num">${tot.regie || '–'}</td><td></td>
            <td class="num strong">${fmtEur(tot.revenue)}</td><td class="num">${fmtEur(tot.net)}</td><td></td>
          </tr></tfoot>
        </table>
      </div>`
  }

  main.innerHTML = `
    <div class="report-screen layout-wide">
      <div class="report-actions">
        <button class="refresh" id="backToBossBtn">← Zurück</button>
        <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
      </div>
      <div class="card rep-head-card">
        <div class="rep-head">
          <div>
            <label style="margin-bottom:4px;">Mitarbeiterbericht</label>
            <div class="rep-month">${monthLabel}</div>
          </div>
          <div class="month-nav">
            <button type="button" class="icon-btn" id="empCatPrevBtn" title="Vorheriger Monat">‹</button>
            <input type="month" id="empCatMonthInput" value="${monthStr}">
            <button type="button" class="icon-btn" id="empCatNextBtn" title="Nächster Monat">›</button>
          </div>
        </div>
        ${list.length ? `
        <div class="rep-stats">
          <div><span class="k">Umsatz</span><span class="v">${fmtEur(tot.revenue)}</span></div>
          <div><span class="k">Netto</span><span class="v">${fmtEur(tot.net)}</span></div>
          <div><span class="k">Aufträge</span><span class="v">${tot.count}</span></div>
          <div><span class="k">Stunden</span><span class="v">${tot.hours}</span></div>
          <div><span class="k">Regiestunden</span><span class="v">${tot.regie}</span></div>
        </div>
        <div class="sort-chips no-print">
          <span class="sort-label">Sortieren:</span>
          ${SORTS.map(([k, l]) => `<button type="button" class="range-chip sort-chip ${empReportSort === k ? 'active' : ''}" data-sort="${k}">${l}</button>`).join('')}
        </div>` : ''}
      </div>

// ============ ŞEF PANELİ — ŞUBE BAŞINA KATEGORİ RAPORU ============
// Aylık, şube başına: SADECE Normal (%25 komisyon) işler — MTS ve
// Privatkunden HARİÇ. Her şube için toplam ciro + kategori bazlı iş
// sayısı. AKT/şasi numarası GÖSTERİLMEZ. Fotoservice kayıtları, o günün
// daily_hours'una bakılmaksızın doğrudan sahibinin (A3A/W1S/H1A) sabit
// şubesine yazılır (bkz. OWNER_AKT_TO_BRANCH) — böylece owner o gün
// saatini girmemiş olsa bile Foto sayımı kaybolmaz.
async function renderBranchCategoryReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  // new Date(y, m, 0).toISOString() KULLANMA — yerel saat dilimi UTC'nin
  // İLERİSİNDEYSE (Almanya her zaman öyle, UTC+1/+2) ayın son günü UTC'ye
  // çevrilirken bir önceki güne kayar, ayın son günü rapordan DÜŞER.
  // .getDate() ise yerel takvim gününü doğrudan okur, zaman dilimi
  // dönüşümünden etkilenmez (bkz. renderEmployeeMonthlyReport'taki aynı desen).
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  const [recordsRes, hoursRes] = await Promise.all([
    fetchAllRows(() => supabase.from('records').select('*, employees(name, akt_no), job_types(category, is_mts, code, price_eur, is_variable_price)').gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate))),
    supabase.from('daily_hours').select('*, employees(name, akt_no)').gte('work_date', startDate).lte('work_date', endDate)
  ])
  const records = recordsRes.data || []
  const hoursRows = hoursRes.data || []

  // Şube ataması artık ana panelle (renderBossDashboard) AYNI paylaşılan
  // buildDayBranchMap()/resolveRecordBranch() fonksiyonlarını kullanıyor —
  // iki rapor aynı dönem için asla farklı şube ciroları göstermez.
  const dayBranchMap = buildDayBranchMap(hoursRows)

  const branchData = {}
  BRANCHES.forEach(b => branchData[b] = { revenue: 0, categories: {} })
  let unassignedCount = 0

  records.forEach(r=>{
    if(r.job_types.is_mts || r.job_types.code === 'Privat') return
    const cat = r.job_types.category || 'Sonstiges'
    const branch = resolveRecordBranch(r, dayBranchMap)
    if(!branch || !branchData[branch]){ unassignedCount += 1; return }
    branchData[branch].revenue += recordPrice(r)
    branchData[branch].categories[cat] = (branchData[branch].categories[cat] || 0) + 1
  })

  main.innerHTML = `
    <button class="refresh" id="backToBossBtn">← Zurück</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    <div class="card">
      <label style="margin-top:0;">Monat wählen</label>
      <input type="month" id="branchCatMonthInput" value="${monthStr}">
    </div>
    <div class="card">
      <label>Şube başına Kategori Raporu — ${monthStr}</label>
      ${BRANCHES.map(b=>{
        const data = branchData[b]
        const catKeys = Object.keys(data.categories).sort((a,c)=> categorySortIndex(a) - categorySortIndex(c))
        return `
          <div class="summary-row">
            <div class="top-row">
              <div class="name">${b}</div>
              <div class="stat"><span class="n">${fmtEur(data.revenue)}</span></div>
            </div>
            <div class="sub" style="margin-top:6px;">${catKeys.length ? catKeys.map(c=>`${c}: ${data.categories[c]} adet`).join(' · ') : 'Keine Aufträge'}</div>
          </div>
        `
      }).join('')}
      ${unassignedCount > 0 ? `<div class="sub" style="margin-top:10px;">Keine Filiale zugeordnet: ${unassignedCount} Auftrag/Aufträge</div>` : ''}
    </div>
  `
  document.getElementById('backToBossBtn').addEventListener('click', renderBossDashboard)
  document.getElementById('branchCatMonthInput').addEventListener('change', (e)=>renderBranchCategoryReport(e.target.value))
  document.getElementById('pdfBtn').addEventListener('click', ()=>window.print())
}

// ============ ADMİN — GEÇMİŞE KAYIT EKLEME ============
// Sadece gizli admin hesabı (is_admin && hidden_from_login) için görünür.
// Herhangi bir çalışan adına, herhangi bir geçmiş tarihe, o çalışan
// kendisi girmiş gibi (şifresiz) kayıt ekler.

let backdateSelectedJobType = null

// Admin'in "Geçmişe Kayıt Ekle" formunda seçilen çalışan+tarih için
// daily_hours (saat+şube) kaydını görüntüler; varsa Bearbeiten/Löschen,
// yoksa doğrudan bir ekleme formu gösterir. Fotoservice gibi şube bazlı
// işler o günün daily_hours kaydına bağlı olduğu için, admin bunu
// düzenleyemezse geçmişe dönük Fotoservice kaydı eklenemiyordu — bu
// fonksiyon (schema_v23.sql'deki admin RLS bypass'ı ile birlikte) o
// eksikliği gideriyor.
async function refreshBkDailyHours(){
  const wrap = document.getElementById('bkDailyHoursWrap')
  if(!wrap) return
  const empId = document.getElementById('bkEmployeeSelect').value
  const dateVal = document.getElementById('bkDate').value
  if(!empId || !dateVal){
    wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Für Stunden/Filiale-Verwaltung zuerst Mitarbeiter und Datum auswählen.</div>`
    return
  }
  wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Lädt...</div>`
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  const { data } = await supabase.from('daily_hours').select('*').eq('employee_id', empId).eq('work_date', dateVal).maybeSingle()
  if(data){
    wrap.innerHTML = `
      <div class="card" style="margin:10px 0;padding:12px;">
        <label style="margin-top:0;">${empName} — Stunden/Filiale am ${dateVal}</label>
        <div class="hours-saved">✓ Gespeichert: ${data.hours} Std · ${data.branch || 'keine Filiale angegeben'}</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="secondary" id="bkHoursEditBtn">Bearbeiten</button>
          <button class="secondary" id="bkHoursDeleteBtn" style="color:var(--red);">Löschen</button>
        </div>
      </div>
    `
    document.getElementById('bkHoursEditBtn').addEventListener('click', ()=>renderBkHoursForm(empId, dateVal, data))
    document.getElementById('bkHoursDeleteBtn').addEventListener('click', async ()=>{
      if(!confirm('Diese Stunden/Filiale-Eintragung für ' + dateVal + ' löschen?')) return
      const { error, count } = await supabase.from('daily_hours').delete({ count: 'exact' }).eq('id', data.id)
      if(error){ showToast('Fehler: ' + error.message); return }
      if(!count){ showToast('Fehler: Konnte nicht gelöscht werden — evtl. keine Berechtigung.'); return }
      showToast('Gelöscht')
      refreshBkDailyHours()
    })
  } else {
    renderBkHoursForm(empId, dateVal, null)
  }
}

function renderBkHoursForm(empId, dateVal, existing){
  const wrap = document.getElementById('bkDailyHoursWrap')
  if(!wrap) return
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  wrap.innerHTML = `
    <div class="card" style="margin:10px 0;padding:12px;">
      <label style="margin-top:0;">${empName} bu tarihte (${dateVal}) kaç saat çalıştı?</label>
      <div class="hours-row" style="margin-bottom:10px;">
        <input type="number" id="bkHoursInput" placeholder="z.B. 8" step="0.5" min="0" max="16" value="${existing ? existing.hours : ''}">
      </div>
      <label>${empName} bu tarihte hangi şubede çalıştı?</label>
      <div class="job-list" id="bkBranchList" style="margin-bottom:10px;">
        ${BRANCHES.map(b => `<div class="job-btn branch-btn${existing && existing.branch === b ? ' selected' : ''}" data-branch="${b}"><span class="code">${b}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="primary" id="bkHoursSaveBtn">Speichern</button>
        ${existing ? '<button class="secondary" id="bkHoursCancelBtn">Abbrechen</button>' : ''}
      </div>
    </div>
  `
  let pickedBranch = existing ? existing.branch : null
  wrap.querySelectorAll('#bkBranchList .branch-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      wrap.querySelectorAll('#bkBranchList .branch-btn').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      pickedBranch = btn.dataset.branch
    })
  })
  document.getElementById('bkHoursSaveBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('bkHoursInput').value
    const num = parseFloat(val)
    if(isNaN(num) || num <= 0){ showToast('Bitte gültige Stundenzahl eingeben'); return }
    if(!pickedBranch){ showToast('Bitte Filiale auswählen'); return }
    const { error } = await supabase.from('daily_hours').upsert({
      employee_id: empId,
      work_date: dateVal,
      hours: num,
      branch: pickedBranch
    }, { onConflict: 'employee_id,work_date' })
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast('Gespeichert')
    refreshBkDailyHours()
  })
  if(existing){
    document.getElementById('bkHoursCancelBtn').addEventListener('click', refreshBkDailyHours)
  }
}

// Admin'in "Geçmişe Kayıt Ekle" formunda seçilen çalışan+tarih için o
// güne ait TÜM Auftrag (records) kayıtlarını listeler, tek tek silme ve
// "Bu günü tamamen temizle" (o güne ait tüm records + daily_hours)
// seçeneği sunar. schema_v27.sql'deki admin bypass sayesinde 48 saatten
// eski kayıtlar da silinebilir.
async function refreshBkDayRecords(){
  const wrap = document.getElementById('bkDayRecordsWrap')
  if(!wrap) return
  const empId = document.getElementById('bkEmployeeSelect').value
  const dateVal = document.getElementById('bkDate').value
  if(!empId || !dateVal){
    wrap.innerHTML = ''
    return
  }
  wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Lädt...</div>`
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  const { data } = await supabase.from('records').select('*, job_types(code, name, is_mts, is_variable_price, is_quantity, is_aufbereitung, requires_ref, price_eur)').eq('employee_id', empId).gte('created_at', startOfDayISO(dateVal)).lt('created_at', endOfDayISO(dateVal)).order('created_at', { ascending: false })
  const records = data || []

  wrap.innerHTML = `
    <div class="card" style="margin:10px 0;padding:12px;">
      <label style="margin-top:0;">${empName} — ${dateVal} tarihli Aufträge (${records.length})</label>
      ${records.length === 0 ? '<div class="empty" style="padding:10px 0;">Bu tarihte kayıt yok</div>' : `
        <div class="entry-list">
          ${records.map(r => `
            <div class="entry" data-bkrecrow="${r.id}">
              <div><span class="code">${r.job_types.code}</span><span class="ref">${r.ref_no ? ' · ' + r.ref_no : ''}${r.custom_description ? ' · ' + r.custom_description : ''}</span></div>
              <div class="right">
                <span class="extra">${fmtEur(recordPrice(r))}</span>
                <button class="secondary" data-bkrecedit="${r.id}" style="padding:4px 8px;">Bearbeiten</button>
                <button class="del-btn" data-bkrecdel="${r.id}" title="Löschen">×</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
      <button class="secondary" id="bkClearDayBtn" style="margin-top:10px;color:var(--red);">🗑 Bu günü tamamen temizle</button>
    </div>
  `
  wrap.querySelectorAll('[data-bkrecdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return
      const { error, count } = await supabase.from('records').delete({ count: 'exact' }).eq('id', btn.dataset.bkrecdel)
      if(error){ showToast('Fehler: ' + error.message); return }
      if(!count){ showToast('Fehler: Konnte nicht gelöscht werden — evtl. keine Berechtigung.'); return }
      showToast('Gelöscht')
      refreshBkDayRecords()
    })
  })
  wrap.querySelectorAll('[data-bkrecedit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = records.find(rec => rec.id === btn.dataset.bkrecedit)
      if(r) renderBkRecordEditForm(r)
    })
  })
  document.getElementById('bkClearDayBtn').addEventListener('click', async ()=>{
    if(!confirm(`${empName} için ${dateVal} tarihindeki TÜM kayıtlar (işler + saat/şube) silinecek. Emin misiniz?`)) return
    const results = await Promise.all(records.map(r => supabase.from('records').delete({ count: 'exact' }).eq('id', r.id)))
    const recError = results.find(res => res.error)
    if(recError){ showToast('Fehler: ' + recError.error.message); return }
    const deletedCount = results.reduce((sum, res) => sum + (res.count || 0), 0)
    if(deletedCount < records.length){
      showToast(`Fehler: Nur ${deletedCount} von ${records.length} Aufträgen konnten gelöscht werden — evtl. keine Berechtigung.`)
      refreshBkDayRecords()
      return
    }
    // daily_hours için 0 silinmesi normal olabilir (o gün için hiç saat
    // girilmemiş olabilir) — bu yüzden burada count kontrolü YAPILMIYOR.
    const { error: dhError } = await supabase.from('daily_hours').delete().eq('employee_id', empId).eq('work_date', dateVal)
    if(dhError){ showToast('Fehler: ' + dhError.message); return }
    showToast('Tag komplett gelöscht')
    refreshBkDayRecords()
    refreshBkDailyHours()
  })
}

// Bir Auftrag kaydının AKT-Nummer, (varsa) manuel fiyatı, (varsa) Regiestunde
// saatini VE artık İŞ TİPİNİ de düzenlemek için inline form. İş tipi
// değiştirildiğinde, o tipe bağlı alanlar (fiyat/süre/MTS alt türü/Showroom
// saati/Text Aufbereitung açıklama+süre) BOŞA döner — admin yeniden girer;
// eski tipin artık kullanılmayan alanları kaydedilirken null'lanır, aksi
// halde eski veriler fiyat/kapasite hesaplarını sessizce bozmaya devam eder.
// Miktar tipi (is_quantity) işler ve FOTOSERVICE hâlâ KAPSAM DIŞI — ikisi de
// tekil kayıt düzenlemeye uymayan özel ekleme mantığına sahip (toplu satır /
// şube sahibi ataması); bunlar için kayıt silinip yeniden eklenmeli.
// schema_v28.sql'deki admin-only UPDATE politikası gerekiyor.
function renderBkRecordEditForm(r){
  const row = document.querySelector(`[data-bkrecrow="${r.id}"]`)
  if(!row) return
  const editableJobTypes = jobTypes
    .filter(j => j.active && !j.is_quantity && j.code !== 'FOTOSERVICE')
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
  let selectedJt = jobTypes.find(j => j.id === r.job_type_id) || editableJobTypes[0]

  function fieldsHtml(jt, blank){
    const v = blank ? {} : r
    const showRef = jt.requires_ref !== false
    const showPrice = jt.is_variable_price && jt.code !== 'FOTOSERVICE'
    const showRegiestunde = jt.is_aufbereitung || jt.code === 'Regiestunde'
    const showMtsType = jt.code === 'MTS-SR'
    const showShowroomHours = jt.code === 'Showroom Pflege'
    const showPerformer = jt.code === 'SR-Delle'
    const showTextFields = TEXT_STYLE_CODES.includes(jt.code)
    const showRegiestundeNote = jt.code === 'Regiestunde'
    const showSRNote = SR_NOTE_CODES.includes(jt.code)
    const showExtraArbeit = !!jt.allows_extra_arbeit
    // Fotoservice, extra arbeit üzerinden seçilirse şube sorumlusuna ayrı bir
    // kayıt oluşturulması gerekir (bkz. insertJobRecord) — bu düzenleme formu
    // (FOTOSERVICE zaten yukarıda KAPSAM DIŞI bırakılmıştı) o ek kaydı
    // oluşturmuyor, bu yüzden burada seçenek olarak hiç sunulmuyor.
    const extraOptsHtml = showExtraArbeit
      ? ('<option value="">Keine</option>' + extraArbeitEligibleJobTypes(jt).filter(j => j.code !== 'FOTOSERVICE').map(j => `<option value="${j.id}">${jobExtraArbeitLabel(j)}</option>`).join(''))
      : ''
    function extraSelectHtml(n, codeField){
      const selectedId = jobTypes.find(j => j.code === v[codeField])?.id || ''
      return `<div><label style="margin-top:0;">Extra Arbeit ${n} (optional)</label><select id="bkEditExtra${n}-${r.id}">${extraOptsHtml}</select></div>`
        .replace(`<option value="${selectedId}">`, `<option value="${selectedId}" selected>`)
    }
    return `
      ${showRef ? `<div><label style="margin-top:0;">AKT-Nummer</label><input type="text" id="bkEditRef-${r.id}" value="${v.ref_no || ''}"></div>` : ''}
      ${showPrice ? `<div><label style="margin-top:0;">Preis (€)</label><input type="number" id="bkEditPrice-${r.id}" value="${v.custom_price ?? ''}" step="0.01" min="0"></div>` : ''}
      ${showMtsType ? `<div><label style="margin-top:0;">Art</label><select id="bkEditMtsType-${r.id}"><option value="">Auswählen...</option><option value="Lack" ${v.mts_subtype==='Lack'?'selected':''}>Lack</option><option value="Delle" ${v.mts_subtype==='Delle'?'selected':''}>Delle</option></select></div>` : ''}
      ${showShowroomHours ? `<div><label style="margin-top:0;">Dauer (Std.)</label><select id="bkEditShowroomHours-${r.id}"><option value="">Auswählen...</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${v.custom_duration_minutes===n*60?'selected':''}>${n} Std</option>`).join('')}</select></div>` : ''}
      ${showPerformer ? `<div><label style="margin-top:0;">Wer hat die Arbeit ausgeführt?</label><select id="bkEditPerformer-${r.id}"><option value="">Auswählen...</option>${SR_DELLE_PERFORMERS.map(p=>`<option value="${p}" ${v.performed_by===p?'selected':''}>${p}</option>`).join('')}</select></div>` : ''}
      ${showTextFields ? `
        <div><label style="margin-top:0;">Beschreibung</label><textarea id="bkEditDesc-${r.id}" rows="3">${v.custom_description || ''}</textarea></div>
        <div><label style="margin-top:0;">Dauer (Minuten)</label><input type="number" id="bkEditDuration-${r.id}" value="${v.custom_duration_minutes ?? ''}" min="1" step="1"></div>
      ` : ''}
      ${showRegiestunde ? `<div><label style="margin-top:0;">Regiestunde (Std.)</label><input type="number" id="bkEditRegie-${r.id}" value="${v.regiestunde ?? ''}" step="0.5" min="0"></div>` : ''}
      ${showRegiestundeNote ? `<div><label style="margin-top:0;">Notiz (optional)</label><textarea id="bkEditRegieNote-${r.id}" rows="2">${v.custom_description || ''}</textarea></div>` : ''}
      ${showSRNote ? `<div><label style="margin-top:0;">Beschreibung (optional)</label><textarea id="bkEditSRNote-${r.id}" rows="2">${v.custom_description || ''}</textarea></div>` : ''}
      ${showExtraArbeit ? `
        ${extraSelectHtml(1, 'extra_arbeit_1_code')}
        ${extraSelectHtml(2, 'extra_arbeit_2_code')}
        ${extraSelectHtml(3, 'extra_arbeit_3_code')}
        ${extraSelectHtml(4, 'extra_arbeit_4_code')}
      ` : ''}
    `
  }

  function validate(jt){
    const $ = (suffix) => document.getElementById(`bkEdit${suffix}-${r.id}`)
    let ok = true
    if(jt.requires_ref !== false) ok = ok && !!($('Ref')?.value.trim())
    if(jt.is_variable_price && jt.code !== 'FOTOSERVICE'){
      const v = $('Price')?.value
      ok = ok && v && parseFloat(v) > 0
    }
    if(jt.code === 'SR-Delle') ok = ok && !!$('Performer')?.value
    if(jt.code === 'MTS-SR') ok = ok && !!$('MtsType')?.value
    if(jt.code === 'Showroom Pflege') ok = ok && !!$('ShowroomHours')?.value
    if(jt.code === 'Regiestunde'){
      const v = $('Regie')?.value
      ok = ok && v && parseFloat(v) > 0
    }
    if(TEXT_STYLE_CODES.includes(jt.code)){
      const dur = $('Duration')?.value
      ok = ok && dur && parseFloat(dur) > 0
      if(TEXT_REQUIRED_DESC_CODES.includes(jt.code)) ok = ok && !!$('Desc')?.value.trim()
    }
    // Not: aynı Extra Arbeit birden fazla slotta seçilebilir (bkz. add
    // formundaki aynı gerekçe) — bilerek engellenmiyor.
    const saveBtn = document.getElementById(`bkEditSave-${r.id}`)
    if(saveBtn) saveBtn.disabled = !ok
  }

  function wireFields(jt){
    ;['Ref','Price','Regie','Desc','Duration'].forEach(suffix=>{
      const el = document.getElementById(`bkEdit${suffix}-${r.id}`)
      if(el) el.addEventListener('input', ()=>validate(jt))
    })
    ;['MtsType','ShowroomHours','Performer','Extra1','Extra2','Extra3','Extra4'].forEach(suffix=>{
      const el = document.getElementById(`bkEdit${suffix}-${r.id}`)
      if(el) el.addEventListener('change', ()=>validate(jt))
    })
    validate(jt)
  }

  function renderFields(jt, blank){
    document.getElementById(`bkEditFields-${r.id}`).innerHTML = fieldsHtml(jt, blank)
    wireFields(jt)
  }

  row.outerHTML = `
    <div class="entry" data-bkrecrow="${r.id}" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div><label style="margin-top:0;">Auftragsart</label>
        <select id="bkEditJobType-${r.id}">
          ${editableJobTypes.map(j => `<option value="${j.id}" ${j.id === selectedJt.id ? 'selected' : ''}>${j.code}</option>`).join('')}
        </select>
      </div>
      <div id="bkEditFields-${r.id}"></div>
      <div style="display:flex;gap:8px;">
        <button class="primary" id="bkEditSave-${r.id}">Speichern</button>
        <button class="secondary" id="bkEditCancel-${r.id}">Abbrechen</button>
      </div>
    </div>
  `
  renderFields(selectedJt, false)

  document.getElementById(`bkEditJobType-${r.id}`).addEventListener('change', (e)=>{
    selectedJt = jobTypes.find(j => j.id === e.target.value)
    renderFields(selectedJt, true)
  })
  document.getElementById(`bkEditCancel-${r.id}`).addEventListener('click', refreshBkDayRecords)
  document.getElementById(`bkEditSave-${r.id}`).addEventListener('click', async ()=>{
    const $ = (suffix) => document.getElementById(`bkEdit${suffix}-${r.id}`)
    const jt = selectedJt
    // İş tipi değişmiş olabileceğinden, eski tipin kullandığı ama yeni tipte
    // geçerli olmayan TÜM alanlar açıkça null'lanır — aksi halde eski veriler
    // (ör. eski bir custom_price) yeni tip için sessizce yanlış fiyat/süre
    // hesaplanmasına yol açar.
    const payload = {
      job_type_id: jt.id,
      ref_no: null,
      custom_price: null,
      regiestunde: null,
      mts_subtype: null,
      performed_by: null,
      custom_duration_minutes: null,
      custom_description: null,
      extra_arbeit_price: null,
      extra_arbeit_minutes: null,
      extra_arbeit_1_code: null,
      extra_arbeit_2_code: null,
      extra_arbeit_3_code: null,
      extra_arbeit_4_code: null
    }
    if(!FOTOSERVICE_JOB_CODES.includes(jt.code)) payload.fotoservice = false
    if(jt.requires_ref !== false){
      const v = $('Ref')?.value.trim()
      if(!v){ showToast('Bitte AKT-Nummer eingeben'); return }
      payload.ref_no = v
    }
    if(jt.is_variable_price && jt.code !== 'FOTOSERVICE'){
      const v = $('Price')?.value
      if(!v || parseFloat(v) <= 0){ showToast('Bitte gültigen Preis eingeben'); return }
      payload.custom_price = parseFloat(v)
    }
    if(jt.code === 'SR-Delle'){
      const v = $('Performer')?.value
      if(!v){ showToast('Bitte auswählen, wer die Arbeit ausgeführt hat'); return }
      payload.performed_by = v
    }
    if(jt.code === 'MTS-SR'){
      const v = $('MtsType')?.value
      if(!v){ showToast('Bitte Art auswählen'); return }
      payload.mts_subtype = v
    }
    if(jt.code === 'Showroom Pflege'){
      const v = $('ShowroomHours')?.value
      if(!v){ showToast('Bitte Dauer auswählen'); return }
      payload.custom_duration_minutes = parseInt(v) * 60
    }
    if(jt.code === 'Regiestunde'){
      const v = $('Regie')?.value
      if(!v || parseFloat(v) <= 0){ showToast('Bitte gültige Stundenzahl eingeben'); return }
      payload.regiestunde = parseFloat(v)
      payload.custom_description = $('RegieNote')?.value.trim() || null
    } else if(jt.is_aufbereitung){
      const v = $('Regie')?.value
      payload.regiestunde = v ? parseFloat(v) : null
    }
    if(TEXT_STYLE_CODES.includes(jt.code)){
      const desc = $('Desc')?.value.trim()
      const dur = $('Duration')?.value
      if(TEXT_REQUIRED_DESC_CODES.includes(jt.code) && !desc){ showToast('Bitte Beschreibung ausfüllen'); return }
      if(!dur || parseFloat(dur) <= 0){ showToast('Bitte Dauer ausfüllen'); return }
      payload.custom_description = desc || null
      payload.custom_duration_minutes = parseInt(dur)
    }
    if(SR_NOTE_CODES.includes(jt.code)) payload.custom_description = $('SRNote')?.value.trim() || null
    if(jt.allows_extra_arbeit){
      const extraIds = [$('Extra1')?.value, $('Extra2')?.value, $('Extra3')?.value, $('Extra4')?.value].filter(Boolean)
      if(extraIds.length){
        let extraPrice = 0, extraMinutes = 0
        const extraCodes = []
        extraIds.forEach(id=>{
          const ej = jobTypes.find(j => j.id === id)
          if(ej){
            extraPrice += ej.price_eur || 0
            extraMinutes += ej.duration_minutes || 0
            extraCodes.push(ej.code)
          }
        })
        payload.extra_arbeit_price = extraPrice
        payload.extra_arbeit_minutes = extraMinutes
        payload.extra_arbeit_1_code = extraCodes[0] || null
        payload.extra_arbeit_2_code = extraCodes[1] || null
        payload.extra_arbeit_3_code = extraCodes[2] || null
        payload.extra_arbeit_4_code = extraCodes[3] || null
      }
    }
    const { error, count } = await supabase.from('records').update(payload, { count: 'exact' }).eq('id', r.id)
    if(error){ showToast('Fehler: ' + error.message); return }
    if(!count){ showToast('Fehler: Konnte nicht gespeichert werden — evtl. keine Berechtigung.'); return }
    showToast('Gespeichert')
    refreshBkDayRecords()
  })
}

function wireAdminBackdateForm(){
  const card = document.getElementById('adminBackdateCard')
  if(!card) return
  backdateSelectedJobType = null
  const extraValid = () => !!document.getElementById('bkEmployeeSelect').value && !!document.getElementById('bkDate').value
  wireJobForm('bk', ()=>backdateSelectedJobType, (jt)=>{ backdateSelectedJobType = jt }, extraValid)
  document.getElementById('bkEmployeeSelect').addEventListener('change', ()=>{
    validateJobForm('bk', ()=>backdateSelectedJobType, extraValid)
    refreshBkDailyHours()
    refreshBkDayRecords()
  })
  document.getElementById('bkDate').addEventListener('change', ()=>{
    validateJobForm('bk', ()=>backdateSelectedJobType, extraValid)
    refreshBkDailyHours()
    refreshBkDayRecords()
  })
  refreshBkDailyHours()
  refreshBkDayRecords()
  document.getElementById('bkAddBtn').addEventListener('click', async ()=>{
    const empId = document.getElementById('bkEmployeeSelect').value
    const dateVal = document.getElementById('bkDate').value
    if(!empId){ showToast('Bitte Mitarbeiter auswählen'); return }
    if(!dateVal){ showToast('Bitte Datum auswählen'); return }
    // localDateStr() kullanılıyor (todayStr() DEĞİL) — todayStr() UTC tarihini
    // döndürüyor; Almanya saatiyle 00:00-02:00 arası UTC hâlâ "dün" olabilir,
    // bu da bugünün tarihini yanlışlıkla "gelecekte" gibi reddedebilirdi.
    const localToday = localDateStr(new Date())
    if(dateVal > localToday){ showToast('Datum darf nicht in der Zukunft liegen'); return }
    const jt = backdateSelectedJobType
    if(!jt){ showToast('Bitte Auftragsart auswählen'); return }
    const values = readJobFormValues('bk', jt)
    const createdAtOverride = new Date(dateVal + 'T12:00:00').toISOString()
    const { error, count } = await insertJobRecord({
      jobType: jt,
      employeeId: empId,
      values,
      dateStr: dateVal,
      createdAtOverride
    })
    if(error){ showToast('Fehler: ' + error.message); console.error('Geçmişe kayıt ekleme hatası:', error); return }
    showToast('Rückwirkender Eintrag für ' + dateVal + ' gespeichert')
    backdateSelectedJobType = null
    renderEmployeeDay()
  })
}

async function startApp(){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  await loadStaticData()

  // Önce gerçek Supabase Auth oturumu var mı kontrol edilir (auth_user_id
  // ile taşınmış çalışanlar için — sayfa yenilenince otomatik giriş).
  const { data: { session } } = await supabase.auth.getSession()
  if(session){
    const emp = employees.find(e => e.auth_user_id === session.user.id)
    if(emp){
      if(await restoreStandort(emp)) return
      routeAfterLogin(emp)
      return
    }
  }

  // Geçiş dönemi: auth_user_id henüz yoksa eski localStorage oturumuna bak.
  // ÖNEMLİ: eğer bu çalışan zaten gerçek Auth'a taşınmışsa (auth_user_id
  // dolu) ama yukarıdaki gerçek oturum kontrolü boş çıktıysa, bu çalışanın
  // gerçek Supabase oturumu ÖLMÜŞ demektir (ör. telefonda Safari'nin
  // localStorage'ı birkaç günde bir temizlemesi yüzünden Supabase'in kendi
  // oturum anahtarı silinmiş, ama bu SESSION_KEY bayrağı hayatta kalmış
  // olabilir). Bu durumda çalışanı SESSİZCE "giriş yapılmış" gibi
  // göstermek YANLIŞ — arayüz normal görünür, kayıt ekleme bile çalışır
  // (insert kuralı auth gerektirmiyor) ama silme sessizce RLS tarafından
  // reddedilir (hem çalışan hem admin için — "Berechtigung" hatası). Bunun
  // yerine gerçek girişe yönlendiriyoruz.
  const savedId = localStorage.getItem(SESSION_KEY)
  if(savedId){
    const emp = employees.find(e => e.id === savedId)
    if(emp && emp.auth_user_id){
      localStorage.removeItem(SESSION_KEY)
      showToast('Sitzung abgelaufen — bitte erneut anmelden')
      renderLandingScreen()
      return
    }
    if(emp){
      if(await restoreStandort(emp)) return
      currentEmployee = emp; updateLogoutBtn(); setChromeVisible(true); renderEmployeeDay(); return
    }
  }
  renderLandingScreen()
}

// Sayfa yenilenince Standort oturumu aynı gün içinde devam eder. Gün
// değiştiyse (paylaşılan tablet) oturum kapatılır ve giriş ekranına dönülür.
// true = durum ele alındı (Standort açıldı veya çıkış yapıldı).
async function restoreStandort(emp){
  const st = readStandortState()
  if(!st) return false
  if(st.empId !== emp.id || emp.lead_branch !== st.branch){ writeStandortState(null); return false }
  if(st.date !== todayStr()){
    writeStandortState(null)
    localStorage.removeItem(SESSION_KEY)
    if(emp.auth_user_id){ try { await supabase.auth.signOut() } catch(e){} }
    showToast('Standort-Sitzung beendet (neuer Tag) — bitte erneut anmelden')
    renderLandingScreen()
    return true
  }
  enterStandort(emp, st.branch)
  return true
}

async function init(){
  setChromeVisible(false)
  if(localStorage.getItem(SITE_GATE_KEY) === '1'){
    await startApp()
  } else {
    renderSiteGate()
  }
}
