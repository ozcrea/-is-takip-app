<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atölye İş Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1B1E21;
    --steel:#26292D;
    --steel-2:#2F3338;
    --amber:#F5A623;
    --green:#4CAF6D;
    --red:#E4572E;
    --ink:#ECEDEE;
    --ink-dim:#9AA0A6;
    --line:#3A3F44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--graphite);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 4px;
  }
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:.01em;
    margin:0;
    line-height:1;
  }
  nav{
    display:flex;
    gap:0;
    border-bottom:1px solid var(--line);
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:14px 8px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav button.active{
    color:var(--amber);
    border-bottom-color:var(--amber);
  }
  main{
    flex:1;
    padding:20px;
  }
  .card{
    background:var(--steel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  select, input{
    width:100%;
    background:var(--steel-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:14px;
    border-radius:8px;
    margin-bottom:16px;
  }
  select:focus, input:focus{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  .job-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .job-btn{
    background:var(--steel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:8px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .job-btn .code{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:18px;
    display:block;
  }
  .job-btn .std{
    font-size:12px;
    color:var(--ink-dim);
    display:block;
    margin-top:2px;
  }
  .job-btn.selected{
    border-color:var(--amber);
    background:rgba(245,166,35,0.12);
  }
  button.primary{
    width:100%;
    background:var(--amber);
    color:#1B1E21;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:8px;
    cursor:pointer;
  }
  button.primary:disabled{
    background:var(--steel-2);
    color:var(--ink-dim);
    cursor:not-allowed;
  }
  button.danger{
    background:var(--red);
    color:white;
  }
  .active-job{
    text-align:center;
  }
  .active-job .code{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    font-weight:700;
    color:var(--amber);
  }
  .active-job .meta{
    color:var(--ink-dim);
    font-size:13px;
    margin:6px 0 18px;
  }
  .timer{
    font-family:'JetBrains Mono',monospace;
    font-size:44px;
    font-weight:700;
    margin:8px 0 20px;
  }
  .empty{
    text-align:center;
    color:var(--ink-dim);
    padding:40px 10px;
  }
  .empty .big{
    font-family:'Barlow Condensed',sans-serif;
    font-size:22px;
    color:var(--ink);
    margin-bottom:6px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-dim);
    padding:8px 6px;
    border-bottom:1px solid var(--line);
  }
  td{
    padding:10px 6px;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
  }
  .diff-pos{color:var(--red);}
  .diff-neg{color:var(--green);}
  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row .name{font-weight:600;}
  .summary-row .stat{
    font-family:'JetBrains Mono',monospace;
    text-align:right;
  }
  .stat .n{font-size:18px;font-weight:700;}
  .stat .label{font-size:10px;color:var(--ink-dim);display:block;}
  .pin-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    text-align:center;
  }
  .pin-screen input{
    max-width:160px;
    text-align:center;
    letter-spacing:.3em;
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--steel-2);
    border:1px solid var(--amber);
    color:var(--ink);
    padding:12px 20px;
    border-radius:8px;
    font-size:14px;
    z-index:100;
  }
  .refresh{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:12px;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:14px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Atölye İş Takip</p>
    <h1 id="headerTitle">Çalışan Girişi</h1>
  </header>
  <nav>
    <button id="tabEmployee" class="active">Çalışan Girişi</button>
    <button id="tabBoss">Şef Paneli</button>
  </nav>
  <main id="main"></main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ==== SUPABASE BAĞLANTISI ====
const SUPABASE_URL = "https://mfgofccidwmrqlyjbsvz.supabase.co"
const SUPABASE_KEY = "sb_publishable_n5PXoej2lr_FQQVCjag0jw_EifWkYir"
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// Şef paneli için basit PIN (istersen değiştir)
const BOSS_PIN = "1234"

const main = document.getElementById('main')
const headerTitle = document.getElementById('headerTitle')
const tabEmployee = document.getElementById('tabEmployee')
const tabBoss = document.getElementById('tabBoss')

let currentTab = 'employee'
let bossUnlocked = false
let employees = []
let jobTypes = []
let selectedEmployeeId = null
let selectedJobTypeId = null
let activeRecord = null
let timerInterval = null

function showToast(msg){
  const t = document.createElement('div')
  t.className = 'toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(()=> t.remove(), 2500)
}

async function loadStaticData(){
  const { data: emp } = await supabase.from('employees').select('*').eq('active', true).order('name')
  const { data: jt } = await supabase.from('job_types').select('*').eq('active', true).order('code')
  employees = emp || []
  jobTypes = jt || []
}

// ============ ÇALIŞAN GİRİŞİ ============

function renderEmployeeSelect(){
  main.innerHTML = `
    <div class="card">
      <label>Kendi adını / AKT numaranı seç</label>
      <select id="empSelect">
        <option value="">Seçiniz...</option>
        ${employees.map(e => `<option value="${e.id}">${e.name} (${e.akt_no})</option>`).join('')}
      </select>
    </div>
  `
  document.getElementById('empSelect').addEventListener('change', async (e)=>{
    selectedEmployeeId = e.target.value
    if(selectedEmployeeId){
      await checkActiveJob()
    }
  })
}

async function checkActiveJob(){
  const { data } = await supabase
    .from('records')
    .select('*, job_types(code, name, standard_minutes)')
    .eq('employee_id', selectedEmployeeId)
    .is('end_time', null)
    .order('start_time', { ascending: false })
    .limit(1)

  activeRecord = (data && data[0]) || null
  if(activeRecord){
    renderActiveJob()
  } else {
    renderNewJobForm()
  }
}

function renderNewJobForm(){
  const emp = employees.find(e=>e.id===selectedEmployeeId)
  selectedJobTypeId = null
  main.innerHTML = `
    <div class="card">
      <label>Çalışan</label>
      <select id="empSelect2">
        ${employees.map(e => `<option value="${e.id}" ${e.id===selectedEmployeeId?'selected':''}>${e.name} (${e.akt_no})</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <label>İş tipi seç</label>
      <div class="job-grid" id="jobGrid">
        ${jobTypes.map(j => `
          <div class="job-btn" data-id="${j.id}">
            <span class="code">${j.code}</span>
            <span class="std">${j.standard_minutes} dk standart</span>
          </div>`).join('')}
      </div>
      <label>İş numarası</label>
      <input type="text" id="jobNo" placeholder="Örn. 48213" inputmode="numeric">
      <button class="primary" id="startBtn" disabled>İşi Başlat</button>
    </div>
  `
  document.getElementById('empSelect2').addEventListener('change', (e)=>{
    selectedEmployeeId = e.target.value
    checkActiveJob()
  })
  document.querySelectorAll('.job-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.job-btn').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      selectedJobTypeId = btn.dataset.id
      validateStart()
    })
  })
  document.getElementById('jobNo').addEventListener('input', validateStart)
  document.getElementById('startBtn').addEventListener('click', startJob)
}

function validateStart(){
  const jobNo = document.getElementById('jobNo').value.trim()
  document.getElementById('startBtn').disabled = !(selectedJobTypeId && jobNo)
}

async function startJob(){
  const jobNo = document.getElementById('jobNo').value.trim()
  const { data, error } = await supabase.from('records').insert({
    employee_id: selectedEmployeeId,
    job_type_id: selectedJobTypeId,
    job_no: jobNo,
    start_time: new Date().toISOString()
  }).select().single()

  if(error){ showToast('Hata: ' + error.message); return }
  showToast('İş başlatıldı')
  await checkActiveJob()
}

function renderActiveJob(){
  if(timerInterval) clearInterval(timerInterval)
  const jt = activeRecord.job_types
  main.innerHTML = `
    <div class="card active-job">
      <p class="meta">Devam eden iş</p>
      <span class="code">${jt.code} · #${activeRecord.job_no}</span>
      <p class="meta">Standart süre: ${jt.standard_minutes} dk</p>
      <div class="timer" id="timerDisplay">00:00</div>
      <button class="primary danger" id="finishBtn">İşi Bitir</button>
    </div>
  `
  const startedAt = new Date(activeRecord.start_time).getTime()
  function tick(){
    const diffSec = Math.floor((Date.now() - startedAt)/1000)
    const m = String(Math.floor(diffSec/60)).padStart(2,'0')
    const s = String(diffSec%60).padStart(2,'0')
    const el = document.getElementById('timerDisplay')
    if(el) el.textContent = `${m}:${s}`
  }
  tick()
  timerInterval = setInterval(tick, 1000)
  document.getElementById('finishBtn').addEventListener('click', finishJob)
}

async function finishJob(){
  if(timerInterval) clearInterval(timerInterval)
  const endTime = new Date()
  const startTime = new Date(activeRecord.start_time)
  const durationMinutes = Math.round((endTime - startTime)/60000)
  const std = activeRecord.job_types.standard_minutes
  const diffMinutes = durationMinutes - std

  const { error } = await supabase.from('records').update({
    end_time: endTime.toISOString(),
    duration_minutes: durationMinutes,
    diff_minutes: diffMinutes
  }).eq('id', activeRecord.id)

  if(error){ showToast('Hata: ' + error.message); return }
  showToast(`İş bitti: ${durationMinutes} dk (standart ${std} dk)`)
  activeRecord = null
  renderNewJobForm()
}

// ============ ŞEF PANELİ ============

function renderBossPin(){
  main.innerHTML = `
    <div class="pin-screen">
      <p class="eyebrow" style="color:var(--ink-dim)">Yetkili girişi</p>
      <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:24px;margin:4px 0 20px;">PIN gir</h2>
      <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
      <button class="primary" id="pinBtn" style="max-width:160px;">Giriş</button>
    </div>
  `
  document.getElementById('pinBtn').addEventListener('click', ()=>{
    const val = document.getElementById('pinInput').value
    if(val === BOSS_PIN){
      bossUnlocked = true
      renderBossDashboard()
    } else {
      showToast('Yanlış PIN')
    }
  })
}

async function renderBossDashboard(){
  main.innerHTML = `<div class="empty">Yükleniyor...</div>`

  const todayStart = new Date()
  todayStart.setHours(0,0,0,0)

  const { data: records, error } = await supabase
    .from('records')
    .select('*, employees(name, akt_no), job_types(code, name, standard_minutes)')
    .not('end_time', 'is', null)
    .gte('start_time', todayStart.toISOString())
    .order('end_time', { ascending: false })

  if(error){
    main.innerHTML = `<div class="empty">Veri alınamadı: ${error.message}</div>`
    return
  }

  if(!records || records.length === 0){
    main.innerHTML = `
      <button class="refresh" id="refreshBtn">↻ Yenile</button>
      <div class="empty">
        <p class="big">Bugün henüz tamamlanmış iş yok</p>
        <p>Çalışanlar iş bitirdikçe burada görünecek.</p>
      </div>`
    document.getElementById('refreshBtn').addEventListener('click', renderBossDashboard)
    return
  }

  // Çalışan bazında özet
  const summary = {}
  records.forEach(r=>{
    const key = r.employees.akt_no
    if(!summary[key]){
      summary[key] = { name: r.employees.name, akt_no: key, count:0, totalStd:0, totalDur:0 }
    }
    summary[key].count += 1
    summary[key].totalStd += r.job_types.standard_minutes
    summary[key].totalDur += r.duration_minutes
  })

  const summaryHtml = Object.values(summary).sort((a,b)=> (b.totalDur-b.totalStd) - (a.totalDur-a.totalStd)).map(s=>{
    const diff = s.totalDur - s.totalStd
    const diffClass = diff > 0 ? 'diff-pos' : 'diff-neg'
    const diffLabel = diff > 0 ? `+${diff} dk ekstra` : `${diff} dk (erken)`
    return `
      <div class="summary-row">
        <div>
          <div class="name">${s.name}</div>
          <div style="color:var(--ink-dim);font-size:12px;">${s.akt_no}</div>
        </div>
        <div class="stat">
          <span class="n">${s.count} iş</span>
          <span class="label ${diffClass}">${diffLabel}</span>
        </div>
      </div>`
  }).join('')

  const rowsHtml = records.map(r=>{
    const diffClass = r.diff_minutes > 0 ? 'diff-pos' : 'diff-neg'
    const diffLabel = r.diff_minutes > 0 ? `+${r.diff_minutes}` : `${r.diff_minutes}`
    return `
      <tr>
        <td>${r.employees.name}</td>
        <td>${r.job_types.code} #${r.job_no}</td>
        <td>${r.duration_minutes} dk</td>
        <td class="${diffClass}">${diffLabel} dk</td>
      </tr>`
  }).join('')

  main.innerHTML = `
    <button class="refresh" id="refreshBtn">↻ Yenile</button>
    <div class="card">
      <label>Bugünkü özet (çalışan bazında)</label>
      ${summaryHtml}
    </div>
    <div class="card">
      <label>Tüm kayıtlar</label>
      <table>
        <thead><tr><th>Çalışan</th><th>İş</th><th>Süre</th><th>Fark</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `
  document.getElementById('refreshBtn').addEventListener('click', renderBossDashboard)
}

// ============ TAB YÖNETİMİ ============

tabEmployee.addEventListener('click', ()=>{
  currentTab = 'employee'
  tabEmployee.classList.add('active')
  tabBoss.classList.remove('active')
  headerTitle.textContent = 'Çalışan Girişi'
  if(selectedEmployeeId){ checkActiveJob() } else { renderEmployeeSelect() }
})

tabBoss.addEventListener('click', ()=>{
  currentTab = 'boss'
  tabBoss.classList.add('active')
  tabEmployee.classList.remove('active')
  headerTitle.textContent = 'Şef Paneli'
  if(timerInterval) clearInterval(timerInterval)
  if(bossUnlocked){ renderBossDashboard() } else { renderBossPin() }
})

// ============ BAŞLAT ============

async function init(){
  main.innerHTML = `<div class="empty">Yükleniyor...</div>`
  await loadStaticData()
  renderEmployeeSelect()
}
init()
</script>
</body>
</html>
