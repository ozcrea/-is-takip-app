<style>
  :root{
    --graphite:#1B1E21; --steel:#26292D; --steel-2:#2F3338;
    --amber:#F5A623; --green:#4CAF6D; --red:#E4572E; --blue:#5B9BD5; --purple:#9B7EDE;
    --ink:#ECEDEE; --ink-dim:#9AA0A6; --line:#3A3F44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--graphite); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  .app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header{ padding:calc(20px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; }
  header .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:0 0 4px; }

  .job-btn{
    background:var(--steel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px;

  .job-btn.selected .code{ color:var(--amber); }
  .mts-tag{ font-size:9px; background:rgba(91,155,213,0.18); color:var(--blue); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .qty-tag{ font-size:9px; background:rgba(155,126,222,0.18); color:var(--purple); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .job-btn .qty-count{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }

  button.primary:disabled{ background:var(--steel-2); color:var(--ink-dim); cursor:not-allowed; }
  button.secondary{ width:100%; background:var(--steel-2); color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:14px; padding:12px; border-radius:8px; cursor:pointer; }

  .table-wrap{ overflow-x:auto; }

  .landing-screen{ position:fixed; inset:0; background:#16181B; display:flex; align-items:center; justify-content:center; z-index:50; }

  .landing-screen .logo .accent{ color:#6FA3D8; }
  .landing-screen .cross{ font-size:20px; font-weight:300; color:#7C8B9C; line-height:1; }
  .landing-screen .product{ font-size:13px; font-weight:500; letter-spacing:1px; color:#8B9198; text-transform:lowercase; margin-top:2px; }
  .landing-screen .panel{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .landing-screen .panel select, .landing-screen .panel input{ margin-bottom:0; }
  .btn-login{ width:100%; padding:15px 20px; background:#4A7FB0; color:#fff; border:none; border-radius:4px; font-size:15px; font-weight:600; letter-spacing:.2px; cursor:pointer; transition:background .15s ease; }
  .btn-login:hover{ background:#6FA3D8; }
  .btn-boss{ width:100%; padding:13px 20px; background:transparent; color:#8B9198; border:1px solid #2A2E33; border-radius:4px; font-size:13.5px; cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  .btn-boss:hover{ border-color:#7C8B9C; color:#AAB6C2; }

  .gate-screen{ position:fixed; inset:0; background:#16181B; z-index:100; display:flex; align-items:center; justify-content:center; }

  .gate-screen .lock{ font-size:32px; margin-bottom:18px; }

  @media print{
    /* Koyu tema, renk değişkenlerinin (--ink, --steel, vb.) kök seviyesinde
       ezilmesiyle kapatılıyor — uygulamanın hemen hemen tüm bileşenleri
       renklerini var(--xxx) üzerinden aldığı için, tek tek her seçiciyi
       ezmek yerine burada kökten beyaz/siyah'a çevirmek yeterli ve daha
       güvenilir (yeni bir bileşen eklendiğinde de otomatik kapsanır). */
    :root{
      --graphite:#fff; --steel:#fff; --steel-2:#fff;
      --amber:#000; --green:#000; --red:#000; --blue:#000; --purple:#000;
      --ink:#000; --ink-dim:#333; --line:#999;
    }
    header, nav, .refresh, #pdfBtn, .del-btn, .range-chips, .search-wrap,
    #adminBackdateCard, input, select, #employeeFilterSelect{ display:none !important; }
    body{ background:#fff; color:#000; }
    .card{ border:1px solid #999; break-inside:avoid; background:#fff; }
    .amount, .revenue-total, .stat .n{ color:#000 !important; }
    /* Tablolar: ekranda mobil için ayarlanmış min-width, yazdırmada
       kaydırma çubuğuna ve kesilmiş sütunlara yol açıyordu — sayfaya
       tam sığacak şekilde serbest bırakılıyor. */
    .table-wrap{ overflow:visible !important; }
    .table-wrap table{ min-width:0 !important; width:100% !important; }
    table{ font-size:10px !important; }
    th, td{ padding:4px 6px !important; }
    .print-hide-col{ display:none !important; }
  }

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = "https://mfgofccidwmrqlyjbsvz.supabase.co"
const SUPABASE_KEY = "sb_publishable_n5PXoej2lr_FQQVCjag0jw_EifWkYir"
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

const BOSS_PIN = "1617"
const REGIESTUNDE_RATE = 33.28
const BRANCHES = ['Ausschläger Weg', 'Horn', 'Wiesendamm']
const SR_DELLE_PERFORMERS = ['Delltom', 'Hesam', 'M']
const FOTOSERVICE_PRICE = 9.88
const FOTOSERVICE_JOB_CODES = ['GW-A', 'GW-B', 'GW-FR', 'VFW-W1', 'VFW-W2']
const VAPID_PUBLIC_KEY = 'BHWTo7bjAcsBLL9HbvJczCDcBj78aB4xv1atwN_CaaF7-PF5o-6WPKguMaRC6_-L_d0kiLNQTaxCUBqr6x4yIfU'
const SESSION_KEY = 'wt_employee_id'
const AUTH_EMAIL_DOMAIN = 'mitarbeiter.autowerk.app'

// Fotoservice, kaydı giren çalışan kim olursa olsun, o günkü şubeye
// atanan SABİT kişiye yazılır (bkz. insertJobRecord).
const BRANCH_FOTOSERVICE_OWNER = { 'Ausschläger Weg': 'A3A', 'Wiesendamm': 'W1S', 'Horn': 'H1A' }
// Fotoservice fiyatı şubeye göre değişir (Audi vs. VW/Skoda). FOTOSERVICE
// iş tipi is_variable_price=true olarak işaretli (schema_v15.sql) — bu
// harita, insertJobRecord()'da owner kaydının custom_price'ını belirler.
const FOTOSERVICE_BRANCH_PRICE = { 'Ausschläger Weg': 9.88, 'Horn': 12.48, 'Wiesendamm': 12.48 }
// BRANCH_FOTOSERVICE_OWNER'ın tersi — bir FOTOSERVICE kaydının akt_no'sundan
// (A3A/W1S/H1A) doğrudan şubesini bulmak için (bkz. şef panelindeki Şube
// Kategori Raporu). Bu, o günün daily_hours kaydına bağımlı olmadığı için
// (owner o gün saatini girmemiş olsa bile) daha güvenilir.
const OWNER_AKT_TO_BRANCH = Object.fromEntries(Object.entries(BRANCH_FOTOSERVICE_OWNER).map(([branch, akt]) => [akt, branch]))

// dayBranchMap: employees.akt_no -> { work_date: branch } — daily_hours
// satırlarından, GÜNE ÖZEL şube ataması için (bkz. resolveRecordBranch()).
// Çok günlük bir Zeitraum'da bir çalışan farklı günlerde farklı şubede
// çalışmış olabilir; tek bir "son işlenen" değeri kullanmak (eski
// branchMap deseni) yanlış şubeye ciro yazdırabiliyordu.
function buildDayBranchMap(hoursRows){
  const map = {}
  hoursRows.forEach(h=>{
    const akt = h.employees.akt_no
    if(!map[akt]) map[akt] = {}
    map[akt][h.work_date] = h.branch
  })
  return map
}

// Bir kaydın hangi şubeye ait sayılacağını belirler. Fotoservice kayıtları
// o günün daily_hours'una bakılmaksızın doğrudan sahibinin (A3A/W1S/H1A)
// sabit şubesine yazılır — böylece owner o gün saatini girmemiş olsa bile
// Foto geliri "unassigned"a düşmez. Diğer tüm kayıtlar, kaydı giren
// çalışanın O GÜNKÜ (kaydın kendi tarihine göre) beyan ettiği şubeye
// atanır. Şef panelindeki ana panel VE Şube Kategori Raporu AYNI bu
// fonksiyonu kullanır — iki rapor aynı dönem için asla farklı şube
// ciroları göstermez.
function resolveRecordBranch(r, dayBranchMap){
  if(r.job_types.code === 'FOTOSERVICE' && OWNER_AKT_TO_BRANCH[r.employees.akt_no]){
    return OWNER_AKT_TO_BRANCH[r.employees.akt_no]
  }
  return dayBranchMap[r.employees.akt_no]?.[localDateStr(r.created_at)]
}

// job_types.category (schema_v24.sql) için görüntüleme sırası — listede
// olmayan bir kategori en sona eklenir.
const CATEGORY_DISPLAY_ORDER = ['GW', 'NW', 'SW', 'Foto', 'MTS', 'SR', 'Privat', 'Sonstiges']
function categorySortIndex(cat){
  const idx = CATEGORY_DISPLAY_ORDER.indexOf(cat)
  return idx === -1 ? CATEGORY_DISPLAY_ORDER.length : idx
}

// Site geneli erişim şifresi. Bu SADECE tarayıcı tarafında kontrol edilen
// bir engel — sayfa kaynağını görebilen biri şifreyi görebilir. Gerçek
// veri koruması Supabase RLS'ten geliyor, bu sadece rastgele ziyaretçiyi
// arayüzü görmekten alıkoyan basit bir kapı.
const SITE_GATE_PASSWORD = 'Autowerk2026'
const SITE_GATE_KEY = 'wt_site_gate_ok'

const main = document.getElementById('main')
const headerTitle = document.getElementById('headerTitle')
const tabEmployee = document.getElementById('tabEmployee')
const tabBoss = document.getElementById('tabBoss')
const logoutBtn = document.getElementById('logoutBtn')
const appHeader = document.getElementById('appHeader')
const appNav = document.getElementById('appNav')

function setChromeVisible(visible){
  appHeader.style.display = visible ? 'flex' : 'none'
  appNav.style.display = visible ? 'flex' : 'none'
}

let bossUnlocked = false
let employees = []
let jobTypes = []
let currentEmployee = null
let selectedJobType = null
let bossRange = { mode: 'today', start: null, end: null }

function showToast(msg){
  const t = document.createElement('div')
  t.className = 'toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(()=> t.remove(), 2500)
}

function todayStr(){
  return new Date().toISOString().slice(0,10)
}

function startOfDayISO(dateStr){
  return new Date(dateStr + 'T00:00:00').toISOString()
}

function endOfDayISO(dateStr){
  const d = new Date(dateStr + 'T00:00:00')
  d.setDate(d.getDate() + 1)
  return d.toISOString()
}

function fmtEur(n){
  return '€' + (n||0).toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 })
}

function todayLabel(){
  return new Date().toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' })
}

function recordPrice(r){
  // Not: Fotoservice geliri artık bu kayda değil, ayrı bir FOTOSERVICE
  // kaydına (şubenin sabit sorumlusuna) yazılıyor — bkz. insertJobRecord().
  // 'fotoservice' alanı burada sadece bilgi amaçlı bir etikettir, fiyata eklenmez.
  const base = r.job_types.is_variable_price ? (r.custom_price || 0) : (r.job_types.price_eur || 0)
  return base + (r.regiestunde||0) * REGIESTUNDE_RATE + (r.extra_arbeit_price || 0)
}

// SADECE şef panelinde (Alle Einträge tablosu + PDF çıktısı) kullanılır —
// MTS işlerinin ham kodu yerine okunabilir bir isim gösterir. Çalışanın
// kendi günlük listesi (Mitarbeiter sekmesi) hâlâ ham kodu gösterir.
function jobDisplayLabel(r){
  const code = r.job_types.code
  if(code === 'MTS-NW') return 'Neuwagen Aufbereitung'
  if(code === 'MTS-GW') return 'Gebrauchtwagen Aufbereitung'
  if(code === 'MTS-SR'){
    if(r.mts_subtype === 'Lack') return 'Lack Smart Repair'
    if(r.mts_subtype === 'Delle') return 'Delle Smart Repair'
  }
  return `${code}${r.job_types.is_mts ? ' (MTS)' : ''}${r.mts_subtype ? ' · ' + r.mts_subtype : ''}`
}

function localDateStr(iso){
  const d = new Date(iso)
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}

// Bir ayın ilk/son gününü YEREL takvime göre, toISOString() KULLANMADAN
// üretir. new Date(y, m, 1).toISOString() gibi bir kurgu, yerel saat
// dilimi UTC'nin ilerisindeyse (Almanya her zaman öyle, UTC+1/+2) o
// tarihi bir gün ERKENe kaydırır — "Dieser Monat" filtreleri bir önceki
// ayın son gününü de yanlışlıkla kapsar, aylık raporlar ayın son gününü
// yanlışlıkla dışlar. .getDate() yerel takvim gününü doğrudan okuduğu
// için bu sorunu yaşamaz.
function monthBounds(year, month0){ // month0: 0-indeksli ay (Ocak=0)
  const start = `${year}-${String(month0+1).padStart(2,'0')}-01`
  const lastDay = new Date(year, month0+1, 0).getDate()
  const end = `${year}-${String(month0+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`
  return { start, end }
}

function visibleJobTypes(){
  return jobTypes.filter(j => !j.is_internal)
}

// "Extra Arbeit" için seçilebilecek havuz: manuel fiyat girilen (Smart
// Repair dahil), sayaç bazlı ve iç kullanım hizmetleri hariç tutulur —
// bunların hepsi sabit tek bir fiyata sahip, ekstra girdi gerektirmez.
// İSTİSNA: FOTOSERVICE (is_variable_price=true olsa da) her zaman havuzda —
// tek fark, ana işin kendi Fotoservice "Ja/Nein" sorusu varsa (GW-A/B/FR,
// VFW-W1/W2) çift sayımı önlemek için Extra Arbeit'te tekrar gösterilmez.
function extraArbeitEligibleJobTypes(mainJobType){
  return jobTypes.filter(j => {
    if(j.is_quantity || j.is_internal) return false
    // Regiestunde standalone iş tipi, kendi manuel saat girişiyle (bkz.
    // RegiestundeHoursInput) çalışır — Extra Arbeit yolundan seçilirse
    // fiyat/süre girme imkanı olmadığından price_eur=0 no-op'a düşer.
    if(j.code === 'Regiestunde') return false
    if(mainJobType && j.id === mainJobType.id) return false
    if(j.code === 'FOTOSERVICE'){
      if(mainJobType && FOTOSERVICE_JOB_CODES.includes(mainJobType.code)) return false
      return true
    }
    return !j.is_variable_price
  })
}

function jobExtraArbeitLabel(j){
  if(j.code === 'FOTOSERVICE') return `${j.code} (Preis: je Filiale)`
  return `${j.code} (${fmtEur(j.price_eur||0)})`
}

function extraArbeitOptionsHtml(mainJobType){
  return extraArbeitEligibleJobTypes(mainJobType)
    .map(j => `<option value="${j.id}">${jobExtraArbeitLabel(j)}</option>`).join('')
}

// extraValid (isteğe bağlı): iş formu alanları dışında sağlanması gereken
// ek bir koşul (örn. admin'in geçmişe kayıt formunda çalışan+tarih seçili
// olması). Sağlanmadan "Auftrag hinzufügen" butonu etkinleşmez — böylece
// admin formunda eksik alan varken buton tıklansa bile SESSİZCE hiçbir şey
// olmaz izlenimi yerine, buton zaten devre dışı kalır.
function validateJobForm(prefix, getSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  const jt = getSelected()
  const extraOk = extraValid ? extraValid() : true
  if(!jt){ $('AddBtn').disabled = true; return }
  let ok = true
  if(jt.is_quantity){
    const qtyVal = $('QtyInput').value
    ok = qtyVal && parseInt(qtyVal) > 0
  } else {
    if(jt.requires_ref === false){
      ok = true
    } else {
      const refNo = $('RefNo').value.trim()
      ok = !!refNo
    }
    if(jt.is_variable_price && jt.code !== 'FOTOSERVICE'){
      const priceVal = $('CustomPrice').value
      ok = ok && priceVal && parseFloat(priceVal) > 0
    }
    if(jt.code === 'SR-Delle'){
      ok = ok && !!$('PerformerSelect').value
    }
    if(jt.code === 'MTS-SR'){
      ok = ok && !!$('MtsTypeSelect').value
    }
    if(jt.code === 'Showroom Pflege'){
      ok = ok && !!$('ShowroomHoursSelect').value
    }
    if(jt.code === 'Regiestunde'){
      const v = $('RegiestundeHoursInput').value
      ok = ok && v && parseFloat(v) > 0
    }
    if(jt.allows_extra_arbeit){
      const e1 = $('ExtraArbeit1Select').value
      const e2 = $('ExtraArbeit2Select').value
      if(e1 && e2 && e1 === e2) ok = false
    }
  }
  $('AddBtn').disabled = !(ok && extraOk)
}

function wireJobForm(prefix, getSelected, setSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  $('JobList').querySelectorAll('.job-btn[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $('JobList').querySelectorAll('.job-btn[data-id]').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      const jt = jobTypes.find(j => j.id === btn.dataset.id)
      setSelected(jt)
      const showRef = !jt.is_quantity && jt.requires_ref !== false
      $('RefNoWrap').style.display = showRef ? 'block' : 'none'
      $('QtyWrap').style.display = jt.is_quantity ? 'block' : 'none'
      $('RegiestundeWrap').style.display = jt.is_aufbereitung ? 'block' : 'none'
      $('RegiestundeHoursWrap').style.display = jt.code === 'Regiestunde' ? 'block' : 'none'
      $('PriceWrap').style.display = (jt.is_variable_price && jt.code !== 'FOTOSERVICE') ? 'block' : 'none'
      $('PerformerWrap').style.display = jt.code === 'SR-Delle' ? 'block' : 'none'
      $('MtsTypeWrap').style.display = jt.code === 'MTS-SR' ? 'block' : 'none'
      $('ShowroomHoursWrap').style.display = jt.code === 'Showroom Pflege' ? 'block' : 'none'
      $('FotoserviceWrap').style.display = FOTOSERVICE_JOB_CODES.includes(jt.code) ? 'block' : 'none'
      $('ExtraArbeitWrap').style.display = jt.allows_extra_arbeit ? 'block' : 'none'
      if(jt.allows_extra_arbeit){
        const optsHtml = '<option value="">Keine</option>' + extraArbeitOptionsHtml(jt)
        $('ExtraArbeit1Select').innerHTML = optsHtml
        $('ExtraArbeit2Select').innerHTML = optsHtml
      }
      if(!jt.is_aufbereitung) $('Regiestunde').value = ''
      if(jt.code !== 'Regiestunde') $('RegiestundeHoursInput').value = ''
      if(jt.code !== 'SR-Delle') $('PerformerSelect').value = ''
      if(jt.code !== 'MTS-SR') $('MtsTypeSelect').value = ''
      if(jt.code !== 'Showroom Pflege') $('ShowroomHoursSelect').value = ''
      if(!FOTOSERVICE_JOB_CODES.includes(jt.code)) $('FotoserviceSelect').value = 'nein'
      if(!jt.allows_extra_arbeit){ $('ExtraArbeit1Select').value = ''; $('ExtraArbeit2Select').value = '' }
      if(jt.is_quantity) $('QtyInput').value = ''
      validateJobForm(prefix, getSelected, extraValid)
    })
  })
  ;['RefNo','QtyInput','CustomPrice','RegiestundeHoursInput'].forEach(id=>{
    $(id).addEventListener('input', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
  ;['PerformerSelect','MtsTypeSelect','ShowroomHoursSelect','ExtraArbeit1Select','ExtraArbeit2Select'].forEach(id=>{
    $(id).addEventListener('change', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
  $('JobSearch').addEventListener('input', ()=>{
    const q = $('JobSearch').value.trim().toLowerCase()
    $('JobList').querySelectorAll('.job-btn[data-id]').forEach(btn=>{
      const jt = jobTypes.find(j => j.id === btn.dataset.id)
      const match = !q || (jt && jt.code.toLowerCase().includes(q))
      btn.style.display = match ? 'flex' : 'none'
    })
  })
}

function readJobFormValues(prefix, jt){
  const $ = (id) => document.getElementById(prefix + id)
  if(jt.is_quantity){
    return { qty: parseInt($('QtyInput').value) }
  }
  return {
    refNo: jt.requires_ref === false ? null : $('RefNo').value.trim(),
    // Regiestunde standalone job tipi seçiliyse, saat manuel girilen input'tan
    // (ondalıklı da olabilir) okunur; diğer iş tiplerinde ise mevcut "Regiestunde
    // Aufbereitung" ek alanı dropdown'ından (tam sayı, 1-10) okunur.
    regiestunde: jt.code === 'Regiestunde'
      ? ($('RegiestundeHoursInput').value ? parseFloat($('RegiestundeHoursInput').value) : null)
      : ($('Regiestunde').value ? parseInt($('Regiestunde').value) : null),
    customPrice: $('CustomPrice').value ? parseFloat($('CustomPrice').value) : null,
    performedBy: $('PerformerSelect').value || null,
    mtsSubtype: $('MtsTypeSelect').value || null,
    fotoservice: $('FotoserviceSelect').value === 'ja',
    showroomHours: $('ShowroomHoursSelect').value ? parseInt($('ShowroomHoursSelect').value) : null,
    extraArbeit1Id: $('ExtraArbeit1Select').value || null,
    extraArbeit2Id: $('ExtraArbeit2Select').value || null
  }
}

async function lookupBranchForDate(employeeId, dateStr){
  const { data } = await supabase.from('daily_hours').select('branch').eq('employee_id', employeeId).eq('work_date', dateStr).maybeSingle()
  return data?.branch || null
}

// Merkezi kayıt ekleme fonksiyonu — hem çalışanın kendi girişi hem de
// admin'in geçmişe dönük girişi bunu kullanır. Fotoservice = Ja seçiliyse,
// ana işin kendi süresi/fiyatı girene ait kalır; Fotoservice'in 8 dakikası
// ve 9,88 €'su ayrı bir FOTOSERVICE kaydı olarak, o günkü şubenin sabit
// sorumlusuna (BRANCH_FOTOSERVICE_OWNER) yazılır.
async function insertJobRecord({ jobType, employeeId, values, dateStr, createdAtOverride }){
  const createdAtField = createdAtOverride ? { created_at: createdAtOverride } : {}

  if(jobType.is_quantity){
    const rows = Array.from({ length: values.qty }, () => ({
      employee_id: employeeId,
      job_type_id: jobType.id,
      ref_no: null,
      regiestunde: null,
      ...createdAtField
    }))
    const { error } = await supabase.from('records').insert(rows)
    return { error, count: values.qty }
  }

  // Standalone FOTOSERVICE seçimi: genel listeden doğrudan seçildiğinde
  // girenin adına HİÇBİR kayıt oluşturulmaz — tek kayıt doğrudan o günkü
  // şubenin sabit sorumlusuna (BRANCH_FOTOSERVICE_OWNER) yazılır.
  if(jobType.code === 'FOTOSERVICE'){
    const branch = await lookupBranchForDate(employeeId, dateStr)
    const ownerAktNo = branch && BRANCH_FOTOSERVICE_OWNER[branch]
    if(!ownerAktNo){
      return { error: { message: 'Für diesen Tag ist keine Filiale hinterlegt — Fotoservice kann nicht zugeordnet werden.' } }
    }
    const owner = employees.find(e => e.akt_no === ownerAktNo)
    if(!owner){
      return { error: { message: `Fotoservice-Empfänger (${ownerAktNo}) wurde nicht gefunden.` } }
    }
    const { error } = await supabase.from('records').insert([{
      employee_id: owner.id,
      job_type_id: jobType.id,
      ref_no: values.refNo,
      regiestunde: null,
      fotoservice: false,
      custom_price: FOTOSERVICE_BRANCH_PRICE[branch] ?? FOTOSERVICE_PRICE,
      ...createdAtField
    }])
    return { error, count: 1 }
  }

  // Fotoservice, Extra Arbeit seçeneklerinden biri olarak da seçilmiş
  // olabilir (bkz. extraArbeitEligibleJobTypes) — bu durumda da giren
  // çalışana değil, şube sorumlusuna ayrı bir kayıt olarak yazılır, ana
  // kaydın extra_arbeit toplamına DAHİL EDİLMEZ (aşağıda nonFotoExtraIds).
  const extraArbeitFotoserviceId = jobType.allows_extra_arbeit &&
    [values.extraArbeit1Id, values.extraArbeit2Id].find(id => id && jobTypes.find(j => j.id === id)?.code === 'FOTOSERVICE')

  const wantsFotoservice = (FOTOSERVICE_JOB_CODES.includes(jobType.code) && values.fotoservice) || !!extraArbeitFotoserviceId
  let ownerEmployeeId = null
  let branch = null

  if(wantsFotoservice){
    branch = await lookupBranchForDate(employeeId, dateStr)
    const ownerAktNo = branch && BRANCH_FOTOSERVICE_OWNER[branch]
    if(!ownerAktNo){
      return { error: { message: 'Für diesen Tag ist keine Filiale hinterlegt — Fotoservice kann nicht zugeordnet werden.' } }
    }
    const owner = employees.find(e => e.akt_no === ownerAktNo)
    if(!owner){
      return { error: { message: `Fotoservice-Empfänger (${ownerAktNo}) wurde nicht gefunden.` } }
    }
    ownerEmployeeId = owner.id
  }

  const payload = {
    employee_id: employeeId,
    job_type_id: jobType.id,
    ref_no: values.refNo,
    regiestunde: values.regiestunde,
    ...createdAtField
  }
  if(jobType.is_variable_price) payload.custom_price = values.customPrice
  if(jobType.code === 'SR-Delle') payload.performed_by = values.performedBy
  if(jobType.code === 'MTS-SR') payload.mts_subtype = values.mtsSubtype
  if(jobType.code === 'Showroom Pflege') payload.custom_duration_minutes = values.showroomHours * 60
  if(FOTOSERVICE_JOB_CODES.includes(jobType.code)){
    payload.fotoservice = values.fotoservice
  } else if(wantsFotoservice){
    // Ana iş FOTOSERVICE_JOB_CODES'ta değil (Extra Arbeit üzerinden Fotoservice
    // seçildi) ama owner kaydıyla birlikte tek bir batch insert'te gidecek —
    // satırlar farklı key setine sahipse PostgREST eksik alana DEFAULT yerine
    // açıkça null gönderir, NOT NULL ihlaline yol açar. Bu yüzden burada da
    // bilerek false set ediliyor (bkz. aşağıdaki owner satırındaki aynı not).
    payload.fotoservice = false
  }

  // Extra Arbeit: seçilen 1-2 ek hizmetin fiyatı/süresi Regiestunde gibi
  // ana kayda toplanıyor, ayrı bir kayıt oluşturulmuyor. FOTOSERVICE
  // seçilmişse ayrı ele alınıyor (yukarıda), bu yüzden buradan hariç tutulur.
  if(jobType.allows_extra_arbeit){
    const extraIds = [values.extraArbeit1Id, values.extraArbeit2Id].filter(Boolean)
    const nonFotoExtraIds = extraIds.filter(id => jobTypes.find(j => j.id === id)?.code !== 'FOTOSERVICE')
    if(nonFotoExtraIds.length){
      let extraPrice = 0, extraMinutes = 0
      const extraCodes = []
      nonFotoExtraIds.forEach(id=>{
        const ej = jobTypes.find(j => j.id === id)
        if(ej){
          extraPrice += ej.price_eur || 0
          extraMinutes += ej.duration_minutes || 0
          extraCodes.push(ej.code)
        }
      })
      payload.extra_arbeit_price = extraPrice
      payload.extra_arbeit_minutes = extraMinutes
      payload.extra_arbeit_1_code = extraCodes[0] || null
      payload.extra_arbeit_2_code = extraCodes[1] || null
    }
  }

  const rowsToInsert = [payload]

  if(wantsFotoservice){
    const fotoJobType = jobTypes.find(j => j.code === 'FOTOSERVICE')
    if(!fotoJobType){
      return { error: { message: 'FOTOSERVICE Auftragsart fehlt in der Datenbank (siehe schema_v14.sql).' } }
    }
    // Fotoservice fiyatı şubeye göre değişir (bkz. FOTOSERVICE_BRANCH_PRICE) —
    // FOTOSERVICE artık is_variable_price=true, bu yüzden custom_price
    // burada açıkça belirtiliyor.
    rowsToInsert.push({
      employee_id: ownerEmployeeId,
      job_type_id: fotoJobType.id,
      ref_no: values.refNo,
      regiestunde: null,
      fotoservice: false, // NOT NULL kolon — bulk insert'te satırlar farklı
                          // key setine sahipse eksik alan DEFAULT yerine
                          // açıkça null gönderilir, bu yüzden burada bilerek belirtiliyor.
      custom_price: FOTOSERVICE_BRANCH_PRICE[branch] ?? FOTOSERVICE_PRICE,
      ...createdAtField
    })
  }

  const { error } = await supabase.from('records').insert(rowsToInsert)
  return { error, count: 1 }
}

// Bir çalışanı doğrular. auth_user_id doluysa gerçek Supabase Auth
// üzerinden (signInWithPassword), henüz taşınmadıysa (geçiş dönemi)
// eski yöntemle (düz metin karşılaştırma) — böylece migrate-employees
// fonksiyonu çalıştırılmadan önce de sonra da giriş bozulmaz.
async function authenticateEmployee(emp, password){
  if(emp.auth_user_id){
    const email = `${emp.akt_no.toLowerCase()}@${AUTH_EMAIL_DOMAIN}`
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if(error){ return false }
    return true
  }
  return (emp.password || '') === password
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4)
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
  const rawData = atob(base64)
  const outputArray = new Uint8Array(rawData.length)
  for(let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i)
  return outputArray
}

async function getPushSubscriptionStatus(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported'
  const reg = await navigator.serviceWorker.ready
  const sub = await reg.pushManager.getSubscription()
  if(!sub) return 'not-subscribed'
  // VAPID anahtarları yenilendiyse eski anahtarla oluşturulmuş abonelikler
  // artık geçersizdir ama tarayıcıda kayıtlı kalmaya devam eder. Böyle bir
  // uyuşmazlık tespit edilirse aboneliği otomatik temizleyip butonu tekrar
  // gösteriyoruz — aksi halde buton hiç çıkmaz ama bildirim de gelmez.
  try {
    const currentKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    const subKey = sub.options && sub.options.applicationServerKey
    if(subKey){
      const subKeyArr = new Uint8Array(subKey)
      const mismatch = subKeyArr.length !== currentKey.length || !subKeyArr.every((v,i)=>v===currentKey[i])
      if(mismatch){
        await sub.unsubscribe()
        return 'not-subscribed'
      }
    }
  } catch(e) { /* karşılaştırma desteklenmiyorsa mevcut durumu koru */ }
  return 'subscribed'
}

async function resetPushSubscription(){
  try {

    const sub = await reg.pushManager.getSubscription()
    if(sub) await sub.unsubscribe()

async function enablePushNotifications(){
  try {
    const permission = await Notification.requestPermission()
    if(permission !== 'granted'){ showToast('Benachrichtigungen wurden nicht erlaubt'); return }
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    })
    const json = sub.toJSON()
    const { error } = await supabase.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' })
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast('Benachrichtigungen aktiviert')
    renderBossDashboard()
  } catch(e){
    showToast('Fehler: ' + e.message)
  }
}

function currentRangeDates(){
  const today = todayStr()
  if(bossRange.mode === 'today') return { start: today, end: today }
  if(bossRange.mode === 'yesterday'){
    const d = new Date(); d.setDate(d.getDate() - 1)
    const s = d.toISOString().slice(0,10)
    return { start: s, end: s }
  }
  if(bossRange.mode === 'week'){
    const d = new Date(); const day = (d.getDay()+6)%7 // Montag=0
    const monday = new Date(d); monday.setDate(d.getDate()-day)
    return { start: monday.toISOString().slice(0,10), end: today }
  }
  if(bossRange.mode === 'month'){
    const d = new Date()
    return { start: monthBounds(d.getFullYear(), d.getMonth()).start, end: today }
  }
  return { start: bossRange.start || today, end: bossRange.end || today }
}

// "Zusammenfassung pro Mitarbeiter" bir çalışan seçiliyken kendi
// bağımsız Zeitraum'una sahip olabiliyor (Dün/Woche/Monat/Letzter Monat) —
// üstteki ana Zeitraum'dan tamamen ayrı, kendi state'i (bossRange.employeeReportMode).
function employeeSummaryRangeDates(mode){
  const today = todayStr()
  if(mode === 'yesterday'){
    const d = new Date(); d.setDate(d.getDate() - 1)
    const s = d.toISOString().slice(0,10)
    return { start: s, end: s }
  }
  if(mode === 'month'){
    const d = new Date()
    return { start: monthBounds(d.getFullYear(), d.getMonth()).start, end: today }
  }
  if(mode === 'lastMonth'){
    const d = new Date()
    let y = d.getFullYear(), prevMonth0 = d.getMonth() - 1
    if(prevMonth0 < 0){ prevMonth0 = 11; y -= 1 }
    return monthBounds(y, prevMonth0)
  }
  // 'week' (varsayılan)
  const d = new Date(); const day = (d.getDay()+6)%7
  const monday = new Date(d); monday.setDate(d.getDate()-day)
  return { start: monday.toISOString().slice(0,10), end: today }
}

      </div>
      <div class="search-wrap">
        <label>Filiale</label>
        <div class="range-chips">
          <div class="range-chip branch-chip ${!bossRange.branchFilter?'active':''}" data-branch="">Alle</div>
          ${BRANCHES.map(b => `<div class="range-chip branch-chip ${bossRange.branchFilter===b?'active':''}" data-branch="${b}">${b}</div>`).join('')}
        </div>
      </div>
    </div>
  `

  const hoursMap = {}
  // branchMap: sadece "Zusammenfassung pro Mitarbeiter"da isim yanında
  // gösterilen bilgi amaçlı şube etiketi için (bkz. summaryRowHtml) —
  // asıl ciro/şube hesaplamaları artık güne-özel dayBranchMap üzerinden
  // resolveRecordBranch() ile yapılıyor.
  const branchMap = {}
  hours.forEach(h => {
    hoursMap[h.employees.akt_no] = (hoursMap[h.employees.akt_no] || 0) + Number(h.hours)
    branchMap[h.employees.akt_no] = h.branch
  })
  const dayBranchMap = buildDayBranchMap(hours)

  // declaredHoursOverride/branchOverride: "Zusammenfassung pro Mitarbeiter"da
  // bir çalışan seçiliyken kendi bağımsız Zeitraum'undan gelen değerler
  // kullanılır (hoursMap/branchMap ana Zeitraum'a göre hesaplanmıştır).
  function summaryRowHtml(s, declaredHoursOverride, branchOverride){
    const declaredHours = declaredHoursOverride !== undefined ? declaredHoursOverride : hoursMap[s.akt_no]
    const branch = branchOverride !== undefined ? branchOverride : branchMap[s.akt_no]
    const declaredMinutes = declaredHours !== undefined ? declaredHours * 60 : null
    const capPct = declaredMinutes ? Math.round((s.workedMinutes / declaredMinutes) * 100) : null
    return `
      <div class="summary-row">
        <div class="top-row">
          <div>
            <div class="name">${s.name}</div>
            <div class="sub">${s.akt_no} · ${declaredHours !== undefined ? declaredHours + ' Std · ' + (branch || '-') : 'keine Stunden erfasst'}</div>
          </div>
          <div class="stat">
            <span class="n">${fmtEur(s.revenue)}</span>
            <span class="label">${s.count} Aufträge</span>
          </div>
        </div>
        ${capPct !== null ? `
          <div class="cap-bar"><div class="cap-fill ${capPct>100?'over':''}" style="width:${Math.min(capPct,100)}%;"></div></div>
          <div class="sub" style="margin-top:4px;">Kapazität: %${capPct} (${Math.round(s.workedMinutes)} Min. Arbeit / ${declaredMinutes} Min. Anwesenheit)</div>
        ` : `
          <div class="sub" style="margin-top:4px;">Arbeitszeit: ${Math.round(s.workedMinutes)} Min. (keine erfasste Anwesenheit, daher keine Kapazität %)</div>
        `}
      </div>`
  }

  const search = (bossRange.search || '').trim().toLowerCase()
  const branchFilter = bossRange.branchFilter || ''
  const employeeFilter = bossRange.employeeFilter || ''
  let records = search ? allRecords.filter(r => (r.ref_no||'').toLowerCase().includes(search)) : allRecords
  if(branchFilter){
    records = records.filter(r => resolveRecordBranch(r, dayBranchMap) === branchFilter)
  }
  // HATA DÜZELTMESİ: çalışan filtresi artık Zeitraum ile birlikte TÜM
  // rapor bölümlerine (toplamlar, şube dağılımı, tablo) uygulanıyor —
  // önceden sadece "Zusammenfassung pro Mitarbeiter" kartını etkiliyordu.
  if(employeeFilter){
    records = records.filter(r => r.employees.akt_no === employeeFilter)
  }

  const employeeFilterHtml = `
    <label style="margin-top:0;">Mitarbeiter filtern</label>
    <select id="employeeFilterSelect">
      <option value="">Alle Mitarbeiter</option>
      ${employees.map(e => `<option value="${e.akt_no}" ${employeeFilter===e.akt_no?'selected':''}>${e.name} (${e.akt_no})</option>`).join('')}
    </select>
  `

  // "Zusammenfassung pro Mitarbeiter" — bir çalışan seçiliyken ANA
  // Zeitraum'dan (üstteki) TAMAMEN BAĞIMSIZ kendi zaman aralığını
  // (Gestern/Woche/Monat/Letzter Monat) kullanır, kendi verisini ayrıca
  // çeker — böylece örn. "Bugün" seçiliyken bir çalışanın "Geçen Ay"
  // performansı da görüntülenebilir.
  let employeeSummaryHtml = ''
  if(employeeFilter){
    const empReportMode = bossRange.employeeReportMode || 'week'
    const { start: eStart, end: eEnd } = employeeSummaryRangeDates(empReportMode)
    const emp = employees.find(e => e.akt_no === employeeFilter)
    const [eRecordsRes, eHoursRes] = await Promise.all([
      supabase.from('records').select('*, employees(name, akt_no), job_types(code, name, duration_minutes, price_eur, is_mts, is_variable_price)').eq('employee_id', emp ? emp.id : '').gte('created_at', startOfDayISO(eStart)).lt('created_at', endOfDayISO(eEnd)),
      supabase.from('daily_hours').select('*').eq('employee_id', emp ? emp.id : '').gte('work_date', eStart).lte('work_date', eEnd)
    ])
    const eRecords = eRecordsRes.data || []
    const eHoursRows = eHoursRes.data || []
    let eDeclaredHours = 0
    let eBranch = null
    eHoursRows.forEach(h => { eDeclaredHours += Number(h.hours); eBranch = h.branch })
    const eHasHours = eHoursRows.length > 0

    const s = { name: emp ? emp.name : employeeFilter, akt_no: employeeFilter, count: 0, revenue: 0, workedMinutes: 0 }
    eRecords.forEach(r=>{
      s.count += 1
      s.revenue += recordPrice(r)
      s.workedMinutes += r.job_types.duration_minutes + (r.regiestunde||0)*60 + (r.custom_duration_minutes||0) + (r.extra_arbeit_minutes||0)
    })

    const rangeChipsHtml = `
      <div class="range-chips" style="margin-top:10px;">
        ${['yesterday','week','month','lastMonth'].map(m => `<div class="range-chip emp-range-chip ${empReportMode===m?'active':''}" data-emprange="${m}">${EMPLOYEE_SUMMARY_RANGE_LABELS[m]}</div>`).join('')}
      </div>
      <div class="sub" style="color:var(--ink-dim);font-size:12px;margin:6px 0 0;">${eStart === eEnd ? eStart : eStart + ' – ' + eEnd}</div>
    `

    // Detaylı günlük kırılım (tarih + saat + iş sayısı + CİRO) — bu artık
    // çalışanın kendi Monatsbericht'inde değil, sadece burada görünüyor.
    const eHoursByDay = {}
    eHoursRows.forEach(h => { eHoursByDay[h.work_date] = Number(h.hours) })
    const eRecordsByDay = {}
    eRecords.forEach(r => {
      const d = localDateStr(r.created_at)
      if(!eRecordsByDay[d]) eRecordsByDay[d] = []
      eRecordsByDay[d].push(r)
    })
    const eAllDays = Array.from(new Set([...Object.keys(eHoursByDay), ...Object.keys(eRecordsByDay)])).sort()
    const eDailyBreakdownHtml = eAllDays.length ? `
      <div class="table-wrap" style="margin-top:14px;">
        <table>
          <thead><tr><th>Datum</th><th>Std.</th><th>Aufträge</th><th>Umsatz</th></tr></thead>
          <tbody>
            ${eAllDays.map(d=>{
              const recs = eRecordsByDay[d] || []
              const dayRevenue = recs.reduce((sum,r)=>sum + recordPrice(r), 0)
              return `<tr>
                <td>${d}</td>
                <td>${eHoursByDay[d] !== undefined ? eHoursByDay[d] : '-'}</td>
                <td>${recs.length}</td>
                <td>${fmtEur(dayRevenue)}</td>
              </tr>`
            }).join('')}
          </tbody>
        </table>
      </div>
    ` : ''

    employeeSummaryHtml = rangeChipsHtml + (
      eRecords.length === 0 ? `
        <div class="summary-row">
          <div class="name">${s.name}</div>
          <div class="sub">${employeeFilter} · ${eHasHours ? eDeclaredHours + ' Std · ' + (eBranch||'-') : 'keine Stunden erfasst'}</div>
          <div class="empty" style="padding:14px 0;">Keine Aufträge in diesem Zeitraum</div>
        </div>
      ` : summaryRowHtml(s, eHasHours ? eDeclaredHours : undefined, eBranch)
    ) + eDailyBreakdownHtml
  }

  if(allRecords.length === 0){
    main.innerHTML = `
      <button class="refresh" id="refreshBtn">↻ Aktualisieren</button>
      <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
      <button class="refresh" id="empCatReportBtn">👤 Mitarbeiter Raporu</button>
      <button class="refresh" id="branchCatReportBtn">🏬 Şube Kategori Raporu</button>
      <button class="refresh" id="mtsProformaReportBtn">🧾 MTS Proforma</button>
      ${pushCardHtml}
      ${rangeHeaderHtml}
      <div class="card">
        <label>Zusammenfassung pro Mitarbeiter</label>
        ${employeeFilterHtml}
        ${employeeFilter ? employeeSummaryHtml : '<div class="empty" style="padding:14px 0;">Mitarbeiter auswählen, um dessen Bericht unabhängig vom obigen Zeitraum zu sehen.</div>'}
      </div>
      <div class="empty"><p class="big">Keine Aufträge in diesem Zeitraum</p></div>`
    wireBossControls()
    return
  }

  let normalRevenue = 0, mtsRevenue = 0, privatRevenue = 0
  records.forEach(r=>{
    const price = recordPrice(r)
    if(r.job_types.is_mts) mtsRevenue += price
    else if(r.job_types.code === 'Privat') privatRevenue += price
    else normalRevenue += price
  })
  const totalRevenue = normalRevenue + mtsRevenue + privatRevenue

  const branchRevenue = {}
  BRANCHES.forEach(b => branchRevenue[b] = 0)
  let unassigned = 0
  records.forEach(r=>{
    const branch = resolveRecordBranch(r, dayBranchMap)
    if(branch && branchRevenue[branch] !== undefined){
      branchRevenue[branch] += recordPrice(r)
    } else {
      unassigned += recordPrice(r)
    }
  })

  // "Zusammenfassung pro Mitarbeiter": çalışan seçilmemişse ana Zeitraum'a
  // göre TÜM çalışanlar; seçilmişse yukarıda bağımsız Zeitraum ile zaten
  // hesaplanmış olan employeeSummaryHtml kullanılır.
  let summaryHtml
  if(!employeeFilter){
    const summary = {}
    records.forEach(r=>{
      const key = r.employees.akt_no
      if(!summary[key]) summary[key] = { name: r.employees.name, akt_no: key, count:0, revenue:0, workedMinutes:0 }
      summary[key].count += 1
      summary[key].revenue += recordPrice(r)
      summary[key].workedMinutes += r.job_types.duration_minutes + (r.regiestunde||0)*60 + (r.custom_duration_minutes||0) + (r.extra_arbeit_minutes||0)
    })
    const summaryEntries = Object.values(summary).sort((a,b)=>b.revenue-a.revenue)
    summaryHtml = summaryEntries.map(s => summaryRowHtml(s)).join('')
  } else {
    summaryHtml = employeeSummaryHtml
  }

  const rowsHtml = records.map(r => `
    <tr>
      <td>${localDateStr(r.created_at)}</td>
      <td>${r.employees.name}</td>
      <td>${jobDisplayLabel(r)}${r.performed_by ? ' · ' + r.performed_by : ''}${r.fotoservice ? ' · Foto' : ''}${r.custom_duration_minutes ? ' · ' + Math.round(r.custom_duration_minutes/60) + ' Std' : ''}${r.extra_arbeit_1_code ? ' · +' + r.extra_arbeit_1_code : ''}${r.extra_arbeit_2_code ? ' · +' + r.extra_arbeit_2_code : ''}</td>
      <td>${r.ref_no || '-'}</td>
      <td>${fmtEur(recordPrice(r))}</td>
    </tr>`).join('')

  // KAPSAMLI ZAMAN BAZLI RAPORLAMA: seçilen Zeitraum birden fazla gün
  // kapsıyorsa (Woche/Monat/özel aralık), gün gün kırılım tablosu.
  let dailyBreakdownHtml = ''
  if(start !== end){
    const byDate = {}
    records.forEach(r=>{
      const d = localDateStr(r.created_at)
      if(!byDate[d]) byDate[d] = { normal:0, mts:0, privat:0, branch: Object.fromEntries(BRANCHES.map(b=>[b,0])) }
      const price = recordPrice(r)
      if(r.job_types.is_mts) byDate[d].mts += price
      else if(r.job_types.code === 'Privat') byDate[d].privat += price
      else byDate[d].normal += price
      const branch = resolveRecordBranch(r, dayBranchMap)
      if(branch && byDate[d].branch[branch] !== undefined) byDate[d].branch[branch] += price
    })
    const days = Object.keys(byDate).sort()
    if(days.length){
      dailyBreakdownHtml = `
        <div class="card">
          <label>Tägliche Aufschlüsselung</label>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Datum</th><th>Normal</th><th>MTS</th><th>Privat</th>${BRANCHES.map(b=>`<th>${b}</th>`).join('')}<th>Gesamt</th></tr></thead>
              <tbody>
                ${days.map(d=>{
                  const row = byDate[d]
                  const total = row.normal + row.mts + row.privat
                  return `<tr>
                    <td>${d}</td>
                    <td>${fmtEur(row.normal)}</td>
                    <td>${fmtEur(row.mts)}</td>
                    <td>${fmtEur(row.privat)}</td>
                    ${BRANCHES.map(b=>`<td>${fmtEur(row.branch[b])}</td>`).join('')}
                    <td>${fmtEur(total)}</td>
                  </tr>`
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `
    }
  }

  main.innerHTML = `
    <button class="refresh" id="refreshBtn">↻ Aktualisieren</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    <button class="refresh" id="empCatReportBtn">👤 Mitarbeiter Raporu</button>
    <button class="refresh" id="branchCatReportBtn">🏬 Şube Kategori Raporu</button>
      <button class="refresh" id="mtsProformaReportBtn">🧾 MTS Proforma</button>
    ${pushCardHtml}
    ${rangeHeaderHtml}
    <div class="card">
      <div class="revenue-total">${fmtEur(totalRevenue)}</div>
      <div class="revenue-total-net">Netto Umsatz: ${fmtEur(normalRevenue * 0.75 + mtsRevenue + privatRevenue)}</div>
      <div class="revenue-split">
        <div class="revenue-box">
          <div class="amount">${fmtEur(normalRevenue)}</div>
          <div class="net">Netto (75%): ${fmtEur(normalRevenue * 0.75)}</div>
          <div class="sub">Normal</div>
        </div>
        <div class="revenue-box mts">
          <div class="amount">${fmtEur(mtsRevenue)}</div>
          <div class="sub">MTS</div>
        </div>
        <div class="revenue-box privat">
          <div class="amount">${fmtEur(privatRevenue)}</div>
          <div class="sub">Privatkunden</div>
        </div>
      </div>
    </div>
    <div class="card">
      <label>Umsatz nach Filiale</label>
      <div class="revenue-split">
        ${BRANCHES.map(b => `
          <div class="revenue-box">
            <div class="amount" style="color:var(--ink);font-size:16px;">${fmtEur(branchRevenue[b])}</div>
            <div class="sub">${b}</div>
          </div>`).join('')}
      </div>
      ${unassigned > 0 ? `<div class="sub" style="margin-top:10px;text-align:center;">Keine Filiale angegeben: ${fmtEur(unassigned)}</div>` : ''}
    </div>
    ${dailyBreakdownHtml}
    <div class="card">
      <label>Zusammenfassung pro Mitarbeiter</label>
      ${employeeFilterHtml}
      ${summaryHtml}
    </div>
    <div class="card">
      <label>Alle Einträge (${records.length})</label>
      <table>
        <thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Auftrag</th><th>Nr.</th><th>Betrag</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `
  wireBossControls()
}

// ============ ŞEF PANELİ — MİTARBEİTER RAPORU (kategori bazlı) ============
// Aylık, çalışan başına: toplam saat + kategori bazlı iş sayısı (GW/NW/
// SW/Foto/MTS/SR/Privat/Sonstiges — bkz. job_types.category, schema_v24.sql).
// AKT/şasi numarası GÖSTERİLMEZ, sadece sayım.
async function renderEmployeeCategoryReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  // new Date(y, m, 0).toISOString() KULLANMA — yerel saat dilimi UTC'nin
  // İLERİSİNDEYSE (Almanya her zaman öyle, UTC+1/+2) ayın son günü UTC'ye
  // çevrilirken bir önceki güne kayar, ayın son günü rapordan DÜŞER.
  // .getDate() ise yerel takvim gününü doğrudan okur, zaman dilimi
  // dönüşümünden etkilenmez (bkz. renderEmployeeMonthlyReport'taki aynı desen).
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  const [recordsRes, hoursRes] = await Promise.all([
    supabase.from('records').select('*, employees(name, akt_no), job_types(category)').gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate)),
    supabase.from('daily_hours').select('*, employees(name, akt_no)').gte('work_date', startDate).lte('work_date', endDate)
  ])
  const records = recordsRes.data || []
  const hoursRows = hoursRes.data || []

  const byEmp = {}
  function ensure(akt, name){
    if(!byEmp[akt]) byEmp[akt] = { name, hours: 0, categories: {} }
    return byEmp[akt]
  }
  hoursRows.forEach(h=>{
    const e = ensure(h.employees.akt_no, h.employees.name)
    e.hours += Number(h.hours)
  })
  records.forEach(r=>{
    const e = ensure(r.employees.akt_no, r.employees.name)
    const cat = r.job_types.category || 'Sonstiges'
    e.categories[cat] = (e.categories[cat] || 0) + 1
  })

  const aktNos = Object.keys(byEmp).sort((a,b)=> byEmp[b].hours - byEmp[a].hours)

  main.innerHTML = `
    <button class="refresh" id="backToBossBtn">← Zurück</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    <div class="card">
      <label style="margin-top:0;">Monat wählen</label>
      <input type="month" id="empCatMonthInput" value="${monthStr}">
    </div>
    <div class="card">
      <label>Mitarbeiter Raporu — ${monthStr}</label>
      ${aktNos.length === 0 ? '<div class="empty">Keine Daten in diesem Monat</div>' : aktNos.map(akt=>{
        const e = byEmp[akt]
        const catKeys = Object.keys(e.categories).sort((a,b)=> categorySortIndex(a) - categorySortIndex(b))
        return `
          <div class="summary-row">
            <div class="top-row">
              <div>
                <div class="name">${e.name}</div>
                <div class="sub">${akt} · ${e.hours} Std</div>
              </div>
            </div>
            <div class="sub" style="margin-top:6px;">${catKeys.length ? catKeys.map(c=>`${c}: ${e.categories[c]}`).join(' · ') : 'Keine Aufträge'}</div>
          </div>
        `
      }).join('')}
    </div>
  `
  document.getElementById('backToBossBtn').addEventListener('click', renderBossDashboard)
  document.getElementById('empCatMonthInput').addEventListener('change', (e)=>renderEmployeeCategoryReport(e.target.value))
  document.getElementById('pdfBtn').addEventListener('click', ()=>window.print())
}

// ============ ŞEF PANELİ — ŞUBE BAŞINA KATEGORİ RAPORU ============
// Aylık, şube başına: SADECE Normal (%25 komisyon) işler — MTS ve
// Privatkunden HARİÇ. Her şube için toplam ciro + kategori bazlı iş
// sayısı. AKT/şasi numarası GÖSTERİLMEZ. Fotoservice kayıtları, o günün
// daily_hours'una bakılmaksızın doğrudan sahibinin (A3A/W1S/H1A) sabit
// şubesine yazılır (bkz. OWNER_AKT_TO_BRANCH) — böylece owner o gün
// saatini girmemiş olsa bile Foto sayımı kaybolmaz.
async function renderBranchCategoryReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  // new Date(y, m, 0).toISOString() KULLANMA — yerel saat dilimi UTC'nin
  // İLERİSİNDEYSE (Almanya her zaman öyle, UTC+1/+2) ayın son günü UTC'ye
  // çevrilirken bir önceki güne kayar, ayın son günü rapordan DÜŞER.
  // .getDate() ise yerel takvim gününü doğrudan okur, zaman dilimi
  // dönüşümünden etkilenmez (bkz. renderEmployeeMonthlyReport'taki aynı desen).
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  const [recordsRes, hoursRes] = await Promise.all([
    supabase.from('records').select('*, employees(name, akt_no), job_types(category, is_mts, code, price_eur, is_variable_price)').gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate)),
    supabase.from('daily_hours').select('*, employees(name, akt_no)').gte('work_date', startDate).lte('work_date', endDate)
  ])
  const records = recordsRes.data || []
  const hoursRows = hoursRes.data || []

  // Şube ataması artık ana panelle (renderBossDashboard) AYNI paylaşılan
  // buildDayBranchMap()/resolveRecordBranch() fonksiyonlarını kullanıyor —
  // iki rapor aynı dönem için asla farklı şube ciroları göstermez.
  const dayBranchMap = buildDayBranchMap(hoursRows)

  const branchData = {}
  BRANCHES.forEach(b => branchData[b] = { revenue: 0, categories: {} })
  let unassignedCount = 0

  records.forEach(r=>{
    if(r.job_types.is_mts || r.job_types.code === 'Privat') return
    const cat = r.job_types.category || 'Sonstiges'
    const branch = resolveRecordBranch(r, dayBranchMap)
    if(!branch || !branchData[branch]){ unassignedCount += 1; return }
    branchData[branch].revenue += recordPrice(r)
    branchData[branch].categories[cat] = (branchData[branch].categories[cat] || 0) + 1
  })

  main.innerHTML = `
    <button class="refresh" id="backToBossBtn">← Zurück</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    <div class="card">
      <label style="margin-top:0;">Monat wählen</label>
      <input type="month" id="branchCatMonthInput" value="${monthStr}">
    </div>
    <div class="card">
      <label>Şube başına Kategori Raporu — ${monthStr}</label>
      ${BRANCHES.map(b=>{
        const data = branchData[b]
        const catKeys = Object.keys(data.categories).sort((a,c)=> categorySortIndex(a) - categorySortIndex(c))
        return `
          <div class="summary-row">
            <div class="top-row">
              <div class="name">${b}</div>
              <div class="stat"><span class="n">${fmtEur(data.revenue)}</span></div>
            </div>
            <div class="sub" style="margin-top:6px;">${catKeys.length ? catKeys.map(c=>`${c}: ${data.categories[c]} adet`).join(' · ') : 'Keine Aufträge'}</div>
          </div>
        `
      }).join('')}
      ${unassignedCount > 0 ? `<div class="sub" style="margin-top:10px;">Keine Filiale zugeordnet: ${unassignedCount} Auftrag/Aufträge</div>` : ''}
    </div>
  `
  document.getElementById('backToBossBtn').addEventListener('click', renderBossDashboard)
  document.getElementById('branchCatMonthInput').addEventListener('change', (e)=>renderBranchCategoryReport(e.target.value))
  document.getElementById('pdfBtn').addEventListener('click', ()=>window.print())
}

// ============ ŞEF PANELİ — MTS PROFORMA RAPORU ============
// Aylık, SADECE MTS işleri (is_mts=true), tarih sırasına göre, her
// satırda: Datum — okunabilir isim (jobDisplayLabel, bkz. MTS-NW/MTS-GW/
// MTS-SR isimlendirmesi) — AKT-Nummer — Preis. Sonunda toplam.
function formatDateDE(isoDateStr){
  const [y, m, d] = isoDateStr.split('-')
  return `${d}.${m}.${y}`
}

async function renderMtsProformaReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  const { data } = await supabase.from('records').select('*, employees(name, akt_no), job_types(code, name, is_mts, is_variable_price, price_eur)').gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate)).order('created_at', { ascending: true })
  const records = (data || []).filter(r => r.job_types.is_mts)
  const total = records.reduce((sum, r) => sum + recordPrice(r), 0)

  main.innerHTML = `
    <button class="refresh" id="backToBossBtn">← Zurück</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    <div class="card">
      <label style="margin-top:0;">Monat wählen</label>
      <input type="month" id="mtsProformaMonthInput" value="${monthStr}">
    </div>
    <div class="card">
      <label>${monthStr}</label>
      ${records.length === 0 ? '<div class="empty">Keine MTS-Aufträge in diesem Monat</div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Datum</th><th class="print-hide-col">Mitarbeiter</th><th>Bezeichnung</th><th>Nr.</th><th>Preis</th></tr></thead>
            <tbody>
              ${records.map(r => `
                <tr>
                  <td>${formatDateDE(localDateStr(r.created_at))}</td>
                  <td class="print-hide-col">${r.employees.name}</td>
                  <td>${jobDisplayLabel(r)}</td>
                  <td>${r.ref_no || '-'}</td>
                  <td>${fmtEur(recordPrice(r))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="revenue-total" style="margin-top:14px;">${fmtEur(total)}</div>
      `}
    </div>
  `
  document.getElementById('backToBossBtn').addEventListener('click', renderBossDashboard)
  document.getElementById('mtsProformaMonthInput').addEventListener('change', (e)=>renderMtsProformaReport(e.target.value))
  document.getElementById('pdfBtn').addEventListener('click', ()=>window.print())
}

function wireBossControls(){
  document.getElementById('refreshBtn')?.addEventListener('click', renderBossDashboard)
  document.getElementById('enablePushBtn')?.addEventListener('click', enablePushNotifications)
  document.getElementById('resetPushBtn')?.addEventListener('click', resetPushSubscription)
  document.querySelectorAll('.range-chip[data-mode]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bossRange.mode = chip.dataset.mode
      if(bossRange.mode === 'custom' && !bossRange.start){
        const end = new Date()
        const start = new Date(); start.setDate(end.getDate() - 6)
        bossRange.start = start.toISOString().slice(0,10)
        bossRange.end = end.toISOString().slice(0,10)
      }
      renderBossDashboard()
    })
  })
  document.querySelectorAll('.branch-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bossRange.branchFilter = chip.dataset.branch
      renderBossDashboard()
    })
  })
  document.getElementById('rangeApplyBtn')?.addEventListener('click', ()=>{
    const startVal = document.getElementById('rangeStart').value
    const endVal = document.getElementById('rangeEnd').value
    if(!startVal || !endVal){ showToast('Bitte Von und Bis auswählen'); return }
    if(startVal > endVal){ showToast('"Von" muss vor oder gleich "Bis" liegen'); return }
    bossRange.start = startVal
    bossRange.end = endVal
    renderBossDashboard()
  })
  document.getElementById('employeeFilterSelect')?.addEventListener('change', (e)=>{
    bossRange.employeeFilter = e.target.value
    renderBossDashboard()
  })
  document.querySelectorAll('.emp-range-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bossRange.employeeReportMode = chip.dataset.emprange
      renderBossDashboard()
    })
  })
  let searchTimer = null
  document.getElementById('searchInput')?.addEventListener('input', (e)=>{
    bossRange.search = e.target.value
    clearTimeout(searchTimer)
    searchTimer = setTimeout(renderBossDashboard, 400)
  })
  document.getElementById('pdfBtn')?.addEventListener('click', ()=>window.print())
  document.getElementById('empCatReportBtn')?.addEventListener('click', ()=>renderEmployeeCategoryReport())
  document.getElementById('branchCatReportBtn')?.addEventListener('click', ()=>renderBranchCategoryReport())
  document.getElementById('mtsProformaReportBtn')?.addEventListener('click', ()=>renderMtsProformaReport())
}

// ============ ADMİN — GEÇMİŞE KAYIT EKLEME ============
// Sadece gizli admin hesabı (is_admin && hidden_from_login) için görünür.
// Herhangi bir çalışan adına, herhangi bir geçmiş tarihe, o çalışan
// kendisi girmiş gibi (şifresiz) kayıt ekler.

let backdateSelectedJobType = null

// Admin'in "Geçmişe Kayıt Ekle" formunda seçilen çalışan+tarih için
// daily_hours (saat+şube) kaydını görüntüler; varsa Bearbeiten/Löschen,
// yoksa doğrudan bir ekleme formu gösterir. Fotoservice gibi şube bazlı
// işler o günün daily_hours kaydına bağlı olduğu için, admin bunu
// düzenleyemezse geçmişe dönük Fotoservice kaydı eklenemiyordu — bu
// fonksiyon (schema_v23.sql'deki admin RLS bypass'ı ile birlikte) o
// eksikliği gideriyor.
async function refreshBkDailyHours(){
  const wrap = document.getElementById('bkDailyHoursWrap')
  if(!wrap) return
  const empId = document.getElementById('bkEmployeeSelect').value
  const dateVal = document.getElementById('bkDate').value
  if(!empId || !dateVal){
    wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Für Stunden/Filiale-Verwaltung zuerst Mitarbeiter und Datum auswählen.</div>`
    return
  }
  wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Lädt...</div>`
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  const { data } = await supabase.from('daily_hours').select('*').eq('employee_id', empId).eq('work_date', dateVal).maybeSingle()
  if(data){
    wrap.innerHTML = `
      <div class="card" style="margin:10px 0;padding:12px;">
        <label style="margin-top:0;">${empName} — Stunden/Filiale am ${dateVal}</label>
        <div class="hours-saved">✓ Gespeichert: ${data.hours} Std · ${data.branch || 'keine Filiale angegeben'}</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="secondary" id="bkHoursEditBtn">Bearbeiten</button>
          <button class="secondary" id="bkHoursDeleteBtn" style="color:var(--red);">Löschen</button>
        </div>
      </div>
    `
    document.getElementById('bkHoursEditBtn').addEventListener('click', ()=>renderBkHoursForm(empId, dateVal, data))
    document.getElementById('bkHoursDeleteBtn').addEventListener('click', async ()=>{
      if(!confirm('Diese Stunden/Filiale-Eintragung für ' + dateVal + ' löschen?')) return
      const { error, count } = await supabase.from('daily_hours').delete({ count: 'exact' }).eq('id', data.id)
      if(error){ showToast('Fehler: ' + error.message); return }
      if(!count){ showToast('Fehler: Konnte nicht gelöscht werden — evtl. keine Berechtigung.'); return }
      showToast('Gelöscht')
      refreshBkDailyHours()
    })
  } else {
    renderBkHoursForm(empId, dateVal, null)
  }
}

function renderBkHoursForm(empId, dateVal, existing){
  const wrap = document.getElementById('bkDailyHoursWrap')
  if(!wrap) return
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  wrap.innerHTML = `
    <div class="card" style="margin:10px 0;padding:12px;">
      <label style="margin-top:0;">${empName} bu tarihte (${dateVal}) kaç saat çalıştı?</label>
      <div class="hours-row" style="margin-bottom:10px;">
        <input type="number" id="bkHoursInput" placeholder="z.B. 8" step="0.5" min="0" max="16" value="${existing ? existing.hours : ''}">
      </div>
      <label>${empName} bu tarihte hangi şubede çalıştı?</label>
      <div class="job-list" id="bkBranchList" style="margin-bottom:10px;">
        ${BRANCHES.map(b => `<div class="job-btn branch-btn${existing && existing.branch === b ? ' selected' : ''}" data-branch="${b}"><span class="code">${b}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="primary" id="bkHoursSaveBtn">Speichern</button>
        ${existing ? '<button class="secondary" id="bkHoursCancelBtn">Abbrechen</button>' : ''}
      </div>
    </div>
  `
  let pickedBranch = existing ? existing.branch : null
  wrap.querySelectorAll('#bkBranchList .branch-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      wrap.querySelectorAll('#bkBranchList .branch-btn').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      pickedBranch = btn.dataset.branch
    })
  })
  document.getElementById('bkHoursSaveBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('bkHoursInput').value
    const num = parseFloat(val)
    if(isNaN(num) || num <= 0){ showToast('Bitte gültige Stundenzahl eingeben'); return }
    if(!pickedBranch){ showToast('Bitte Filiale auswählen'); return }
    const { error } = await supabase.from('daily_hours').upsert({
      employee_id: empId,
      work_date: dateVal,
      hours: num,
      branch: pickedBranch
    }, { onConflict: 'employee_id,work_date' })
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast('Gespeichert')
    refreshBkDailyHours()
  })
  if(existing){
    document.getElementById('bkHoursCancelBtn').addEventListener('click', refreshBkDailyHours)
  }
}

// Admin'in "Geçmişe Kayıt Ekle" formunda seçilen çalışan+tarih için o
// güne ait TÜM Auftrag (records) kayıtlarını listeler, tek tek silme ve
// "Bu günü tamamen temizle" (o güne ait tüm records + daily_hours)
// seçeneği sunar. schema_v27.sql'deki admin bypass sayesinde 48 saatten
// eski kayıtlar da silinebilir.
async function refreshBkDayRecords(){
  const wrap = document.getElementById('bkDayRecordsWrap')
  if(!wrap) return
  const empId = document.getElementById('bkEmployeeSelect').value
  const dateVal = document.getElementById('bkDate').value
  if(!empId || !dateVal){
    wrap.innerHTML = ''
    return
  }
  wrap.innerHTML = `<div class="sub" style="margin:10px 0;">Lädt...</div>`
  const empName = employees.find(e => e.id === empId)?.name || 'Mitarbeiter'
  const { data } = await supabase.from('records').select('*, job_types(code, name, is_mts, is_variable_price, is_quantity, is_aufbereitung, requires_ref, price_eur)').eq('employee_id', empId).gte('created_at', startOfDayISO(dateVal)).lt('created_at', endOfDayISO(dateVal)).order('created_at', { ascending: false })
  const records = data || []

  wrap.innerHTML = `
    <div class="card" style="margin:10px 0;padding:12px;">
      <label style="margin-top:0;">${empName} — ${dateVal} tarihli Aufträge (${records.length})</label>
      ${records.length === 0 ? '<div class="empty" style="padding:10px 0;">Bu tarihte kayıt yok</div>' : `
        <div class="entry-list">
          ${records.map(r => `
            <div class="entry" data-bkrecrow="${r.id}">
              <div><span class="code">${r.job_types.code}</span><span class="ref">${r.ref_no ? ' · ' + r.ref_no : ''}</span></div>
              <div class="right">
                <span class="extra">${fmtEur(recordPrice(r))}</span>
                <button class="secondary" data-bkrecedit="${r.id}" style="padding:4px 8px;">Bearbeiten</button>
                <button class="del-btn" data-bkrecdel="${r.id}" title="Löschen">×</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
      <button class="secondary" id="bkClearDayBtn" style="margin-top:10px;color:var(--red);">🗑 Bu günü tamamen temizle</button>
    </div>
  `
  wrap.querySelectorAll('[data-bkrecdel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return
      const { error, count } = await supabase.from('records').delete({ count: 'exact' }).eq('id', btn.dataset.bkrecdel)
      if(error){ showToast('Fehler: ' + error.message); return }
      if(!count){ showToast('Fehler: Konnte nicht gelöscht werden — evtl. keine Berechtigung.'); return }
      showToast('Gelöscht')
      refreshBkDayRecords()
    })
  })
  wrap.querySelectorAll('[data-bkrecedit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = records.find(rec => rec.id === btn.dataset.bkrecedit)
      if(r) renderBkRecordEditForm(r)
    })
  })
  document.getElementById('bkClearDayBtn').addEventListener('click', async ()=>{
    if(!confirm(`${empName} için ${dateVal} tarihindeki TÜM kayıtlar (işler + saat/şube) silinecek. Emin misiniz?`)) return
    const results = await Promise.all(records.map(r => supabase.from('records').delete({ count: 'exact' }).eq('id', r.id)))
    const recError = results.find(res => res.error)
    if(recError){ showToast('Fehler: ' + recError.error.message); return }
    const deletedCount = results.reduce((sum, res) => sum + (res.count || 0), 0)
    if(deletedCount < records.length){
      showToast(`Fehler: Nur ${deletedCount} von ${records.length} Aufträgen konnten gelöscht werden — evtl. keine Berechtigung.`)
      refreshBkDayRecords()
      return
    }
    // daily_hours için 0 silinmesi normal olabilir (o gün için hiç saat
    // girilmemiş olabilir) — bu yüzden burada count kontrolü YAPILMIYOR.
    const { error: dhError } = await supabase.from('daily_hours').delete().eq('employee_id', empId).eq('work_date', dateVal)
    if(dhError){ showToast('Fehler: ' + dhError.message); return }
    showToast('Tag komplett gelöscht')
    refreshBkDayRecords()
    refreshBkDailyHours()
  })
}

// Bir Auftrag kaydının AKT-Nummer, (varsa) manuel fiyatı ve (varsa)
// Regiestunde saatini düzenlemek için küçük bir inline form. İş tipini,
// miktarı, Extra Arbeit seçimlerini veya MTS alt türünü değiştirmek
// KAPSAM DIŞI — bunlar için kayıt silinip yeniden eklenmeli.
// schema_v28.sql'deki admin-only UPDATE politikası gerekiyor.
function renderBkRecordEditForm(r){
  const row = document.querySelector(`[data-bkrecrow="${r.id}"]`)
  if(!row) return
  const showRef = r.job_types.requires_ref !== false
  const showPrice = r.job_types.is_variable_price && r.job_types.code !== 'FOTOSERVICE'
  const showRegiestunde = r.job_types.is_aufbereitung || r.job_types.code === 'Regiestunde'
  row.outerHTML = `
    <div class="entry" data-bkrecrow="${r.id}" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div class="code">${r.job_types.code} — bearbeiten</div>
      ${showRef ? `<div><label style="margin-top:0;">AKT-Nummer</label><input type="text" id="bkEditRef-${r.id}" value="${r.ref_no || ''}"></div>` : ''}
      ${showPrice ? `<div><label style="margin-top:0;">Preis (€)</label><input type="number" id="bkEditPrice-${r.id}" value="${r.custom_price ?? ''}" step="0.01" min="0"></div>` : ''}
      ${showRegiestunde ? `<div><label style="margin-top:0;">Regiestunde (Std.)</label><input type="number" id="bkEditRegie-${r.id}" value="${r.regiestunde ?? ''}" step="0.5" min="0"></div>` : ''}
      <div style="display:flex;gap:8px;">
        <button class="primary" id="bkEditSave-${r.id}">Speichern</button>
        <button class="secondary" id="bkEditCancel-${r.id}">Abbrechen</button>
      </div>
    </div>
  `
  document.getElementById(`bkEditCancel-${r.id}`).addEventListener('click', refreshBkDayRecords)
  document.getElementById(`bkEditSave-${r.id}`).addEventListener('click', async ()=>{
    const payload = {}
    if(showRef) payload.ref_no = document.getElementById(`bkEditRef-${r.id}`).value.trim() || null
    if(showPrice){
      const val = document.getElementById(`bkEditPrice-${r.id}`).value
      if(!val || parseFloat(val) <= 0){ showToast('Bitte gültigen Preis eingeben'); return }
      payload.custom_price = parseFloat(val)
    }
    if(showRegiestunde){
      const val = document.getElementById(`bkEditRegie-${r.id}`).value
      payload.regiestunde = val ? parseFloat(val) : null
    }
    const { error } = await supabase.from('records').update(payload).eq('id', r.id)
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast('Gespeichert')
    refreshBkDayRecords()
  })
}

function wireAdminBackdateForm(){
  const card = document.getElementById('adminBackdateCard')
  if(!card) return
  backdateSelectedJobType = null
  const extraValid = () => !!document.getElementById('bkEmployeeSelect').value && !!document.getElementById('bkDate').value
  wireJobForm('bk', ()=>backdateSelectedJobType, (jt)=>{ backdateSelectedJobType = jt }, extraValid)
  document.getElementById('bkEmployeeSelect').addEventListener('change', ()=>{
    validateJobForm('bk', ()=>backdateSelectedJobType, extraValid)
    refreshBkDailyHours()
    refreshBkDayRecords()
  })
  document.getElementById('bkDate').addEventListener('change', ()=>{
    validateJobForm('bk', ()=>backdateSelectedJobType, extraValid)
    refreshBkDailyHours()
    refreshBkDayRecords()
  })
  refreshBkDailyHours()
  refreshBkDayRecords()
  document.getElementById('bkAddBtn').addEventListener('click', async ()=>{
    const empId = document.getElementById('bkEmployeeSelect').value
    const dateVal = document.getElementById('bkDate').value
    if(!empId){ showToast('Bitte Mitarbeiter auswählen'); return }
    if(!dateVal){ showToast('Bitte Datum auswählen'); return }
    // localDateStr() kullanılıyor (todayStr() DEĞİL) — todayStr() UTC tarihini
    // döndürüyor; Almanya saatiyle 00:00-02:00 arası UTC hâlâ "dün" olabilir,
    // bu da bugünün tarihini yanlışlıkla "gelecekte" gibi reddedebilirdi.
    const localToday = localDateStr(new Date())
    if(dateVal > localToday){ showToast('Datum darf nicht in der Zukunft liegen'); return }
    const jt = backdateSelectedJobType
    if(!jt){ showToast('Bitte Auftragsart auswählen'); return }
    const values = readJobFormValues('bk', jt)
    const createdAtOverride = new Date(dateVal + 'T12:00:00').toISOString()
    const { error, count } = await insertJobRecord({
      jobType: jt,
      employeeId: empId,
      values,
      dateStr: dateVal,
      createdAtOverride
    })
    if(error){ showToast('Fehler: ' + error.message); console.error('Geçmişe kayıt ekleme hatası:', error); return }
    showToast('Rückwirkender Eintrag für ' + dateVal + ' gespeichert')
    backdateSelectedJobType = null
    renderEmployeeDay()
  })
}

tabEmployee.addEventListener('click', ()=>{
  tabEmployee.classList.add('active'); tabBoss.classList.remove('active')
  headerTitle.textContent = 'Mitarbeiter'
  if(currentEmployee){ renderEmployeeDay() } else { renderLogin() }
})

tabBoss.addEventListener('click', ()=>{
  tabBoss.classList.add('active'); tabEmployee.classList.remove('active')
  headerTitle.textContent = 'Chef'
  if(currentEmployee?.is_admin || bossUnlocked){ renderBossDashboard() } else { renderBossPin() }
})

async function startApp(){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  await loadStaticData()

  // Önce gerçek Supabase Auth oturumu var mı kontrol edilir (auth_user_id
  // ile taşınmış çalışanlar için — sayfa yenilenince otomatik giriş).
  const { data: { session } } = await supabase.auth.getSession()
  if(session){
    const emp = employees.find(e => e.auth_user_id === session.user.id)
    if(emp){
      currentEmployee = emp
      localStorage.setItem(SESSION_KEY, emp.id)
      updateLogoutBtn()
      setChromeVisible(true)
      if(emp.is_admin){
        bossUnlocked = true
        tabBoss.classList.add('active'); tabEmployee.classList.remove('active')
        headerTitle.textContent = 'Chef'
        renderBossDashboard()
      } else {
        renderEmployeeDay()
      }
      return
    }
  }

  // Geçiş dönemi: auth_user_id henüz yoksa eski localStorage oturumuna bak.
  const savedId = localStorage.getItem(SESSION_KEY)
  if(savedId){
    const emp = employees.find(e => e.id === savedId)
    if(emp){ currentEmployee = emp; updateLogoutBtn(); setChromeVisible(true); renderEmployeeDay(); return }
  }
  renderLandingScreen()
}

async function init(){
  setChromeVisible(false)
  if(localStorage.getItem(SITE_GATE_KEY) === '1'){
    await startApp()
  } else {
    renderSiteGate()
  }
}
init()
