<style>
  :root{
    --graphite:#1B1E21; --steel:#26292D; --steel-2:#2F3338;
    --amber:#F5A623; --green:#4CAF6D; --red:#E4572E; --blue:#5B9BD5; --purple:#9B7EDE;
    --ink:#ECEDEE; --ink-dim:#9AA0A6; --line:#3A3F44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--graphite); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  .app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header{ padding:calc(20px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; }
  header .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:0 0 4px; }
  h1{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px; margin:0; line-height:1; }
  .logout-btn{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:11px; padding:6px 10px; border-radius:6px; cursor:pointer; white-space:nowrap; margin-top:4px; }
  nav{ display:flex; border-bottom:1px solid var(--line); }
  nav button{ flex:1; background:none; border:none; color:var(--ink-dim); font-weight:600; font-size:14px; padding:14px 8px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.active{ color:var(--amber); border-bottom-color:var(--amber); }
  main{ flex:1; padding:20px; padding-bottom:60px; }
  .card{ background:var(--steel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  select, input{ width:100%; background:var(--steel-2); border:1px solid var(--line); color:var(--ink); font-family:'Inter',sans-serif; font-size:16px; padding:14px; border-radius:8px; margin-bottom:14px; }
  select:focus, input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .job-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:340px; overflow-y:auto; }
  .job-btn{
    background:var(--steel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px;
    padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .job-btn .code{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .job-btn .dur{ font-size:11px; color:var(--ink-dim); }
  .job-btn.selected{ border-color:var(--amber); background:rgba(245,166,35,0.12); }
  .job-btn.selected .code{ color:var(--amber); }
  .mts-tag{ font-size:9px; background:rgba(91,155,213,0.18); color:var(--blue); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .qty-tag{ font-size:9px; background:rgba(155,126,222,0.18); color:var(--purple); padding:2px 6px; border-radius:10px; margin-left:6px; }
  .job-btn .qty-count{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  button.primary{ width:100%; background:var(--amber); color:#1B1E21; border:none; font-weight:700; font-size:16px; padding:16px; border-radius:8px; cursor:pointer; }
  button.primary:disabled{ background:var(--steel-2); color:var(--ink-dim); cursor:not-allowed; }
  button.secondary{ width:100%; background:var(--steel-2); color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:14px; padding:12px; border-radius:8px; cursor:pointer; }
  .hours-row{ display:flex; gap:10px; align-items:center; }
  .hours-row input{ margin-bottom:0; }
  .hours-saved{ font-family:'JetBrains Mono',monospace; color:var(--green); font-size:14px; text-align:center; padding:8px 0; }
  .entry-list{ display:flex; flex-direction:column; gap:8px; }
  .entry{ display:flex; justify-content:space-between; align-items:center; background:var(--steel-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .entry .code{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber); margin-right:8px; }
  .entry .ref{ font-family:'JetBrains Mono',monospace; color:var(--ink); font-size:13px; }
  .entry .extra{ font-size:11px; background:rgba(228,87,46,0.15); color:var(--red); padding:3px 8px; border-radius:20px; font-family:'JetBrains Mono',monospace; margin-left:6px; }
  .entry .right{ display:flex; align-items:center; gap:8px; }
  .del-btn{ background:none; border:1px solid var(--line); color:var(--red); font-size:14px; width:28px; height:28px; border-radius:6px; cursor:pointer; line-height:1; }
  .empty{ text-align:center; color:var(--ink-dim); padding:30px 10px; }
  .empty .big{ font-family:'Barlow Condensed',sans-serif; font-size:20px; color:var(--ink); margin-bottom:6px; }
  .summary-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .top-row{ display:flex; justify-content:space-between; }
  .summary-row .name{ font-weight:600; }
  .summary-row .sub{ font-size:11px; color:var(--ink-dim); }
  .summary-row .stat{ font-family:'JetBrains Mono',monospace; text-align:right; }
  .stat .n{ font-size:16px; font-weight:700; }
  .stat .label{ font-size:10px; color:var(--ink-dim); display:block; }
  .cap-bar{ height:6px; background:var(--steel-2); border-radius:3px; margin-top:6px; overflow:hidden; }
  .cap-fill{ height:100%; background:var(--green); }
  .cap-fill.over{ background:var(--red); }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{ text-align:left; font-size:10px; text-transform:uppercase; color:var(--ink-dim); padding:8px 4px; border-bottom:1px solid var(--line); }
  td{ padding:9px 4px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; }
  .pin-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; }
  .pin-screen input{ max-width:160px; text-align:center; letter-spacing:.3em; font-family:'JetBrains Mono',monospace; font-size:20px; }
  .login-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; text-align:center; }
  .login-screen .box{ width:100%; max-width:320px; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--steel-2); border:1px solid var(--amber); color:var(--ink); padding:12px 20px; border-radius:8px; font-size:14px; z-index:100; }
  .refresh{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px; padding:8px 12px; border-radius:6px; cursor:pointer; margin-bottom:14px; }
  .revenue-split{ display:flex; gap:12px; flex-wrap:wrap; }
  .revenue-box{ flex:1; min-width:30%; text-align:center; padding:12px 6px; background:var(--steel-2); border-radius:8px; }
  .revenue-box .amount{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--green); }
  .revenue-box.mts .amount{ color:var(--blue); }
  .revenue-box.privat .amount{ color:var(--purple); }
  .revenue-box .sub{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
  .revenue-box .net{ font-size:10px; color:var(--ink-dim); margin-top:2px; }
  .revenue-total{ text-align:center; padding:6px 0 2px; font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; }
  .revenue-total-net{ text-align:center; padding:0 0 14px; font-size:11px; color:var(--ink-dim); }
  .range-chips{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .range-chip{ background:var(--steel-2); border:1px solid var(--line); color:var(--ink-dim); font-size:12px; font-weight:600; padding:8px 12px; border-radius:20px; cursor:pointer; }
  .range-chip.active{ background:rgba(245,166,35,0.15); border-color:var(--amber); color:var(--amber); }
  .range-custom{ display:flex; gap:10px; }
  .range-custom > div{ flex:1; }
  .range-custom input{ margin-bottom:0; }
  .search-wrap{ margin-top:10px; }
  .table-wrap{ overflow-x:auto; }
  .table-wrap table{ min-width:560px; }

  .landing-screen{ position:fixed; inset:0; background:#16181B; display:flex; align-items:center; justify-content:center; z-index:50; }
  .landing-screen .stage{ display:flex; flex-direction:column; align-items:center; gap:52px; width:100%; max-width:420px; padding:40px; }
  .landing-screen .brand{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .landing-screen .logo-row{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .landing-screen .logo{ font-family:'Barlow Condensed',sans-serif; font-size:56px; font-weight:800; letter-spacing:-1.5px; color:var(--ink); line-height:1; }
  .landing-screen .logo .accent{ color:#6FA3D8; }
  .landing-screen .cross{ font-size:20px; font-weight:300; color:#7C8B9C; line-height:1; }
  .landing-screen .product{ font-size:13px; font-weight:500; letter-spacing:1px; color:#8B9198; text-transform:lowercase; margin-top:2px; }
  .landing-screen .panel{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .landing-screen .panel select, .landing-screen .panel input{ margin-bottom:0; }
  .btn-login{ width:100%; padding:15px 20px; background:#4A7FB0; color:#fff; border:none; border-radius:4px; font-size:15px; font-weight:600; letter-spacing:.2px; cursor:pointer; transition:background .15s ease; }
  .btn-login:hover{ background:#6FA3D8; }
  .btn-boss{ width:100%; padding:13px 20px; background:transparent; color:#8B9198; border:1px solid #2A2E33; border-radius:4px; font-size:13.5px; cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  .btn-boss:hover{ border-color:#7C8B9C; color:#AAB6C2; }

  .gate-screen{ position:fixed; inset:0; background:#16181B; z-index:100; display:flex; align-items:center; justify-content:center; }
  .gate-screen .box{ width:100%; max-width:300px; padding:40px; text-align:center; }
  .gate-screen .lock{ font-size:32px; margin-bottom:18px; }

  @media print{
    header, nav, .refresh, #pdfBtn, .del-btn, .range-chips, .search-wrap,
    #adminBackdateCard, input, select, #employeeFilterSelect{ display:none !important; }
    body{ background:#fff; color:#000; }
    .card{ border:1px solid #999; break-inside:avoid; background:#fff; }
    .amount, .revenue-total, .stat .n{ color:#000 !important; }
  }
</style>
</head>

<script type="module">

// Site geneli erişim şifresi. Bu SADECE tarayıcı tarafında kontrol edilen

const main = document.getElementById('main')
const headerTitle = document.getElementById('headerTitle')

let bossUnlocked = false

function todayStr(){
  return new Date().toISOString().slice(0,10)
}

function startOfDayISO(dateStr){
  return new Date(dateStr + 'T00:00:00').toISOString()
}

function endOfDayISO(dateStr){
  const d = new Date(dateStr + 'T00:00:00')
  d.setDate(d.getDate() + 1)
  return d.toISOString()
}

function fmtEur(n){
  return '€' + (n||0).toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 })
}

function todayLabel(){
  return new Date().toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' })
}

function recordPrice(r){
  // Not: Fotoservice geliri artık bu kayda değil, ayrı bir FOTOSERVICE
  // kaydına (şubenin sabit sorumlusuna) yazılıyor — bkz. insertJobRecord().
  // 'fotoservice' alanı burada sadece bilgi amaçlı bir etikettir, fiyata eklenmez.
  const base = r.job_types.is_variable_price ? (r.custom_price || 0) : (r.job_types.price_eur || 0)
  return base + (r.regiestunde||0) * REGIESTUNDE_RATE
}

function localDateStr(iso){

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}

}

async function loadStaticData(){
  const { data: emp } = await supabase.from('employees').select('*').eq('active', true).order('name')

// ============ ORTAK İŞ (AUFTRAG) FORMU ============
// Çalışan ekranı ("Neuen Auftrag hinzufügen") ve admin'in "Geçmişe Kayıt
// Ekle" formu aynı alanları/aynı doğrulama+kayıt mantığını kullanır. Bu
// bölüm ikisi arasında paylaşılan, prefix'lenmiş (id çakışmasını önlemek
// için) yardımcı fonksiyonları içerir.

function jobFormHtml(prefix, qtyCounts){
  qtyCounts = qtyCounts || {}
  return `
    <div class="job-list" id="${prefix}JobList">
      ${visibleJobTypes().map(j => `
        <div class="job-btn" data-id="${j.id}">
          <span class="code">${j.code}${j.is_mts ? '<span class="mts-tag">MTS</span>' : ''}${j.is_quantity ? '<span class="qty-tag">Stück</span>' : ''}</span>
          ${j.is_quantity ? `<span class="qty-count">${qtyCounts[j.id]||0}× heute</span>` : ''}
        </div>`).join('')}
    </div>
    <div id="${prefix}RefNoWrap">
      <label>AKT-Nummer oder Fahrgestellnummer</label>
      <input type="text" id="${prefix}RefNo" placeholder="z.B. AKT121212 oder WVW...">
    </div>
    <div id="${prefix}QtyWrap" style="display:none;">
      <label>Anzahl</label>
      <input type="number" id="${prefix}QtyInput" placeholder="z.B. 20" min="1" step="1">
    </div>
    <div id="${prefix}PriceWrap" style="display:none;">
      <label>Preis (€)</label>
      <input type="number" id="${prefix}CustomPrice" placeholder="z.B. 75" step="0.01" min="0">
    </div>
    <div id="${prefix}MtsTypeWrap" style="display:none;">
      <label>Art</label>
      <select id="${prefix}MtsTypeSelect">
        <option value="">Auswählen...</option>
        <option value="Lack">Lack</option>
        <option value="Delle">Delle</option>
      </select>
    </div>
    <div id="${prefix}RegiestundeWrap" style="display:none;">
      <label>Regiestunde Aufbereitung (falls zutreffend, Stunden)</label>
      <select id="${prefix}Regiestunde">
        <option value="">Keine</option>
        ${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}">${n} Std</option>`).join('')}
      </select>
    </div>
    <div id="${prefix}PerformerWrap" style="display:none;">
      <label>Wer hat die Arbeit ausgeführt?</label>
      <select id="${prefix}PerformerSelect">
        <option value="">Auswählen...</option>
        ${SR_DELLE_PERFORMERS.map(p => `<option value="${p}">${p}</option>`).join('')}
      </select>
    </div>
    <div id="${prefix}FotoserviceWrap" style="display:none;">
      <label>Fotoservice (+${FOTOSERVICE_PRICE.toFixed(2)} €)</label>
      <select id="${prefix}FotoserviceSelect">
        <option value="nein">Nein</option>
        <option value="ja">Ja</option>
      </select>
    </div>
    <button class="primary" id="${prefix}AddBtn" disabled>Auftrag hinzufügen</button>
  `
}

// extraValid (isteğe bağlı): iş formu alanları dışında sağlanması gereken
// ek bir koşul (örn. admin'in geçmişe kayıt formunda çalışan+tarih seçili
// olması). Sağlanmadan "Auftrag hinzufügen" butonu etkinleşmez — böylece
// admin formunda eksik alan varken buton tıklansa bile SESSİZCE hiçbir şey
// olmaz izlenimi yerine, buton zaten devre dışı kalır.
function validateJobForm(prefix, getSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  const jt = getSelected()
  const extraOk = extraValid ? extraValid() : true
  if(!jt){ $('AddBtn').disabled = true; return }
  let ok = true
  if(jt.is_quantity){
    const qtyVal = $('QtyInput').value
    ok = qtyVal && parseInt(qtyVal) > 0
  } else {
    const refNo = $('RefNo').value.trim()
    ok = !!refNo
    if(jt.is_variable_price){
      const priceVal = $('CustomPrice').value
      ok = ok && priceVal && parseFloat(priceVal) > 0
    }
    if(jt.code === 'SR-Delle'){
      ok = ok && !!$('PerformerSelect').value
    }
    if(jt.code === 'MTS-SR'){
      ok = ok && !!$('MtsTypeSelect').value
    }
  }
  $('AddBtn').disabled = !(ok && extraOk)
}

function wireJobForm(prefix, getSelected, setSelected, extraValid){
  const $ = (id) => document.getElementById(prefix + id)
  $('JobList').querySelectorAll('.job-btn[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $('JobList').querySelectorAll('.job-btn[data-id]').forEach(b=>b.classList.remove('selected'))
      btn.classList.add('selected')
      const jt = jobTypes.find(j => j.id === btn.dataset.id)
      setSelected(jt)
      $('RefNoWrap').style.display = jt.is_quantity ? 'none' : 'block'
      $('QtyWrap').style.display = jt.is_quantity ? 'block' : 'none'
      $('RegiestundeWrap').style.display = jt.is_aufbereitung ? 'block' : 'none'
      $('PriceWrap').style.display = jt.is_variable_price ? 'block' : 'none'
      $('PerformerWrap').style.display = jt.code === 'SR-Delle' ? 'block' : 'none'
      $('MtsTypeWrap').style.display = jt.code === 'MTS-SR' ? 'block' : 'none'
      $('FotoserviceWrap').style.display = FOTOSERVICE_JOB_CODES.includes(jt.code) ? 'block' : 'none'
      if(!jt.is_aufbereitung) $('Regiestunde').value = ''
      if(jt.code !== 'SR-Delle') $('PerformerSelect').value = ''
      if(jt.code !== 'MTS-SR') $('MtsTypeSelect').value = ''
      if(!FOTOSERVICE_JOB_CODES.includes(jt.code)) $('FotoserviceSelect').value = 'nein'
      if(jt.is_quantity) $('QtyInput').value = ''
      validateJobForm(prefix, getSelected, extraValid)
    })
  })
  ;['RefNo','QtyInput','CustomPrice'].forEach(id=>{
    $(id).addEventListener('input', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
  ;['PerformerSelect','MtsTypeSelect'].forEach(id=>{
    $(id).addEventListener('change', ()=>validateJobForm(prefix, getSelected, extraValid))
  })
}

function readJobFormValues(prefix, jt){
  const $ = (id) => document.getElementById(prefix + id)
  if(jt.is_quantity){
    return { qty: parseInt($('QtyInput').value) }
  }
  return {
    refNo: $('RefNo').value.trim(),
    regiestunde: $('Regiestunde').value ? parseInt($('Regiestunde').value) : null,
    customPrice: $('CustomPrice').value ? parseFloat($('CustomPrice').value) : null,
    performedBy: $('PerformerSelect').value || null,
    mtsSubtype: $('MtsTypeSelect').value || null,
    fotoservice: $('FotoserviceSelect').value === 'ja'
  }
}

async function lookupBranchForDate(employeeId, dateStr){
  const { data } = await supabase.from('daily_hours').select('branch').eq('employee_id', employeeId).eq('work_date', dateStr).maybeSingle()
  return data?.branch || null
}

// Merkezi kayıt ekleme fonksiyonu — hem çalışanın kendi girişi hem de
// admin'in geçmişe dönük girişi bunu kullanır. Fotoservice = Ja seçiliyse,
// ana işin kendi süresi/fiyatı girene ait kalır; Fotoservice'in 8 dakikası
// ve 9,88 €'su ayrı bir FOTOSERVICE kaydı olarak, o günkü şubenin sabit
// sorumlusuna (BRANCH_FOTOSERVICE_OWNER) yazılır.
async function insertJobRecord({ jobType, employeeId, values, dateStr, createdAtOverride }){
  const createdAtField = createdAtOverride ? { created_at: createdAtOverride } : {}

  if(jobType.is_quantity){
    const rows = Array.from({ length: values.qty }, () => ({
      employee_id: employeeId,
      job_type_id: jobType.id,
      ref_no: null,
      regiestunde: null,
      ...createdAtField
    }))
    const { error } = await supabase.from('records').insert(rows)
    return { error, count: values.qty }
  }

  const wantsFotoservice = FOTOSERVICE_JOB_CODES.includes(jobType.code) && values.fotoservice
  let ownerEmployeeId = null

  if(wantsFotoservice){
    const branch = await lookupBranchForDate(employeeId, dateStr)
    const ownerAktNo = branch && BRANCH_FOTOSERVICE_OWNER[branch]
    if(!ownerAktNo){
      return { error: { message: 'Für diesen Tag ist keine Filiale hinterlegt — Fotoservice kann nicht zugeordnet werden.' } }
    }
    const owner = employees.find(e => e.akt_no === ownerAktNo)
    if(!owner){
      return { error: { message: `Fotoservice-Empfänger (${ownerAktNo}) wurde nicht gefunden.` } }
    }
    ownerEmployeeId = owner.id
  }

  const payload = {
    employee_id: employeeId,
    job_type_id: jobType.id,
    ref_no: values.refNo,
    regiestunde: values.regiestunde,
    ...createdAtField
  }
  if(jobType.is_variable_price) payload.custom_price = values.customPrice
  if(jobType.code === 'SR-Delle') payload.performed_by = values.performedBy
  if(jobType.code === 'MTS-SR') payload.mts_subtype = values.mtsSubtype
  if(FOTOSERVICE_JOB_CODES.includes(jobType.code)) payload.fotoservice = values.fotoservice

  const rowsToInsert = [payload]

  if(wantsFotoservice){
    const fotoJobType = jobTypes.find(j => j.code === 'FOTOSERVICE')
    if(!fotoJobType){
      return { error: { message: 'FOTOSERVICE Auftragsart fehlt in der Datenbank (siehe schema_v14.sql).' } }
    }
    rowsToInsert.push({
      employee_id: ownerEmployeeId,
      job_type_id: fotoJobType.id,
      ref_no: values.refNo,
      regiestunde: null,
      fotoservice: false, // NOT NULL kolon — bulk insert'te satırlar farklı
                          // key setine sahipse eksik alan DEFAULT yerine
                          // açıkça null gönderilir, bu yüzden burada bilerek belirtiliyor.
      ...createdAtField
    })
  }

  const { error } = await supabase.from('records').insert(rowsToInsert)
  return { error, count: 1 }
}

async function authenticateEmployee(emp, password){

async function renderEmployeeMonthlyReport(monthStr){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  monthStr = monthStr || todayStr().slice(0,7)
  const [y, m] = monthStr.split('-').map(Number)
  const startDate = `${monthStr}-01`
  const lastDay = new Date(y, m, 0).getDate()
  const endDate = `${monthStr}-${String(lastDay).padStart(2,'0')}`

  const [hoursRes, recordsRes] = await Promise.all([
    supabase.from('daily_hours').select('*').eq('employee_id', currentEmployee.id).gte('work_date', startDate).lte('work_date', endDate).order('work_date'),
    supabase.from('records').select('*, job_types(code, name, is_mts, is_variable_price, price_eur)').eq('employee_id', currentEmployee.id).gte('created_at', startOfDayISO(startDate)).lt('created_at', endOfDayISO(endDate)).order('created_at')
  ])

  const hoursByDay = {}
  ;(hoursRes.data||[]).forEach(h=>{ hoursByDay[h.work_date] = Number(h.hours) })

  const records = recordsRes.data || []
  const recordsByDay = {}
  records.forEach(r=>{
    const d = localDateStr(r.created_at)
    if(!recordsByDay[d]) recordsByDay[d] = []
    recordsByDay[d].push(r)
  })

  const allDays = Array.from(new Set([...Object.keys(hoursByDay), ...Object.keys(recordsByDay)])).sort()

  let totalHours = 0, normal = 0, mts = 0, privat = 0
  Object.values(hoursByDay).forEach(h => totalHours += h)
  records.forEach(r=>{
    const price = recordPrice(r)
    if(r.job_types.is_mts) mts += price
    else if(r.job_types.code === 'Privat') privat += price
    else normal += price
  })
  const netto = normal * 0.75 + mts + privat

  const dayRowsHtml = allDays.length ? allDays.map(d=>{
    const recs = recordsByDay[d] || []
    const jobsLabel = recs.length ? recs.map(r=>r.job_types.code).join(', ') : '—'
    return `
      <div class="summary-row">
        <div class="top-row">
          <div>
            <div class="name">${d}</div>
            <div class="sub">${jobsLabel}</div>
          </div>
          <div class="stat">
            <span class="n">${hoursByDay[d] !== undefined ? hoursByDay[d] + ' Std' : '-'}</span>
            <span class="label">${recs.length} Aufträge</span>
          </div>
        </div>
      </div>`
  }).join('') : '<div class="empty">Keine Daten in diesem Monat</div>'

  main.innerHTML = `
    <button class="secondary" id="backToDayBtn" style="margin-bottom:14px;">← Zurück</button>
    <div class="card">
      <label>Monat wählen</label>
      <input type="month" id="reportMonthInput" value="${monthStr}" max="${todayStr().slice(0,7)}">
    </div>
    <div class="card">
      <label>${monthStr} — Zusammenfassung</label>
      <div class="revenue-total">${fmtEur(netto)}</div>
      <div class="revenue-total-net" style="margin-bottom:8px;">Netto Umsatz (Normal 25% abgezogen)</div>
      <div class="sub" style="text-align:center;">${records.length} Aufträge · ${totalHours} Std insgesamt</div>
    </div>
    <div class="card">
      <label>Tag für Tag</label>
      ${dayRowsHtml}
    </div>
  `
  document.getElementById('backToDayBtn').addEventListener('click', renderEmployeeDay)
  document.getElementById('reportMonthInput').addEventListener('change', (e)=>{
    renderEmployeeMonthlyReport(e.target.value)
  })
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4)
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/')
  const rawData = atob(base64)
  const outputArray = new Uint8Array(rawData.length)
  for(let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i)
  return outputArray
}

async function getPushSubscriptionStatus(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported'
  const reg = await navigator.serviceWorker.ready
  const sub = await reg.pushManager.getSubscription()
  if(!sub) return 'not-subscribed'
  // VAPID anahtarları yenilendiyse eski anahtarla oluşturulmuş abonelikler
  // artık geçersizdir ama tarayıcıda kayıtlı kalmaya devam eder. Böyle bir
  // uyuşmazlık tespit edilirse aboneliği otomatik temizleyip butonu tekrar
  // gösteriyoruz — aksi halde buton hiç çıkmaz ama bildirim de gelmez.
  try {
    const currentKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    const subKey = sub.options && sub.options.applicationServerKey
    if(subKey){
      const subKeyArr = new Uint8Array(subKey)
      const mismatch = subKeyArr.length !== currentKey.length || !subKeyArr.every((v,i)=>v===currentKey[i])
      if(mismatch){
        await sub.unsubscribe()
        return 'not-subscribed'
      }
    }
  } catch(e) { /* karşılaştırma desteklenmiyorsa mevcut durumu koru */ }
  return 'subscribed'
}

async function resetPushSubscription(){
  try {
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.getSubscription()
    if(sub) await sub.unsubscribe()
    showToast('Zurückgesetzt')

  } catch(e){
    showToast('Fehler: ' + e.message)
  }
}

async function enablePushNotifications(){
  try {
    const permission = await Notification.requestPermission()
    if(permission !== 'granted'){ showToast('Benachrichtigungen wurden nicht erlaubt'); return }
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    })
    const json = sub.toJSON()
    const { error } = await supabase.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' })
    if(error){ showToast('Fehler: ' + error.message); return }
    showToast('Benachrichtigungen aktiviert')
    renderBossDashboard()
  } catch(e){
    showToast('Fehler: ' + e.message)
  }
}

function currentRangeDates(){
  const today = todayStr()
  if(bossRange.mode === 'today') return { start: today, end: today }
  if(bossRange.mode === 'week'){
    const d = new Date(); const day = (d.getDay()+6)%7 // Montag=0
    const monday = new Date(d); monday.setDate(d.getDate()-day)
    return { start: monday.toISOString().slice(0,10), end: today }
  }
  if(bossRange.mode === 'month'){
    const d = new Date()
    const first = new Date(d.getFullYear(), d.getMonth(), 1)
    return { start: first.toISOString().slice(0,10), end: today }
  }
  return { start: bossRange.start || today, end: bossRange.end || today }
}

async function renderBossDashboard(){
  main.innerHTML = `<div class="empty">Lädt...</div>`

  const { start, end } = currentRangeDates()
  const [recordsRes, hoursRes, pushStatus] = await Promise.all([
    supabase.from('records').select('*, employees(name, akt_no), job_types(code, name, duration_minutes, price_eur, is_mts, is_variable_price)').gte('created_at', startOfDayISO(start)).lt('created_at', endOfDayISO(end)).order('created_at', { ascending: false }),
    supabase.from('daily_hours').select('*, employees(name, akt_no)').gte('work_date', start).lte('work_date', end),
    getPushSubscriptionStatus()
  ])

  const allRecords = recordsRes.data || []
  const hours = hoursRes.data || []

  const isHiddenAdmin = !!(currentEmployee?.is_admin && currentEmployee?.hidden_from_login)
  const adminBackdateHtml = isHiddenAdmin ? `
    <div class="card" id="adminBackdateCard">
      <label>⏱ Geçmişe Kayıt Ekle (Admin)</label>
      ${!currentEmployee.auth_user_id ? `
        <div class="sub" style="color:var(--red);margin:-4px 0 14px;">
          ⚠ Bu hesap henüz gerçek Supabase Auth'a bağlı değil (auth_user_id boş).
          Kayıt eklemeyi denerseniz sunucu güvenlik kuralı (RLS) isteği
          reddedebilir. Migrate-employees fonksiyonunu bu hesap için de
          çalıştırmanız gerekebilir.
        </div>
      ` : ''}
      <label style="margin-top:0;">Mitarbeiter</label>
      <select id="bkEmployeeSelect">
        <option value="">Auswählen...</option>
        ${employees.filter(e=>!e.hidden_from_login).map(e => `<option value="${e.id}">${e.name} (${e.akt_no})</option>`).join('')}
      </select>
      <label>Datum</label>
      <input type="date" id="bkDate" max="${localDateStr(new Date())}">
      ${jobFormHtml('bk', {})}
    </div>
  ` : ''

  const pushCardHtml = pushStatus === 'unsupported' ? '' : `
    <div class="card">
      ${pushStatus === 'subscribed'
        ? '<div class="sub" style="color:var(--green);">✓ Tägliche Benachrichtigung (17:30) aktiv</div><button class="secondary" id="resetPushBtn" style="margin-top:10px;">🔄 Zurücksetzen</button>'
        : '<button class="secondary" id="enablePushBtn">🔔 Tägliche Benachrichtigung aktivieren</button>'}
    </div>
  `

  const rangeHeaderHtml = `
    <div class="card">
      <label>Zeitraum</label>
      <div class="range-chips">
        <div class="range-chip ${bossRange.mode==='today'?'active':''}" data-mode="today">Heute</div>
        <div class="range-chip ${bossRange.mode==='week'?'active':''}" data-mode="week">Diese Woche</div>
        <div class="range-chip ${bossRange.mode==='month'?'active':''}" data-mode="month">Dieser Monat</div>
        <div class="range-chip ${bossRange.mode==='custom'?'active':''}" data-mode="custom">Zeitraum wählen</div>
      </div>
      ${bossRange.mode === 'custom' ? `
        <div class="range-custom">
          <div><label>Von</label><input type="date" id="rangeStart" value="${bossRange.start || start}"></div>
          <div><label>Bis</label><input type="date" id="rangeEnd" value="${bossRange.end || end}"></div>
        </div>
        <button class="secondary" id="rangeApplyBtn">Bericht anzeigen</button>
      ` : `<div class="sub" style="color:var(--ink-dim);font-size:12px;">${start === end ? start : start + ' – ' + end}</div>`}
      <div class="search-wrap">
        <label>Suche nach AKT-/Fahrgestellnummer</label>
        <input type="text" id="searchInput" placeholder="z.B. AKT121212" value="${bossRange.search || ''}">
      </div>
      <div class="search-wrap">
        <label>Filiale</label>
        <div class="range-chips">
          <div class="range-chip branch-chip ${!bossRange.branchFilter?'active':''}" data-branch="">Alle</div>
          ${BRANCHES.map(b => `<div class="range-chip branch-chip ${bossRange.branchFilter===b?'active':''}" data-branch="${b}">${b}</div>`).join('')}
        </div>
      </div>
    </div>
  `

  const hoursMap = {}
  const branchMap = {}
  hours.forEach(h => {
    hoursMap[h.employees.akt_no] = (hoursMap[h.employees.akt_no] || 0) + Number(h.hours)
    branchMap[h.employees.akt_no] = h.branch
  })

  const search = (bossRange.search || '').trim().toLowerCase()
  const branchFilter = bossRange.branchFilter || ''
  const employeeFilter = bossRange.employeeFilter || ''
  let records = search ? allRecords.filter(r => (r.ref_no||'').toLowerCase().includes(search)) : allRecords
  if(branchFilter){
    records = records.filter(r => branchMap[r.employees.akt_no] === branchFilter)
  }
  // HATA DÜZELTMESİ: çalışan filtresi artık Zeitraum ile birlikte TÜM
  // rapor bölümlerine (toplamlar, şube dağılımı, tablo) uygulanıyor —
  // önceden sadece "Zusammenfassung pro Mitarbeiter" kartını etkiliyordu.
  if(employeeFilter){
    records = records.filter(r => r.employees.akt_no === employeeFilter)
  }

  if(allRecords.length === 0){
    main.innerHTML = `
      <button class="refresh" id="refreshBtn">↻ Aktualisieren</button>
      <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
      ${adminBackdateHtml}
      ${pushCardHtml}
      ${rangeHeaderHtml}
      <div class="empty"><p class="big">Keine Aufträge in diesem Zeitraum</p></div>`
    wireBossControls()
    return
  }

  let normalRevenue = 0, mtsRevenue = 0, privatRevenue = 0
  records.forEach(r=>{
    const price = recordPrice(r)
    if(r.job_types.is_mts) mtsRevenue += price
    else if(r.job_types.code === 'Privat') privatRevenue += price
    else normalRevenue += price
  })
  const totalRevenue = normalRevenue + mtsRevenue + privatRevenue

  const branchRevenue = {}
  BRANCHES.forEach(b => branchRevenue[b] = 0)
  let unassigned = 0
  records.forEach(r=>{
    const branch = branchMap[r.employees.akt_no]
    if(branch && branchRevenue[branch] !== undefined){
      branchRevenue[branch] += recordPrice(r)
    } else {
      unassigned += recordPrice(r)
    }
  })

  const summary = {}
  records.forEach(r=>{
    const key = r.employees.akt_no
    if(!summary[key]) summary[key] = { name: r.employees.name, akt_no: key, count:0, revenue:0, workedMinutes:0 }
    summary[key].count += 1
    summary[key].revenue += recordPrice(r)
    summary[key].workedMinutes += r.job_types.duration_minutes + (r.regiestunde||0)*60
  })

  function summaryRowHtml(s){
    const declaredHours = hoursMap[s.akt_no]
    const declaredMinutes = declaredHours !== undefined ? declaredHours * 60 : null
    const capPct = declaredMinutes ? Math.round((s.workedMinutes / declaredMinutes) * 100) : null
    return `
      <div class="summary-row">
        <div class="top-row">
          <div>
            <div class="name">${s.name}</div>
            <div class="sub">${s.akt_no} · ${declaredHours !== undefined ? declaredHours + ' Std · ' + (branchMap[s.akt_no] || '-') : 'keine Stunden erfasst'}</div>
          </div>
          <div class="stat">
            <span class="n">${fmtEur(s.revenue)}</span>
            <span class="label">${s.count} Aufträge</span>
          </div>
        </div>
        ${capPct !== null ? `
          <div class="cap-bar"><div class="cap-fill ${capPct>100?'over':''}" style="width:${Math.min(capPct,100)}%;"></div></div>
          <div class="sub" style="margin-top:4px;">Kapazität: %${capPct} (${Math.round(s.workedMinutes)} Min. Arbeit / ${declaredMinutes} Min. Anwesenheit)</div>
        ` : ''}
      </div>`
  }

  const summaryEntries = Object.values(summary).sort((a,b)=>b.revenue-a.revenue)
  let summaryHtml
  if(!employeeFilter){
    summaryHtml = summaryEntries.map(summaryRowHtml).join('')
  } else {
    const match = summaryEntries.find(s => s.akt_no === employeeFilter)
    if(match){
      summaryHtml = summaryRowHtml(match)
    } else {
      const emp = employees.find(e => e.akt_no === employeeFilter)
      const declaredHours = hoursMap[employeeFilter]
      summaryHtml = emp ? `
        <div class="summary-row">
          <div class="name">${emp.name}</div>
          <div class="sub">${emp.akt_no} · ${declaredHours !== undefined ? declaredHours + ' Std · ' + (branchMap[employeeFilter] || '-') : 'keine Stunden erfasst'}</div>
          <div class="empty" style="padding:14px 0;">Keine Aufträge in diesem Zeitraum</div>
        </div>` : ''
    }
  }

  const employeeFilterHtml = `
    <label style="margin-top:0;">Mitarbeiter filtern</label>
    <select id="employeeFilterSelect">
      <option value="">Alle Mitarbeiter</option>
      ${employees.map(e => `<option value="${e.akt_no}" ${employeeFilter===e.akt_no?'selected':''}>${e.name} (${e.akt_no})</option>`).join('')}
    </select>
  `

  const rowsHtml = records.map(r => `
    <tr>
      <td>${r.employees.name}</td>
      <td>${r.job_types.code}${r.job_types.is_mts ? ' (MTS)' : ''}${r.mts_subtype ? ' · ' + r.mts_subtype : ''}${r.performed_by ? ' · ' + r.performed_by : ''}${r.fotoservice ? ' · Foto' : ''}</td>
      <td>${r.ref_no || '-'}</td>
      <td>${fmtEur(recordPrice(r))}</td>
    </tr>`).join('')

  // KAPSAMLI ZAMAN BAZLI RAPORLAMA: seçilen Zeitraum birden fazla gün
  // kapsıyorsa (Woche/Monat/özel aralık), gün gün kırılım tablosu.
  let dailyBreakdownHtml = ''
  if(start !== end){
    const byDate = {}
    records.forEach(r=>{
      const d = localDateStr(r.created_at)
      if(!byDate[d]) byDate[d] = { normal:0, mts:0, privat:0, branch: Object.fromEntries(BRANCHES.map(b=>[b,0])) }
      const price = recordPrice(r)
      if(r.job_types.is_mts) byDate[d].mts += price
      else if(r.job_types.code === 'Privat') byDate[d].privat += price
      else byDate[d].normal += price
      const branch = branchMap[r.employees.akt_no]
      if(branch && byDate[d].branch[branch] !== undefined) byDate[d].branch[branch] += price
    })
    const days = Object.keys(byDate).sort()
    if(days.length){
      dailyBreakdownHtml = `
        <div class="card">
          <label>Tägliche Aufschlüsselung</label>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Datum</th><th>Normal</th><th>MTS</th><th>Privat</th>${BRANCHES.map(b=>`<th>${b}</th>`).join('')}<th>Gesamt</th></tr></thead>
              <tbody>
                ${days.map(d=>{
                  const row = byDate[d]
                  const total = row.normal + row.mts + row.privat
                  return `<tr>
                    <td>${d}</td>
                    <td>${fmtEur(row.normal)}</td>
                    <td>${fmtEur(row.mts)}</td>
                    <td>${fmtEur(row.privat)}</td>
                    ${BRANCHES.map(b=>`<td>${fmtEur(row.branch[b])}</td>`).join('')}
                    <td>${fmtEur(total)}</td>
                  </tr>`
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `
    }
  }

  main.innerHTML = `
    <button class="refresh" id="refreshBtn">↻ Aktualisieren</button>
    <button class="refresh" id="pdfBtn">📄 Als PDF speichern</button>
    ${adminBackdateHtml}
    ${pushCardHtml}
    ${rangeHeaderHtml}
    <div class="card">
      <div class="revenue-total">${fmtEur(totalRevenue)}</div>
      <div class="revenue-total-net">Netto Umsatz: ${fmtEur(normalRevenue * 0.75 + mtsRevenue + privatRevenue)}</div>
      <div class="revenue-split">
        <div class="revenue-box">
          <div class="amount">${fmtEur(normalRevenue)}</div>
          <div class="net">Netto (75%): ${fmtEur(normalRevenue * 0.75)}</div>
          <div class="sub">Normal</div>
        </div>
        <div class="revenue-box mts">
          <div class="amount">${fmtEur(mtsRevenue)}</div>
          <div class="sub">MTS</div>
        </div>
        <div class="revenue-box privat">
          <div class="amount">${fmtEur(privatRevenue)}</div>
          <div class="sub">Privatkunden</div>
        </div>
      </div>
    </div>
    <div class="card">
      <label>Umsatz nach Filiale</label>
      <div class="revenue-split">
        ${BRANCHES.map(b => `
          <div class="revenue-box">
            <div class="amount" style="color:var(--ink);font-size:16px;">${fmtEur(branchRevenue[b])}</div>
            <div class="sub">${b}</div>
          </div>`).join('')}
      </div>
      ${unassigned > 0 ? `<div class="sub" style="margin-top:10px;text-align:center;">Keine Filiale angegeben: ${fmtEur(unassigned)}</div>` : ''}
    </div>
    ${dailyBreakdownHtml}
    <div class="card">
      <label>Zusammenfassung pro Mitarbeiter</label>
      ${employeeFilterHtml}
      ${summaryHtml}
    </div>
    <div class="card">
      <label>Alle Einträge (${records.length})</label>
      <table>
        <thead><tr><th>Mitarbeiter</th><th>Auftrag</th><th>Nr.</th><th>Betrag</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `
  wireBossControls()
}

function wireBossControls(){
  document.getElementById('refreshBtn')?.addEventListener('click', renderBossDashboard)
  document.getElementById('enablePushBtn')?.addEventListener('click', enablePushNotifications)
  document.getElementById('resetPushBtn')?.addEventListener('click', resetPushSubscription)
  document.querySelectorAll('.range-chip[data-mode]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bossRange.mode = chip.dataset.mode
      if(bossRange.mode === 'custom' && !bossRange.start){
        const end = new Date()
        const start = new Date(); start.setDate(end.getDate() - 6)
        bossRange.start = start.toISOString().slice(0,10)
        bossRange.end = end.toISOString().slice(0,10)
      }
      renderBossDashboard()
    })
  })
  document.querySelectorAll('.branch-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      bossRange.branchFilter = chip.dataset.branch
      renderBossDashboard()
    })
  })
  document.getElementById('rangeApplyBtn')?.addEventListener('click', ()=>{
    const startVal = document.getElementById('rangeStart').value
    const endVal = document.getElementById('rangeEnd').value
    if(!startVal || !endVal){ showToast('Bitte Von und Bis auswählen'); return }
    if(startVal > endVal){ showToast('"Von" muss vor oder gleich "Bis" liegen'); return }
    bossRange.start = startVal
    bossRange.end = endVal
    renderBossDashboard()
  })
  document.getElementById('employeeFilterSelect')?.addEventListener('change', (e)=>{
    bossRange.employeeFilter = e.target.value
    renderBossDashboard()
  })
  let searchTimer = null
  document.getElementById('searchInput')?.addEventListener('input', (e)=>{
    bossRange.search = e.target.value
    clearTimeout(searchTimer)
    searchTimer = setTimeout(renderBossDashboard, 400)
  })
  document.getElementById('pdfBtn')?.addEventListener('click', ()=>window.print())
  wireAdminBackdateForm()
}

// ============ ADMİN — GEÇMİŞE KAYIT EKLEME ============
// Sadece gizli admin hesabı (is_admin && hidden_from_login) için görünür.
// Herhangi bir çalışan adına, herhangi bir geçmiş tarihe, o çalışan
// kendisi girmiş gibi (şifresiz) kayıt ekler.

let backdateSelectedJobType = null

function wireAdminBackdateForm(){
  const card = document.getElementById('adminBackdateCard')
  if(!card) return
  backdateSelectedJobType = null
  const extraValid = () => !!document.getElementById('bkEmployeeSelect').value && !!document.getElementById('bkDate').value
  wireJobForm('bk', ()=>backdateSelectedJobType, (jt)=>{ backdateSelectedJobType = jt }, extraValid)
  document.getElementById('bkEmployeeSelect').addEventListener('change', ()=>validateJobForm('bk', ()=>backdateSelectedJobType, extraValid))
  document.getElementById('bkDate').addEventListener('change', ()=>validateJobForm('bk', ()=>backdateSelectedJobType, extraValid))
  document.getElementById('bkAddBtn').addEventListener('click', async ()=>{
    const empId = document.getElementById('bkEmployeeSelect').value
    const dateVal = document.getElementById('bkDate').value
    if(!empId){ showToast('Bitte Mitarbeiter auswählen'); return }
    if(!dateVal){ showToast('Bitte Datum auswählen'); return }
    // localDateStr() kullanılıyor (todayStr() DEĞİL) — todayStr() UTC tarihini
    // döndürüyor; Almanya saatiyle 00:00-02:00 arası UTC hâlâ "dün" olabilir,
    // bu da bugünün tarihini yanlışlıkla "gelecekte" gibi reddedebilirdi.
    const localToday = localDateStr(new Date())
    if(dateVal > localToday){ showToast('Datum darf nicht in der Zukunft liegen'); return }
    const jt = backdateSelectedJobType
    if(!jt){ showToast('Bitte Auftragsart auswählen'); return }
    const values = readJobFormValues('bk', jt)
    const createdAtOverride = new Date(dateVal + 'T12:00:00').toISOString()
    const { error, count } = await insertJobRecord({
      jobType: jt,
      employeeId: empId,
      values,
      dateStr: dateVal,
      createdAtOverride
    })
    if(error){ showToast('Fehler: ' + error.message); console.error('Geçmişe kayıt ekleme hatası:', error); return }
    showToast('Rückwirkender Eintrag für ' + dateVal + ' gespeichert')
    backdateSelectedJobType = null
    renderBossDashboard()
  })
}

// ============ TAB YÖNETİMİ ============

tabEmployee.addEventListener('click', ()=>{
  tabEmployee.classList.add('active'); tabBoss.classList.remove('active')
  headerTitle.textContent = 'Mitarbeiter'
  if(currentEmployee){ renderEmployeeDay() } else { renderLogin() }
})

tabBoss.addEventListener('click', ()=>{
  tabBoss.classList.add('active'); tabEmployee.classList.remove('active')
  headerTitle.textContent = 'Chef'
  if(currentEmployee?.is_admin || bossUnlocked){ renderBossDashboard() } else { renderBossPin() }
})

async function startApp(){
  main.innerHTML = `<div class="empty">Lädt...</div>`
  await loadStaticData()

  // Önce gerçek Supabase Auth oturumu var mı kontrol edilir (auth_user_id
  // ile taşınmış çalışanlar için — sayfa yenilenince otomatik giriş).
  const { data: { session } } = await supabase.auth.getSession()
  if(session){
    const emp = employees.find(e => e.auth_user_id === session.user.id)
    if(emp){
      currentEmployee = emp
      localStorage.setItem(SESSION_KEY, emp.id)
      updateLogoutBtn()
      setChromeVisible(true)
      if(emp.is_admin){
        bossUnlocked = true
        tabBoss.classList.add('active'); tabEmployee.classList.remove('active')
        headerTitle.textContent = 'Chef'
        renderBossDashboard()
      } else {
        renderEmployeeDay()
      }
      return
    }
  }

  // Geçiş dönemi: auth_user_id henüz yoksa eski localStorage oturumuna bak.
  const savedId = localStorage.getItem(SESSION_KEY)
  if(savedId){
    const emp = employees.find(e => e.id === savedId)
    if(emp){ currentEmployee = emp; updateLogoutBtn(); setChromeVisible(true); renderEmployeeDay(); return }
  }
  renderLandingScreen()
}

async function init(){
  setChromeVisible(false)
  if(localStorage.getItem(SITE_GATE_KEY) === '1'){
    await startApp()
  } else {
    renderSiteGate()
  }
}
init()

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{})
  })
}
